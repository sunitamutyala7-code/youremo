<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YouRemo - Find Friends</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =====================================================
       NAVBAR
       ===================================================== -->

  <header class="navbar">

    <div class="logo">
      YouRemo
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="friends.html">Friends</a>
      <a href="requests.html">Requests</a>
      <a href="profile.html">Profile</a>
      <a href="myfriends.html">My Friends</a>
      <a href="about.html">About</a>
    </nav>

    <div
      id="accountButton"
      class="account-button"
      onclick="handleAccountClick()">

      <div
        id="navAvatar"
        class="nav-avatar">
        ?
      </div>

      <span id="loginButton">
        Login
      </span>

    </div>

    <div
      id="accountMenu"
      class="account-menu">

      <button onclick="goToMyProfile()">
        My Profile
      </button>

      <button onclick="openEditProfile()">
        Edit Profile
      </button>

      <button onclick="logout()">
        Logout
      </button>

    </div>

  </header>


  <!-- =====================================================
       MAIN
       ===================================================== -->

  <main>

    <section class="friends-section page-section">

      <h1>
        Find Your Friends
      </h1>

      <p class="section-text">
        Search for people and start connecting.
      </p>


      <!-- SEARCH -->

      <div class="search-box">

        <input
          type="text"
          id="friendSearch"
          placeholder="Search by name or username..."
          autocomplete="off">

        <button
          onclick="searchFriends()">
          Search
        </button>

      </div>


      <!-- SEARCH RESULTS -->

      <div
        id="friendResults"
        class="friend-results">

        <div class="empty-state">

          <div>👥</div>

          <h2>
            Find Friends
          </h2>

          <p>
            Enter a name or username to find people on YouRemo.
          </p>

        </div>

      </div>

    </section>

  </main>


  <!-- =====================================================
       FOOTER
       ===================================================== -->

  <footer>

    <p>
      © 2026 YouRemo. All rights reserved.
    </p>

  </footer>


  <!-- =====================================================
       SUPABASE
       ===================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- =====================================================
       YOUR JAVASCRIPT
       ===================================================== -->

  <script src="script.js"></script>

</body>

</html>
