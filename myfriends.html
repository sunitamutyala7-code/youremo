<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YouRemo - My Friends</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =====================================================
       NAVBAR
       ===================================================== -->

  <header class="navbar">

    <div class="logo">
      YouRemo
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="friends.html">Friends</a>
      <a href="requests.html">Requests</a>
      <a href="profile.html">Profile</a>
      <a href="myfriends.html">My Friends</a>
      <a href="about.html">About</a>
    </nav>


    <!-- ACCOUNT -->

    <div
      id="accountButton"
      class="account-button"
      onclick="handleAccountClick()">

      <div
        id="navAvatar"
        class="nav-avatar">

        ?

      </div>

      <span id="loginButton">
        Login
      </span>

    </div>


    <!-- ACCOUNT MENU -->

    <div
      id="accountMenu"
      class="account-menu">

      <button onclick="goToMyProfile()">
        My Profile
      </button>

      <button onclick="openEditProfile()">
        Edit Profile
      </button>

      <button onclick="logout()">
        Logout
      </button>

    </div>

  </header>


  <!-- =====================================================
       MAIN
       ===================================================== -->

  <main>

    <section
      class="friends-list-section page-section">


      <!-- PAGE TITLE -->

      <h1>
        My Friends
      </h1>

      <p class="section-text">
        People you're connected with on YouRemo.
      </p>


      <!-- FRIEND COUNT -->

      <div class="friends-page-header">

        <h2>
          Your Connections
        </h2>

        <span
          id="friendCount"
          class="friend-count">

          0 Friends

        </span>

      </div>


      <!-- FRIEND LIST -->

      <div
        id="myFriendsList"
        class="friend-results">

        <div class="empty-state">

          <div>
            ⏳
          </div>

          <h2>
            Loading friends...
          </h2>

          <p>
            Please wait.
          </p>

        </div>

      </div>


      <!-- FIND MORE FRIENDS -->

      <div class="page-action">

        <button
          class="primary-btn"
          onclick="window.location.href='friends.html'">

          Find More Friends

        </button>

      </div>

    </section>

  </main>


  <!-- =====================================================
       FOOTER
       ===================================================== -->

  <footer>

    <p>
      © 2026 YouRemo. All rights reserved.
    </p>

  </footer>


  <!-- =====================================================
       SUPABASE
       ===================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <!-- =====================================================
       YOUR JAVASCRIPT
       ===================================================== -->

  <script src="script.js"></script>

</body>

</html>
