<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YouRemo - My Friends</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       NAVBAR
       ========================= -->

  <header class="navbar">

    <div class="logo">
      YouRemo
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="friends.html">Friends</a>
      <a href="requests.html">Requests</a>
      <a href="profile.html">Profile</a>
      <a href="myfriends.html">My Friends</a>
      <a href="about.html">About</a>
    </nav>

    <div
      id="accountButton"
      class="account-button"
      onclick="handleAccountClick()">

      <div id="navAvatar" class="nav-avatar">
        ?
      </div>

      <span id="loginButton">
        Login
      </span>

    </div>

    <div
      id="accountMenu"
      class="account-menu">

      <button onclick="goToMyProfile()">
        My Profile
      </button>

      <button onclick="openEditProfile()">
        Edit Profile
      </button>

      <button onclick="logout()">
        Logout
      </button>

    </div>

  </header>


  <!-- =========================
       MY FRIENDS PAGE
       ========================= -->

  <main>

    <section class="friends-list-section">

      <h1>
        My Friends
      </h1>

      <p class="section-text">
        People you're connected with on YouRemo.
      </p>


      <!-- FRIEND COUNT -->

      <div class="friend-count-box">

        <span>
          👥
        </span>

        <strong id="friendCount">
          0 Friends
        </strong>

      </div>


      <!-- FRIENDS LIST -->

      <div
        id="myFriendsList"
        class="friend-results">

        <div class="empty-state">

          <div>
            ⏳
          </div>

          <p>
            Loading friends...
          </p>

        </div>

      </div>
<div class="my-friends-action">

  <button
    class="primary-btn"
    type="button"
    onclick="window.location.href='friends.html'">

    Find More Friends

  </button>

</div>

      <!-- FIND MORE FRIENDS -->

      

  <!-- =========================
       SUPABASE
       ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <!-- =========================
       YOUREMO JAVASCRIPT
       ========================= -->

  <script src="script.js"></script>

</body>

</html>
