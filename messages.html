<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YouRemo - Messages</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =====================================================
       NAVBAR
       ===================================================== -->

  <header class="navbar">

    <div class="logo">
      YouRemo
    </div>

    <nav class="main-nav">

      <a href="index.html" title="Home">🏠</a>

      <a href="friends.html" title="Find Friends">🔎</a>

      <a href="requests.html" title="Requests">🤝</a>

      <a href="myfriends.html" title="My Friends">👥</a>

      <a href="messages.html" title="Messages">💬</a>

      <a href="profile.html" title="Profile">👤</a>

    </nav>


    <div
      id="accountButton"
      class="account-button"
      onclick="handleAccountClick()">

      <div
        id="navAvatar"
        class="nav-avatar">
        ?
      </div>

      <span id="loginButton">
        Login
      </span>

    </div>


    <div
      id="accountMenu"
      class="account-menu">

      <button onclick="goToMyProfile()">
        My Profile
      </button>

      <button onclick="openEditProfile()">
        Edit Profile
      </button>

      <button onclick="logout()">
        Logout
      </button>

    </div>

  </header>


  <!-- =====================================================
       MAIN
       ===================================================== -->

  <main class="messages-page">

    <div class="messages-header">

      <h1>
        💬 Messages
      </h1>

      <p>
        Chat with your friends and connections.
      </p>

    </div>


    <!-- =====================================================
         MESSAGE LAYOUT
         ===================================================== -->

    <div class="messages-layout">


      <!-- =================================================
           LEFT - FRIENDS
           ================================================= -->

      <aside class="conversation-list">

        <div class="conversation-search">

          <input
            type="text"
            id="messageFriendSearch"
            placeholder="Search friends..."
            oninput="filterMessageFriends()">

        </div>


        <div id="conversationList">

          <div class="loading-conversations">
            Loading friends...
          </div>

        </div>

      </aside>


      <!-- =================================================
           RIGHT - CHAT
           ================================================= -->

      <section class="chat-area">


        <!-- CHAT HEADER -->

        <div
          id="chatHeader"
          class="chat-header">

          <div class="chat-empty-title">
            💬 Select a friend
          </div>

        </div>


        <!-- CHAT MESSAGES -->

        <div
          id="chatMessages"
          class="chat-messages">

          <div class="empty-state">

            <div>
              💬
            </div>

            <h2>
              Your Messages
            </h2>

            <p>
              Select a friend to start chatting.
            </p>

          </div>

        </div>


        <!-- MESSAGE INPUT -->

        <div
          id="messageInputArea"
          class="message-input-area"
          style="display:none;">

          <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."
            autocomplete="off"
            onkeydown="handleMessageKey(event)">

          <button
            type="button"
            onclick="sendMessage()">

            Send

          </button>

        </div>

      </section>

    </div>

  </main>


  <!-- =====================================================
       SUPABASE
       ===================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <!-- =====================================================
       YOUR MAIN SCRIPT
       ===================================================== -->

  <script src="script.js"></script>


  <!-- =====================================================
       MESSAGES SCRIPT
       ===================================================== -->

  <script>

    /* =====================================================
       VARIABLES
       ===================================================== */

    let messageFriends = [];

    let selectedMessageFriend = null;

    let messageRealtimeChannel = null;


    /* =====================================================
       LOAD FRIENDS
       ===================================================== */

    async function loadMessageFriends() {

      const container =
        document.getElementById(
          "conversationList"
        );


      if (!container) {

        console.error(
          "conversationList not found"
        );

        return;

      }


      container.innerHTML = `
        <div class="loading-conversations">
          Loading friends...
        </div>
      `;


      try {

        /* ---------------------------------------------
           CURRENT USER
           --------------------------------------------- */

        const {
          data: {
            user
          },
          error: userError
        } =
          await supabaseClient.auth.getUser();


        if (userError) {

          console.error(
            "User error:",
            userError
          );

          showConversationError(
            userError.message
          );

          return;

        }


        if (!user) {

          container.innerHTML = `

            <div class="empty-conversation">

              <div class="conversation-icon">
                🔐
              </div>

              <div>

                <strong>
                  Login required
                </strong>

                <p>
                  Login to see your friends.
                </p>

              </div>

            </div>

          `;

          return;

        }


        console.log(
          "👤 Logged in user:",
          user.id
        );


        /* ---------------------------------------------
           FRIENDSHIPS
           --------------------------------------------- */

        const {
          data: friendships,
          error: friendshipError
        } =
          await supabaseClient
            .from("friendships")
            .select("*")
            .or(
              `user_id.eq.${user.id},friend_id.eq.${user.id}`
            );


        if (friendshipError) {

          console.error(
            "❌ Friendship error:",
            friendshipError
          );

          showConversationError(
            friendshipError.message
          );

          return;

        }


        console.log(
          "👥 Friendships:",
          friendships
        );


        if (
          !friendships ||
          friendships.length === 0
        ) {

          container.innerHTML = `

            <div class="empty-conversation">

              <div class="conversation-icon">
                👥
              </div>

              <div>

                <strong>
                  No friends yet
                </strong>

                <p>
                  Add a friend to start chatting.
                </p>

              </div>

            </div>

          `;

          return;

        }


        /* ---------------------------------------------
           FIND OTHER USER IDs
           --------------------------------------------- */

        const friendIds =
          friendships
            .map(friendship => {

              if (
                friendship.user_id === user.id
              ) {

                return friendship.friend_id;

              }

              return friendship.user_id;

            })
            .filter(Boolean);


        const uniqueFriendIds =
          [...new Set(friendIds)];


        console.log(
          "🆔 Friend IDs:",
          uniqueFriendIds
        );


        if (
          uniqueFriendIds.length === 0
        ) {

          container.innerHTML = `

            <div class="empty-conversation">

              <div class="conversation-icon">
                👥
              </div>

              <div>

                <strong>
                  No friends found
                </strong>

                <p>
                  Add a friend to start chatting.
                </p>

              </div>

            </div>

          `;

          return;

        }


        /* ---------------------------------------------
           LOAD PROFILES
           --------------------------------------------- */

        const {
          data: profiles,
          error: profileError
        } =
          await supabaseClient
            .from("profiles")
            .select("*")
            .in(
              "id",
              uniqueFriendIds
            );


        if (profileError) {

          console.error(
            "❌ Profile error:",
            profileError
          );

          showConversationError(
            profileError.message
          );

          return;

        }


        console.log(
          "👤 Friend profiles:",
          profiles
        );


        messageFriends =
          profiles || [];


        renderMessageFriends();


      } catch (error) {

        console.error(
          "❌ Messages loading error:",
          error
        );

        showConversationError(
          error.message
        );

      }

    }


    /* =====================================================
       ERROR DISPLAY
       ===================================================== */

    function showConversationError(
      message
    ) {

      const container =
        document.getElementById(
          "conversationList"
        );


      if (!container) return;


      container.innerHTML = `

        <div class="empty-conversation">

          <div class="conversation-icon">
            ⚠️
          </div>

          <div>

            <strong>
              Could not load friends
            </strong>

            <p>
              ${escapeMessage(message)}
            </p>

          </div>

        </div>

      `;

    }


    /* =====================================================
       RENDER FRIENDS
       ===================================================== */

    function renderMessageFriends(
      searchText = ""
    ) {

      const container =
        document.getElementById(
          "conversationList"
        );


      if (!container) return;


      const search =
        searchText
          .toLowerCase()
          .trim();


      const filtered =
        messageFriends.filter(
          friend => {

            const name =
              (
                friend.full_name ||
                friend.name ||
                friend.username ||
                ""
              ).toLowerCase();


            const username =
              (
                friend.username ||
                ""
              ).toLowerCase();


            return (
              name.includes(search) ||
              username.includes(search)
            );

          }
        );


      if (
        filtered.length === 0
      ) {

        container.innerHTML = `

          <div class="empty-conversation">

            <div class="conversation-icon">
              🔎
            </div>

            <div>

              <strong>
                No friends found
              </strong>

              <p>
                Try another search.
              </p>

            </div>

          </div>

        `;

        return;

      }


      container.innerHTML =
        filtered
          .map(friend => {

            const name =
              friend.full_name ||
              friend.name ||
              friend.username ||
              "Friend";


            const initial =
              name
                .charAt(0)
                .toUpperCase();


            const avatar =
              friend.avatar_url ||
              friend.profile_photo ||
              friend.photo_url ||
              "";


            return `

              <div
                class="conversation"
                onclick="openConversation('${friend.id}')">

                <div class="conversation-avatar">

                  ${
                    avatar

                      ?

                      `
                        <img
                          src="${avatar}"
                          alt="${escapeMessage(name)}">
                      `

                      :

                      initial
                  }

                </div>


                <div class="conversation-info">

                  <strong>
                    ${escapeMessage(name)}
                  </strong>

                  <p>

                    ${
                      friend.username

                        ?

                        "@" +
                        escapeMessage(
                          friend.username
                        )

                        :

                        "Start a conversation"
                    }

                  </p>

                </div>

              </div>

            `;

          })
          .join("");

    }


    /* =====================================================
       SEARCH FRIENDS
       ===================================================== */

    function filterMessageFriends() {

      const input =
        document.getElementById(
          "messageFriendSearch"
        );


      if (!input) return;


      renderMessageFriends(
        input.value
      );

    }


    /* =====================================================
       OPEN CONVERSATION
       ===================================================== */

    async function openConversation(
      friendId
    ) {

      const friend =
        messageFriends.find(
          person =>
            person.id === friendId
        );


      if (!friend) {

        console.error(
          "Friend not found:",
          friendId
        );

        return;

      }


      selectedMessageFriend =
        friend;


      const name =
        friend.full_name ||
        friend.name ||
        friend.username ||
        "Friend";


      const avatar =
        friend.avatar_url ||
        friend.profile_photo ||
        friend.photo_url ||
        "";


      const header =
        document.getElementById(
          "chatHeader"
        );


      const inputArea =
        document.getElementById(
          "messageInputArea"
        );


      if (header) {

        header.innerHTML = `

          <div class="chat-user">

            <div class="conversation-avatar">

              ${
                avatar

                  ?

                  `
                    <img
                      src="${avatar}"
                      alt="${escapeMessage(name)}">
                  `

                  :

                  name
                    .charAt(0)
                    .toUpperCase()
              }

            </div>


            <div>

              <strong>
                ${escapeMessage(name)}
              </strong>

              <p>

                ${
                  friend.username
                    ? "@" +
                      escapeMessage(
                        friend.username
                      )
                    : ""
                }

              </p>

            </div>

          </div>

        `;

      }


      if (inputArea) {

        inputArea.style.display =
          "flex";

      }


      await loadConversation(
        friendId
      );


      const input =
        document.getElementById(
          "messageInput"
        );


      if (input) {

        input.focus();

      }

    }


    /* =====================================================
       LOAD CONVERSATION
       ===================================================== */

    async function loadConversation(
      friendId
    ) {

      const chat =
        document.getElementById(
          "chatMessages"
        );


      if (!chat) return;


      const {
        data: {
          user
        }
      } =
        await supabaseClient.auth.getUser();


      if (!user) return;


      chat.innerHTML = `

        <div class="loading-conversations">
          Loading messages...
        </div>

      `;


      const {
        data,
        error
      } =
        await supabaseClient
          .from("messages")
          .select("*")
          .or(
            `and(sender_id.eq.${user.id},receiver_id.eq.${friendId}),and(sender_id.eq.${friendId},receiver_id.eq.${user.id})`
          )
          .order(
            "created_at",
            {
              ascending: true
            }
          );


      if (error) {

        console.error(
          "❌ Message loading error:",
          error
        );


        chat.innerHTML = `

          <div class="empty-state">

            <div>
              ⚠️
            </div>

            <h2>
              Unable to load messages
            </h2>

            <p>
              ${escapeMessage(error.message)}
            </p>

          </div>

        `;

        return;

      }


      if (
        !data ||
        data.length === 0
      ) {

        chat.innerHTML = `

          <div class="empty-state">

            <div>
              👋
            </div>

            <h2>
              Start chatting
            </h2>

            <p>
              Send your first message to this friend.
            </p>

          </div>

        `;

        await markMessagesAsSeen(
          friendId,
          user.id
        );

        return;

      }


      chat.innerHTML =
        data
          .map(message => {

            const mine =
              message.sender_id ===
              user.id;


            const seenText =
              mine
                ? (
                    message.seen
                      ? "✓✓ Seen"
                      : "✓ Sent"
                  )
                : "";


            const time =
              message.created_at
                ? formatMessageTime(
                    message.created_at
                  )
                : "";


            return `

              <div
                class="message-row ${
                  mine
                    ? "mine"
                    : "theirs"
                }">

                <div>

                  <div class="message-bubble">

                    ${escapeMessage(
                      message.message
                    )}

                  </div>


                  <div class="message-time">

                    ${time}

                    ${
                      mine
                        ? " · " +
                          seenText
                        : ""
                    }

                  </div>

                </div>

              </div>

            `;

          })
          .join("");


      chat.scrollTop =
        chat.scrollHeight;


      /* Mark incoming messages as seen */

      await markMessagesAsSeen(
        friendId,
        user.id
      );

    }


    /* =====================================================
       FORMAT TIME
       ===================================================== */

    function formatMessageTime(
      dateString
    ) {

      const date =
        new Date(dateString);


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return "";

      }


      return date.toLocaleTimeString(
        [],
        {
          hour: "numeric",
          minute: "2-digit"
        }
      );

    }


    /* =====================================================
       MARK MESSAGES AS SEEN
       ===================================================== */

    async function markMessagesAsSeen(
      friendId,
      currentUserId
    ) {

      const {
        error
      } =
        await supabaseClient
          .from("messages")
          .update({
            seen: true
          })
          .eq(
            "sender_id",
            friendId
          )
          .eq(
            "receiver_id",
            currentUserId
          )
          .eq(
            "seen",
            false
          );


      if (error) {

        console.error(
          "❌ Seen update error:",
          error
        );

        return;

      }


      console.log(
        "👀 Messages marked as seen"
      );

    }


    /* =====================================================
       SEND MESSAGE
       ===================================================== */

    async function sendMessage() {

      if (
        !selectedMessageFriend
      ) {

        alert(
          "Please select a friend first."
        );

        return;

      }


      const input =
        document.getElementById(
          "messageInput"
        );


      if (!input) return;


      const text =
        input.value.trim();


      if (!text) return;


      const {
        data: {
          user
        }
      } =
        await supabaseClient.auth.getUser();


      if (!user) {

        alert(
          "Please login first."
        );

        return;

      }


      input.disabled = true;


      const {
        error
      } =
        await supabaseClient
          .from("messages")
          .insert({

            sender_id:
              user.id,

            receiver_id:
              selectedMessageFriend.id,

            message:
              text,

            seen:
              false

          });


      input.disabled = false;


      if (error) {

        console.error(
          "❌ Send message error:",
          error
        );


        alert(
          error.message
        );

        return;

      }


      input.value = "";


      /*
       * Realtime will normally update the
       * conversation automatically.
       *
       * We also reload here so the sender
       * immediately sees the message.
       */

      await loadConversation(
        selectedMessageFriend.id
      );


      input.focus();

    }


    /* =====================================================
       ENTER KEY
       ===================================================== */

    function handleMessageKey(
      event
    ) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }


    /* =====================================================
       ESCAPE HTML
       ===================================================== */

    function escapeMessage(
      text
    ) {

      const div =
        document.createElement(
          "div"
        );


      div.textContent =
        text || "";


      return div.innerHTML;

    }


    /* =====================================================
       REALTIME
       ===================================================== */

    function startMessageRealtime() {

      /*
       * Remove old channel if one exists.
       */

      if (
        messageRealtimeChannel
      ) {

        supabaseClient.removeChannel(
          messageRealtimeChannel
        );

        messageRealtimeChannel =
          null;

      }


      messageRealtimeChannel =
        supabaseClient
          .channel(
            "youremo-messages-channel"
          )


          /* ---------------------------------------------
             NEW MESSAGE
             --------------------------------------------- */

          .on(
            "postgres_changes",
            {
              event: "INSERT",
              schema: "public",
              table: "messages"
            },

            async payload => {

              console.log(
                "🔥 REALTIME MESSAGE RECEIVED:",
                payload.new
              );


              const {
                data: {
                  user
                }
              } =
                await supabaseClient
                  .auth
                  .getUser();


              if (!user) return;


              const message =
                payload.new;


              /*
               * Ignore unrelated messages.
               */

              if (
                message.sender_id !==
                  user.id &&

                message.receiver_id !==
                  user.id
              ) {

                return;

              }


              /*
               * If this conversation is open,
               * refresh it immediately.
               */

              if (
                selectedMessageFriend &&

                (
                  message.sender_id ===
                    selectedMessageFriend.id ||

                  message.receiver_id ===
                    selectedMessageFriend.id
                )
              ) {

                await loadConversation(
                  selectedMessageFriend.id
                );

              }

            }
          )


          /* ---------------------------------------------
             SEEN UPDATE
             --------------------------------------------- */

          .on(
            "postgres_changes",
            {
              event: "UPDATE",
              schema: "public",
              table: "messages"
            },

            async payload => {

              console.log(
                "👀 MESSAGE UPDATED:",
                payload.new
              );


              const {
                data: {
                  user
                }
              } =
                await supabaseClient
                  .auth
                  .getUser();


              if (!user) return;


              const message =
                payload.new;


              if (
                message.sender_id !==
                  user.id &&

                message.receiver_id !==
                  user.id
              ) {

                return;

              }


              if (
                selectedMessageFriend &&

                (
                  message.sender_id ===
                    selectedMessageFriend.id ||

                  message.receiver_id ===
                    selectedMessageFriend.id
                )
              ) {

                await loadConversation(
                  selectedMessageFriend.id
                );

              }

            }
          )


          .subscribe(
            status => {

              console.log(
                "📡 Messages realtime:",
                status
              );

            }
          );

    }


    /* =====================================================
       START PAGE
       ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      async () => {

        console.log(
          "💬 YouRemo Messages starting..."
        );


        /*
         * Wait until script.js has created
         * supabaseClient.
         */

        if (
          typeof supabaseClient ===
          "undefined"
        ) {

          console.error(
            "❌ supabaseClient is not defined."
          );

          return;

        }


        await loadMessageFriends();


        startMessageRealtime();


        console.log(
          "✅ Messages page ready."
        );

      }
    );

  </script>

</body>

</html>
