  <style>
    /* =====================================================
       MESSAGES PAGE
       ===================================================== */

    .messages-page {
      min-height: 100vh;
      background: #f6f7fb;
    }

    .messages-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    .messages-header {
      margin-bottom: 22px;
    }

    .messages-header h1 {
      margin: 0;
      font-size: 32px;
    }

    .messages-header p {
      margin: 7px 0 0;
      color: #777;
    }

    .messages-layout {
      display: grid;
      grid-template-columns: 330px 1fr;
      height: 680px;
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    /* =====================================================
       FRIENDS SIDEBAR
       ===================================================== */

    .message-friends-panel {
      border-right: 1px solid #e7e7e7;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    .friends-panel-header {
      padding: 20px;
      border-bottom: 1px solid #eee;
    }

    .friends-panel-header h2 {
      margin: 0 0 14px;
      font-size: 20px;
    }

    .friend-search-box {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
    }

    .friend-search-box:focus {
      border-color: #777;
    }

    .message-friends-list {
      flex: 1;
      overflow-y: auto;
    }

    .message-friend {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      cursor: pointer;
      border-bottom: 1px solid #f1f1f1;
      transition: background 0.2s;
    }

    .message-friend:hover {
      background: #f7f7f7;
    }

    .message-friend.active {
      background: #eeeeee;
    }

    .message-friend-avatar {
      width: 46px;
      height: 46px;
      min-width: 46px;
      border-radius: 50%;
      overflow: hidden;
      background: #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }

    .message-friend-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .message-friend-info {
      min-width: 0;
    }

    .message-friend-name {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .message-friend-username {
      margin-top: 3px;
      color: #888;
      font-size: 13px;
    }

    .friends-loading,
    .friends-empty {
      padding: 30px 20px;
      text-align: center;
      color: #888;
    }

    /* =====================================================
       CHAT
       ===================================================== */

    .message-chat-panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-header {
      height: 72px;
      padding: 0 20px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-header-avatar {
      width: 44px;
      height: 44px;
      min-width: 44px;
      border-radius: 50%;
      overflow: hidden;
      background: #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }

    .chat-header-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .chat-header-info h3 {
      margin: 0;
      font-size: 17px;
    }

    .chat-header-info p {
      margin: 3px 0 0;
      color: #888;
      font-size: 13px;
    }

    /* =====================================================
       CHAT MESSAGES
       ===================================================== */

    #chatMessages {
      flex: 1;
      padding: 22px;
      overflow-y: auto;
      background: #fafafa;
    }

    .chat-empty {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #888;
    }

    .chat-empty-icon {
      font-size: 44px;
      margin-bottom: 10px;
    }

    .chat-empty h3 {
      margin: 0 0 6px;
      color: #555;
    }

    .chat-empty p {
      margin: 0;
    }

    .message-row {
      display: flex;
      margin-bottom: 12px;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message-row.theirs {
      justify-content: flex-start;
    }

    .message-bubble {
      max-width: 70%;
      padding: 10px 13px 7px;
      border-radius: 15px;
      font-size: 15px;
      line-height: 1.45;
      word-break: break-word;
      position: relative;
    }

    .message-row.mine .message-bubble {
      background: #222;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message-row.theirs .message-bubble {
      background: #e9e9e9;
      color: #222;
      border-bottom-left-radius: 4px;
    }

    .message-time {
      margin-top: 4px;
      font-size: 10px;
      opacity: 0.65;
      text-align: right;
    }

    .message-seen {
      margin-top: 2px;
      font-size: 10px;
      text-align: right;
      opacity: 0.8;
    }

    /* =====================================================
       COMPOSER
       ===================================================== */

    .chat-composer {
      padding: 14px;
      border-top: 1px solid #eee;
      background: #fff;
      display: flex;
      gap: 10px;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      padding: 13px 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      outline: none;
      font-size: 15px;
    }

    #messageInput:focus {
      border-color: #777;
    }

    #sendMessageBtn {
      border: none;
      border-radius: 12px;
      padding: 0 22px;
      background: #222;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
    }

    #sendMessageBtn:hover {
      background: #000;
    }

    #sendMessageBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 800px) {

      .messages-container {
        padding: 15px;
      }

      .messages-layout {
        grid-template-columns: 1fr;
        height: auto;
        min-height: 700px;
      }

      .message-friends-panel {
        border-right: none;
        border-bottom: 1px solid #eee;
        max-height: 260px;
      }

      .message-friends-list {
        max-height: 180px;
      }

      .message-chat-panel {
        min-height: 500px;
      }

    }

  </style>

</head>

  <!-- =====================================================

       ===================================================== -->

  <script>

    /*
     * IMPORTANT:
     * Do NOT declare:
     *
     * let selectedMessageFriend
     *
     * here.
     *
     * script.js already owns that variable.
     */


    let allMessageFriends = [];


    /* =====================================================
       INITIALIZE PAGE
       ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        initializeMessagesPage();

      }
    );


    async function initializeMessagesPage() {

      /*
       * Wait for script.js authentication
       * to establish currentUser.
       */

      let attempts = 0;

      while (
        !window.currentUser &&
        attempts < 30
      ) {

        await new Promise(
          function (resolve) {
            setTimeout(resolve, 200);
          }
        );

        attempts++;

      }


      if (!window.currentUser) {

        showFriendsMessage(
          "Please login to see your friends."
        );

        return;

      }


      await loadMessageFriends();

    }


    /* =====================================================
       LOAD FRIENDS
       ===================================================== */

    async function loadMessageFriends() {

      const container =
        document.getElementById(
          "messageFriendsList"
        );


      if (!container) {
        return;
      }


      container.innerHTML =
        '<div class="friends-loading">' +
        'Loading friends...' +
        '</div>';


      try {

        const user =
          window.currentUser;


        if (!user) {

          showFriendsMessage(
            "Please login first."
          );

          return;

        }


        const result =
          await window.supabaseClient
            .from("friendships")
            .select(
              "id, user_id, friend_id"
            )
            .or(
              "user_id.eq." +
              user.id +
              ",friend_id.eq." +
              user.id
            );


        if (result.error) {

          console.error(
            "Message friends error:",
            result.error
          );


          showFriendsMessage(
            "Unable to load friends."
          );

          return;

        }


        const friendIds = [];


        (
          result.data || []
        ).forEach(
          function (friendship) {

            if (
              friendship.user_id ===
              user.id
            ) {

              friendIds.push(
                friendship.friend_id
              );

            } else {

              friendIds.push(
                friendship.user_id
              );

            }

          }
        );


        const uniqueIds =
          Array.from(
            new Set(friendIds)
          );


        if (!uniqueIds.length) {

          allMessageFriends = [];

          showFriendsMessage(
            "You don't have any friends yet."
          );

          return;

        }


        const profilesResult =
          await window.supabaseClient
            .from("profiles")
            .select(
              "id, username, full_name, avatar_url"
            )
            .in(
              "id",
              uniqueIds
            );


        if (profilesResult.error) {

          console.error(
            "Message friend profiles error:",
            profilesResult.error
          );


          showFriendsMessage(
            "Unable to load friend profiles."
          );

          return;

        }


        allMessageFriends =
          profilesResult.data || [];


        renderMessageFriends(
          allMessageFriends
        );


      } catch (error) {

        console.error(
          "loadMessageFriends error:",
          error
        );


        showFriendsMessage(
          "Something went wrong while loading friends."
        );

      }

    }


    /* =====================================================
       RENDER FRIENDS
       ===================================================== */

    function renderMessageFriends(
      friends
    ) {

      const container =
        document.getElementById(
          "messageFriendsList"
        );


      if (!container) {
        return;
      }


      if (!friends.length) {

        showFriendsMessage(
          "No friends found."
        );

        return;

      }


      container.innerHTML =
        friends
          .map(
            function (friend) {

              return createMessageFriend(
                friend
              );

            }
          )
          .join("");


      /*
       * Restore selected friend if possible.
       */

      const selected =
        window.getSelectedMessageFriend
          ? window.getSelectedMessageFriend()
          : null;


      if (selected) {

        const stillExists =
          friends.find(
            function (friend) {

              return (
                friend.id ===
                selected.id
              );

            }
          );


        if (stillExists) {

          highlightSelectedFriend(
            stillExists.id
          );

        }

      }

    }


    /* =====================================================
       CREATE FRIEND
       ===================================================== */

    function createMessageFriend(
      friend
    ) {

      const name =
        friend.full_name ||
        friend.username ||
        "YouRemo User";


      const username =
        friend.username
          ? "@" +
            friend.username
          : "";


      const initials =
        getFriendInitials(
          name
        );


      let avatar;


      if (
        friend.avatar_url
      ) {

        avatar =
          '<img src="' +
          escapeMessageHTML(
            friend.avatar_url
          ) +
          '" alt="' +
          escapeMessageHTML(name) +
          '">';

      } else {

        avatar =
          escapeMessageHTML(
            initials
          );

      }


      return (

        '<div class="message-friend" ' +

        'data-friend-id="' +
        escapeMessageHTML(
          friend.id
        ) +
        '">' +

        '<div class="message-friend-avatar">' +

        avatar +

        '</div>' +

        '<div class="message-friend-info">' +

        '<div class="message-friend-name">' +

        escapeMessageHTML(
          name
        ) +

        '</div>' +

        '<div class="message-friend-username">' +

        escapeMessageHTML(
          username
        ) +

        '</div>' +

        '</div>' +

        '</div>'

      );

    }


    /* =====================================================
       FRIEND CLICK
       ===================================================== */

    document.addEventListener(
      "click",
      async function (event) {

        const friendElement =
          event.target.closest(
            ".message-friend"
          );


        if (!friendElement) {
          return;
        }


        const friendId =
          friendElement.getAttribute(
            "data-friend-id"
          );


        const friend =
          allMessageFriends.find(
            function (item) {

              return (
                item.id ===
                friendId
              );

            }
          );


        if (!friend) {
          return;
        }


        await selectMessageFriend(
          friend
        );

      }
    );


    /* =====================================================
       SELECT FRIEND
       ===================================================== */

    async function selectMessageFriend(
      friend
    ) {

      /*
       * Use script.js function.
       * Do not create another global variable.
       */

      if (
        window.setSelectedMessageFriend
      ) {

        window.setSelectedMessageFriend(
          friend
        );

      }


      highlightSelectedFriend(
        friend.id
      );


      updateChatHeader(
        friend
      );


      const input =
        document.getElementById(
          "messageInput"
        );


      const sendButton =
        document.getElementById(
          "sendMessageBtn"
        );


      if (input) {
        input.disabled = false;
      }


      if (sendButton) {
        sendButton.disabled = false;
      }


      await loadConversation(
        friend.id
      );


      await markConversationSeen(
        friend.id
      );

    }


    /* =====================================================
       HIGHLIGHT FRIEND
       ===================================================== */

    function highlightSelectedFriend(
      friendId
    ) {

      document
        .querySelectorAll(
          ".message-friend"
        )
        .forEach(
          function (element) {

            element.classList.toggle(
              "active",
              element.getAttribute(
                "data-friend-id"
              ) === friendId
            );

          }
        );

    }


    /* =====================================================
       CHAT HEADER
       ===================================================== */

    function updateChatHeader(
      friend
    ) {

      const name =
        friend.full_name ||
        friend.username ||
        "YouRemo User";


      const username =
        friend.username
          ? "@" +
            friend.username
          : "";


      const nameElement =
        document.getElementById(
          "chatFriendName"
        );


      const usernameElement =
        document.getElementById(
          "chatFriendUsername"
        );


      const avatarElement =
        document.getElementById(
          "chatHeaderAvatar"
        );


      if (nameElement) {

        nameElement.textContent =
          name;

      }


      if (usernameElement) {

        usernameElement.textContent =
          username;

      }


      if (avatarElement) {

        avatarElement.innerHTML =
          "";


        if (
          friend.avatar_url
        ) {

          const img =
            document.createElement(
              "img"
            );


          img.src =
            friend.avatar_url;


          img.alt =
            name;


          avatarElement.appendChild(
            img
          );

        } else {

          avatarElement.textContent =
            getFriendInitials(
              name
            );

        }

      }

    }


    /* =====================================================
       LOAD CONVERSATION
       ===================================================== */

    async function loadConversation(
      friendId
    ) {

      const chat =
        document.getElementById(
          "chatMessages"
        );


      if (!chat) {
        return;
      }


      const user =
        window.currentUser;


      if (!user) {
        return;
      }


      chat.innerHTML =
        '<div class="chat-empty">' +
        '<div>Loading messages...</div>' +
        '</div>';


      try {

        const result =
          await window.supabaseClient
            .from("messages")
            .select(
              "id, sender_id, receiver_id, message, created_at, seen"
            )
            .or(
              "and(sender_id.eq." +
              user.id +
              ",receiver_id.eq." +
              friendId +
              "),and(sender_id.eq." +
              friendId +
              ",receiver_id.eq." +
              user.id +
              ")"
            )
            .order(
              "created_at",
              {
                ascending: true
              }
            );


        if (result.error) {

          console.error(
            "Conversation loading error:",
            result.error
          );


          chat.innerHTML =
            '<div class="chat-empty">' +
            '<div>⚠️<br><br>Unable to load messages.</div>' +
            '</div>';

          return;

        }


        const messages =
          result.data || [];


        chat.innerHTML =
          "";


        if (!messages.length) {

          chat.innerHTML =
            '<div class="chat-empty">' +
            '<div>' +
            '<div class="chat-empty-icon">💬</div>' +
            '<h3>Start the conversation</h3>' +
            '<p>Send your first message.</p>' +
            '</div>' +
            '</div>';

          return;

        }


        messages.forEach(
          function (message) {

            renderMessage(
              message
            );

          }
        );


        scrollChatToBottom();


      } catch (error) {

        console.error(
          "loadConversation error:",
          error
        );

      }

    }


    /* =====================================================
       RENDER MESSAGE
       ===================================================== */

    function renderMessage(
      message
    ) {

      const chat =
        document.getElementById(
          "chatMessages"
        );


      const user =
        window.currentUser;


      if (!chat || !user) {
        return;
      }


      const row =
        document.createElement(
          "div"
        );


      const mine =
        message.sender_id ===
        user.id;


      row.className =
        "message-row " +
        (
          mine
            ? "mine"
            : "theirs"
        );


      row.setAttribute(
        "data-message-id",
        String(
          message.id
        )
      );


      const bubble =
        document.createElement(
          "div"
        );


      bubble.className =
        "message-bubble";


      const text =
        document.createElement(
          "div"
        );


      text.textContent =
        message.message ||
        "";


      bubble.appendChild(
        text
      );


      const time =
        document.createElement(
          "div"
        );


      time.className =
        "message-time";


      if (
        message.created_at
      ) {

        time.textContent =
          new Date(
            message.created_at
          ).toLocaleTimeString(
            "en-IN",
            {
              hour: "numeric",
              minute: "2-digit"
            }
          );

      }


      bubble.appendChild(
        time
      );


      /*
       * Seen indicator.
       *
       * Only outgoing messages show
       * Seen / Sent status.
       */

      if (mine) {

        const seen =
          document.createElement(
            "div"
          );


        seen.className =
          "message-seen";


        seen.textContent =
          message.seen === true
            ? "Seen"
            : "Sent";


        bubble.appendChild(
          seen
        );

      }


      row.appendChild(
        bubble
      );


      chat.appendChild(
        row
      );

    }


    /* =====================================================
       SEND MESSAGE
       ===================================================== */

    async function sendMessage() {

      const user =
        window.currentUser;


      const friend =
        window.getSelectedMessageFriend
          ? window.getSelectedMessageFriend()
          : null;


      const input =
        document.getElementById(
          "messageInput"
        );


      const button =
        document.getElementById(
          "sendMessageBtn"
        );


      if (!user) {

        alert(
          "Please login first."
        );

        return;

      }


      if (!friend) {

        alert(
          "Please select a friend first."
        );

        return;

      }


      if (!input) {
        return;
      }


      const text =
        input.value.trim();


      if (!text) {
        return;
      }


      if (button) {
        button.disabled = true;
      }


      try {

        const result =
          await window.supabaseClient
            .from("messages")
            .insert({
              sender_id:
                user.id,

              receiver_id:
                friend.id,

              message:
                text,

              seen:
                false
            })
            .select(
              "id, sender_id, receiver_id, message, created_at, seen"
            )
            .single();


        if (result.error) {

          console.error(
            "Send message error:",
            result.error
          );


          alert(
            result.error.message
          );


          return;

        }


        input.value =
          "";


        /*
         * Realtime may append this message.
         * Add immediately only if realtime
         * does not add it.
         */

        const existing =
          document.querySelector(
            '[data-message-id="' +
            CSS.escape(
              String(
                result.data.id
              )
            ) +
            '"]'
          );


        if (!existing) {

          removeChatEmptyState();

          renderMessage(
            result.data
          );

          scrollChatToBottom();

        }


      } catch (error) {

        console.error(
          "sendMessage error:",
          error
        );


        alert(
          "Could not send message."
        );

      } finally {

        if (button) {

          button.disabled =
            !window.getSelectedMessageFriend ||
            !window.getSelectedMessageFriend();

        }

      }

    }


    /* =====================================================
       SEND BUTTON
       ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        const button =
          document.getElementById(
            "sendMessageBtn"
          );


        if (button) {

          button.addEventListener(
            "click",
            sendMessage
          );

        }


        const input =
          document.getElementById(
            "messageInput"
          );


        if (input) {

          input.addEventListener(
            "keydown",
            function (event) {

              if (
                event.key ===
                "Enter" &&
                !event.shiftKey
              ) {

                event.preventDefault();

                sendMessage();

              }

            }
          );

        }

      }
    );


    /* =====================================================
       SEARCH FRIENDS
       ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        const input =
          document.getElementById(
            "messageFriendSearch"
          );


        if (!input) {
          return;
        }


        input.addEventListener(
          "input",
          function () {

            const term =
              input.value
                .trim()
                .toLowerCase();


            if (!term) {

              renderMessageFriends(
                allMessageFriends
              );

              return;

            }


            const filtered =
              allMessageFriends.filter(
                function (friend) {

                  const name =
                    (
                      friend.full_name ||
                      ""
                    ).toLowerCase();


                  const username =
                    (
                      friend.username ||
                      ""
                    ).toLowerCase();


                  return (
                    name.includes(term) ||
                    username.includes(term)
                  );

                }
              );


            renderMessageFriends(
              filtered
            );

          }
        );

      }
    );


    /* =====================================================
       MARK CONVERSATION SEEN
       ===================================================== */

    async function markConversationSeen(
      friendId
    ) {

      const user =
        window.currentUser;


      if (!user) {
        return;
      }


      try {

        const result =
          await window.supabaseClient
            .from("messages")
            .update({
              seen: true
            })
            .eq(
              "sender_id",
              friendId
            )
            .eq(
              "receiver_id",
              user.id
            )
            .eq(
              "seen",
              false
            );


        if (result.error) {

          console.error(
            "Mark seen error:",
            result.error
          );

          return;

        }


        /*
         * Update visible outgoing messages
         * if necessary after database change.
         */

        await refreshVisibleSeenStatus(
          friendId
        );


      } catch (error) {

        console.error(
          "markConversationSeen error:",
          error
        );

      }

    }


    /* =====================================================
       REFRESH SEEN STATUS
       ===================================================== */

    async function refreshVisibleSeenStatus(
      friendId
    ) {

      const user =
        window.currentUser;


      if (!user) {
        return;
      }


      const result =
        await window.supabaseClient
          .from("messages")
          .select(
            "id, seen"
          )
          .eq(
            "sender_id",
            user.id
          )
          .eq(
            "receiver_id",
            friendId
          );


      if (
        result.error ||
        !result.data
      ) {

        return;

      }


      result.data.forEach(
        function (message) {

          const row =
            document.querySelector(
              '[data-message-id="' +
              CSS.escape(
                String(
                  message.id
                )
              ) +
              '"]'
            );


          if (!row) {
            return;
          }


          const seenElement =
            row.querySelector(
              ".message-seen"
            );


          if (seenElement) {

            seenElement.textContent =
              message.seen === true
                ? "Seen"
                : "Sent";

          }

        }
      );

    }


    /* =====================================================
       GLOBAL SEEN UPDATE
       ===================================================== */

    window.updateMessageSeen =
      function (
        messageId
      ) {

        const row =
          document.querySelector(
            '[data-message-id="' +
            CSS.escape(
              String(
                messageId
              )
            ) +
            '"]'
          );


        if (!row) {
          return;
        }


        const seenElement =
          row.querySelector(
            ".message-seen"
          );


        if (seenElement) {

          seenElement.textContent =
            "Seen";

        }

      };


    /* =====================================================
       CHAT SCROLL
       ===================================================== */

    function scrollChatToBottom() {

      const chat =
        document.getElementById(
          "chatMessages"
        );


      if (chat) {

        chat.scrollTop =
          chat.scrollHeight;

      }

    }


    /* =====================================================
       REMOVE EMPTY STATE
       ===================================================== */

    function removeChatEmptyState() {

      const chat =
        document.getElementById(
          "chatMessages"
        );


      if (!chat) {
        return;
      }


      const empty =
        chat.querySelector(
          ".chat-empty"
        );


      if (empty) {

        empty.remove();

      }

    }


    /* =====================================================
       FRIENDS EMPTY MESSAGE
       ===================================================== */

    function showFriendsMessage(
      message
    ) {

      const container =
        document.getElementById(
          "messageFriendsList"
        );


      if (!container) {
        return;
      }


      container.innerHTML =
        '<div class="friends-empty">' +
        escapeMessageHTML(
          message
        ) +
        '</div>';

    }


    /* =====================================================
       HELPERS
       ===================================================== */

    function getFriendInitials(
      name
    ) {

      if (!name) {
        return "?";
      }


      const words =
        name
          .trim()
          .split(/\s+/);


      if (
        words.length === 1
      ) {

        return words[0]
          .substring(
            0,
            2
          )
          .toUpperCase();

      }


      return (
        words[0][0] +
        words[
          words.length - 1
        ][0]
      ).toUpperCase();

    }


    function escapeMessageHTML(
      value
    ) {

      if (
        value === null ||
        value === undefined
      ) {

        return "";

      }


      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }

  </script>
