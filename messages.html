<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>YouRemo - Messages</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

  <!-- =====================================================
       NAVIGATION
       ===================================================== -->

  <header class="top-nav">

    <div class="nav-left">

      <button
        class="logo-button"
        onclick="goHome()"
      >
        YouRemo
      </button>

    </div>


    <nav class="nav-links">

      <button onclick="goHome()">
        Home
      </button>

      <button onclick="goToFriends()">
        Friends
      </button>

      <button
        class="active"
        onclick="goToMessages()"
      >
        Messages
      </button>

      <button onclick="goToProfile()">
        Profile
      </button>

    </nav>


    <div class="nav-right">

      <div
        class="nav-avatar"
        id="navAvatar"
        onclick="handleAccountClick()"
      >
        👤
      </div>

      <button
        id="loginButton"
        class="account-button"
        onclick="handleAccountClick()"
      >
        Login
      </button>

      <div
        id="accountMenu"
        class="account-menu"
      >

        <button onclick="goToMyProfile()">
          My Profile
        </button>

        <button onclick="goToFriends()">
          Friends
        </button>

        <button onclick="logout()">
          Logout
        </button>

      </div>

    </div>

  </header>


  <!-- =====================================================
       MAIN MESSAGES PAGE
       ===================================================== -->

  <main class="messages-page">

    <div class="messages-container">


      <!-- =================================================
           LEFT SIDE - FRIENDS
           ================================================= -->

      <aside class="messages-sidebar">

        <div class="messages-sidebar-header">

          <h1>
            Messages
          </h1>

          <button
            class="new-message-button"
            onclick="goToFriends()"
          >
            + New
          </button>

        </div>


        <div class="message-search">

          <input
            type="text"
            id="messageFriendSearch"
            placeholder="Search friends..."
            autocomplete="off"
          >

        </div>


        <div
          id="messageFriendsList"
          class="message-friends-list"
        >

          <div class="empty-state">

            <div>
              👥
            </div>

            <h2>
              Your Friends
            </h2>

            <p>
              Your friends will appear here.
            </p>

          </div>

        </div>

      </aside>


      <!-- =================================================
           RIGHT SIDE - CHAT
           ================================================= -->

      <section class="chat-section">


        <!-- CHAT HEADER -->

        <div
          id="chatHeader"
          class="chat-header"
        >

          <div class="chat-user">

            <div
              id="chatFriendAvatar"
              class="chat-avatar"
            >
              👤
            </div>

            <div>

              <h2 id="chatFriendName">
                Select a friend
              </h2>

              <p id="chatFriendUsername">
                Choose someone to start chatting
              </p>

            </div>

          </div>

        </div>


        <!-- CHAT MESSAGES -->

        <div
          id="chatMessages"
          class="chat-messages"
        >

          <div class="empty-state">

            <div>
              💬
            </div>

            <h2>
              Your Messages
            </h2>

            <p>
              Select a friend to start a conversation.
            </p>

          </div>

        </div>


        <!-- MESSAGE INPUT -->

        <div
          id="messageInputArea"
          class="message-input-area"
        >

          <form
            id="messageForm"
            class="message-form"
          >

            <input
              type="text"
              id="messageInput"
              placeholder="Type a message..."
              autocomplete="off"
              disabled
            >

            <button
              type="submit"
              id="sendMessageButton"
              disabled
            >
              Send
            </button>

          </form>

        </div>

      </section>

    </div>

  </main>


  <!-- =====================================================
       AUTH MODAL
       ===================================================== -->

  <div
    id="authModal"
    class="modal"
  >

    <div class="auth-modal-content">

      <button
        class="modal-close"
        onclick="closeAuth()"
      >
        ×
      </button>


      <h2 id="authTitle">
        Welcome Back
      </h2>

      <p id="authSubtitle">
        Login to your YouRemo account
      </p>


      <input
        type="text"
        id="authName"
        placeholder="Full name"
        style="display:none;"
      >


      <input
        type="text"
        id="authUsername"
        placeholder="Username"
        style="display:none;"
      >


      <input
        type="email"
        id="authEmail"
        placeholder="Email"
      >


      <input
        type="password"
        id="authPassword"
        placeholder="Password"
      >


      <button
        class="auth-submit"
        onclick="login()"
      >
        Login
      </button>


      <div class="auth-switch">

        <button onclick="showLogin()">
          Login
        </button>

        <button onclick="showSignup()">
          Create Account
        </button>

      </div>

    </div>

  </div>


  <!-- =====================================================
       SCRIPT
       ===================================================== -->

  <script src="script.js"></script>

  <script>

    /*
     * Messages page-specific code.
     *
     * The main Supabase connection and authentication
     * are handled by script.js.
     */


    let messagesPageFriends = [];

    let currentChatFriend = null;


    /* =====================================================
       INITIALIZE MESSAGES PAGE
       ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      async function () {

        console.log(
          "Messages HTML initialized."
        );


        setupMessageSearch();

        setupMessageForm();


        /*
         * Wait briefly for script.js to load
         * the authenticated user.
         */

        setTimeout(
          async function () {

            if (!currentUser) {

              showMessagesLoginState();

              return;

            }


            await loadMessageFriends();

          },
          500
        );

      }
    );


    /* =====================================================
       SHOW LOGIN STATE
       ===================================================== */

    function showMessagesLoginState() {

      const friendsList =
        document.getElementById(
          "messageFriendsList"
        );


      if (friendsList) {

        friendsList.innerHTML =

          '<div class="empty-state">' +

          '<div>🔐</div>' +

          '<h2>Login Required</h2>' +

          '<p>Please login to view your messages.</p>' +

          '<button class="primary-btn" onclick="openAuth()">' +

          'Login' +

          '</button>' +

          '</div>';

      }


      const input =
        document.getElementById(
          "messageInput"
        );


      const button =
        document.getElementById(
          "sendMessageButton"
        );


      if (input) {

        input.disabled =
          true;

      }


      if (button) {

        button.disabled =
          true;

      }

    }


    /* =====================================================
       LOAD FRIENDS
       ===================================================== */

    async function loadMessageFriends() {

      if (!currentUser) {

        showMessagesLoginState();

        return;

      }


      const friendsList =
        document.getElementById(
          "messageFriendsList"
        );


      if (!friendsList) {

        return;

      }


      friendsList.innerHTML =

        '<div class="empty-state">' +

        '<div>⏳</div>' +

        '<p>Loading friends...</p>' +

        '</div>';


      try {

        const friendshipResult =
          await supabaseClient
            .from("friendships")
            .select(
              "id, user_id, friend_id"
            )
            .or(
              "user_id.eq." +
              currentUser.id +
              ",friend_id.eq." +
              currentUser.id
            );


        if (
          friendshipResult.error
        ) {

          console.error(
            "Friendships loading error:",
            friendshipResult.error
          );

          friendsList.innerHTML =

            '<div class="empty-state">' +

            '<div>⚠️</div>' +

            '<p>Could not load friends.</p>' +

            '</div>';

          return;

        }


        const friendIds = [];


        (
          friendshipResult.data || []
        ).forEach(
          function (friendship) {

            if (
              friendship.user_id ===
              currentUser.id
            ) {

              friendIds.push(
                friendship.friend_id
              );

            } else {

              friendIds.push(
                friendship.user_id
              );

            }

          }
        );


        const uniqueIds =
          Array.from(
            new Set(friendIds)
          );


        if (!uniqueIds.length) {

          friendsList.innerHTML =

            '<div class="empty-state">' +

            '<div>👥</div>' +

            '<h2>No Friends Yet</h2>' +

            '<p>Add friends first to start messaging.</p>' +

            '<button class="primary-btn" onclick="goToFriends()">' +

            'Find Friends' +

            '</button>' +

            '</div>';

          return;

        }


        const profileResult =
          await supabaseClient
            .from("profiles")
            .select(
              "id, username, full_name, avatar_url"
            )
            .in(
              "id",
              uniqueIds
            );


        if (
          profileResult.error
        ) {

          console.error(
            "Friend profiles error:",
            profileResult.error
          );

          friendsList.innerHTML =

            '<div class="empty-state">' +

            '<div>⚠️</div>' +

            '<p>Could not load friend profiles.</p>' +

            '</div>';

          return;

        }


        messagesPageFriends =
          profileResult.data || [];


        renderMessageFriends(
          messagesPageFriends
        );


      } catch (error) {

        console.error(
          "loadMessageFriends error:",
          error
        );

        friendsList.innerHTML =

          '<div class="empty-state">' +

          '<div>⚠️</div>' +

          '<p>Something went wrong.</p>' +

          '</div>';

      }

    }


    /* =====================================================
       RENDER FRIEND LIST
       ===================================================== */

    function renderMessageFriends(
      friends
    ) {

      const container =
        document.getElementById(
          "messageFriendsList"
        );


      if (!container) {

        return;

      }


      if (!friends.length) {

        container.innerHTML =

          '<div class="empty-state">' +

          '<div>👥</div>' +

          '<h2>No Friends</h2>' +

          '</div>';

        return;

      }


      container.innerHTML =
        friends
          .map(
            function (friend) {

              return createMessageFriendCard(
                friend
              );

            }
          )
          .join("");

    }


    /* =====================================================
       FRIEND CARD
       ===================================================== */

    function createMessageFriendCard(
      friend
    ) {

      const name =
        friend.full_name ||
        friend.username ||
        "YouRemo User";


      const username =
        friend.username
          ? "@" +
            friend.username
          : "";


      let avatar = "";


      if (
        friend.avatar_url
      ) {

        avatar =

          '<img ' +

          'src="' +
          escapeHTML(
            friend.avatar_url
          ) +
          '" ' +

          'alt="' +
          escapeHTML(name) +
          '" ' +

          'class="message-friend-avatar-img" ' +

          'onerror="this.style.display=\'none\'; this.parentElement.textContent=\'' +

          escapeJS(
            getInitials(name)
          ) +

          '\';" ' +

          '>';

      } else {

        avatar =
          escapeHTML(
            getInitials(name)
          );

      }


      return (

        '<button ' +

        'class="message-friend-card" ' +

        'data-friend-id="' +

        escapeHTML(
          friend.id
        ) +

        '" ' +

        'onclick="openConversation(\'' +

        escapeJS(
          friend.id
        ) +

        '\')">' +

        '<div class="message-friend-avatar">' +

        avatar +

        '</div>' +

        '<div class="message-friend-info">' +

        '<strong>' +

        escapeHTML(name) +

        '</strong>' +

        '<span>' +

        escapeHTML(username) +

        '</span>' +

        '</div>' +

        '</button>'

      );

    }


    /* =====================================================
       OPEN CONVERSATION
       ===================================================== */

    async function openConversation(
      friendId
    ) {

      if (!currentUser) {

        openAuth();

        return;

      }


      const friend =
        messagesPageFriends.find(
          function (item) {

            return (
              item.id ===
              friendId
            );

          }
        );


      if (!friend) {

        console.error(
          "Friend not found:",
          friendId
        );

        return;

      }


      currentChatFriend =
        friend;


      setSelectedMessageFriend(
        friend
      );


      /*
       * Highlight selected friend.
       */

      document
        .querySelectorAll(
          ".message-friend-card"
        )
        .forEach(
          function (card) {

            card.classList.remove(
              "selected"
            );

          }
        );


      const selectedCard =
        document.querySelector(
          '.message-friend-card[data-friend-id="' +
          CSS.escape(friend.id) +
          '"]'
        );


      if (selectedCard) {

        selectedCard.classList.add(
          "selected"
        );

      }


      updateChatHeader(
        friend
      );


      enableMessageInput();


      await loadConversation(
        friend.id
      );

    }


    /* =====================================================
       CHAT HEADER
       ===================================================== */

    function updateChatHeader(
      friend
    ) {

      const name =
        friend.full_name ||
        friend.username ||
        "YouRemo User";


      const username =
        friend.username
          ? "@" +
            friend.username
          : "";


      setText(
        "chatFriendName",
        name
      );


      setText(
        "chatFriendUsername",
        username
      );


      const avatar =
        document.getElementById(
          "chatFriendAvatar"
        );


      if (!avatar) {

        return;

      }


      avatar.innerHTML =
        "";


      if (
        friend.avatar_url
      ) {

        const img =
          document.createElement(
            "img"
          );


        img.src =
          friend.avatar_url;


        img.alt =
          name;


        img.className =
          "chat-friend-avatar-img";


        img.onerror =
          function () {

            this.remove();

            avatar.textContent =
              getInitials(name);

          };


        avatar.appendChild(
          img
        );

      } else {

        avatar.textContent =
          getInitials(name);

      }

    }


    /* =====================================================
       ENABLE INPUT
       ===================================================== */

    function enableMessageInput() {

      const input =
        document.getElementById(
          "messageInput"
        );


      const button =
        document.getElementById(
          "sendMessageButton"
        );


      if (input) {

        input.disabled =
          false;

        input.focus();

      }


      if (button) {

        button.disabled =
          false;

      }

    }


    /* =====================================================
       LOAD CONVERSATION
       ===================================================== */

    async function loadConversation(
      friendId
    ) {

      const chat =
        document.getElementById(
          "chatMessages"
        );


      if (!chat) {

        return;

      }


      chat.innerHTML =

        '<div class="empty-state">' +

        '<div>⏳</div>' +

        '<p>Loading messages...</p>' +

        '</div>';


      try {

        const result =
          await supabaseClient
            .from("messages")
            .select(
              "id, sender_id, receiver_id, message, created_at, seen"
            )
            .or(
              "and(sender_id.eq." +
              currentUser.id +
              ",receiver_id.eq." +
              friendId +
              "),and(sender_id.eq." +
              friendId +
              ",receiver_id.eq." +
              currentUser.id +
              ")"
            )
            .order(
              "created_at",
              {
                ascending:
                  true
              }
            );


        if (
          result.error
        ) {

          console.error(
            "Conversation loading error:",
            result.error
          );


          chat.innerHTML =

            '<div class="empty-state">' +

            '<div>⚠️</div>' +

            '<p>Could not load messages.</p>' +

            '</div>';

          return;

        }


        const messages =
          result.data || [];


        chat.innerHTML =
          "";


        if (!messages.length) {

          chat.innerHTML =

            '<div class="empty-state">' +

            '<div>👋</div>' +

            '<h2>Start the conversation</h2>' +

            '<p>Send a message to ' +

            escapeHTML(
              currentChatFriend.full_name ||
              currentChatFriend.username ||
              "your friend"
            ) +

            '.</p>' +

            '</div>';

        } else {

          messages.forEach(
            function (message) {

              appendMessageToChat(
                message
              );

            }
          );

        }


        chat.scrollTop =
          chat.scrollHeight;


        /*
         * Mark received messages as seen.
         */

        await markMessagesSeen(
          friendId
        );


      } catch (error) {

        console.error(
          "loadConversation error:",
          error
        );

      }

    }


    /* =====================================================
       APPEND MESSAGE
       ===================================================== */

    function appendMessageToChat(
      message
    ) {

      const chat =
        document.getElementById(
          "chatMessages"
        );


      if (!chat) {

        return;

      }


      if (
        message.id &&
        chat.querySelector(
          '[data-message-id="' +
          CSS.escape(
            String(message.id)
          ) +
          '"]'
        )
      ) {

        return;

      }


      const emptyState =
        chat.querySelector(
          ".empty-state"
        );


      if (emptyState) {

        chat.innerHTML =
          "";

      }


      const mine =
        message.sender_id ===
        currentUser.id;


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "message-row " +
        (
          mine
            ? "mine"
            : "theirs"
        );


      row.dataset.messageId =
        String(
          message.id
        );


      const bubble =
        document.createElement(
          "div"
        );


      bubble.className =
        "message-bubble";


      bubble.textContent =
        message.message || "";


      const time =
        document.createElement(
          "div"
        );


      time.className =
        "message-time";


      if (
        message.created_at
      ) {

        time.textContent =
          new Date(
            message.created_at
          ).toLocaleTimeString(
            "en-IN",
            {
              hour:
                "numeric",

              minute:
                "2-digit"
            }
          );

      }


      bubble.appendChild(
        time
      );


      row.appendChild(
        bubble
      );


      chat.appendChild(
        row
      );

    }


    /* =====================================================
       SEND MESSAGE
       ===================================================== */

    async function sendMessage() {

      if (!currentUser) {

        openAuth();

        return;

      }


      if (!currentChatFriend) {

        alert(
          "Please select a friend first."
        );

        return;

      }


      const input =
        document.getElementById(
          "messageInput"
        );


      if (!input) {

        return;

      }


      const text =
        input.value.trim();


      if (!text) {

        return;

      }


      const button =
        document.getElementById(
          "sendMessageButton"
        );


      if (button) {

        button.disabled =
          true;

      }


      try {

        const result =
          await supabaseClient
            .from("messages")
            .insert({

              sender_id:
                currentUser.id,

              receiver_id:
                currentChatFriend.id,

              message:
                text,

              seen:
                false

            })
            .select()
            .single();


        if (
          result.error
        ) {

          console.error(
            "Send message error:",
            result.error
          );


          alert(
            "Could not send message: " +
            result.error.message
          );

          return;

        }


        input.value =
          "";


        /*
         * Realtime normally adds the message.
         * This fallback ensures the sender sees it
         * even if realtime is delayed.
         */

        appendMessageToChat(
          result.data
        );


        const chat =
          document.getElementById(
            "chatMessages"
          );


        if (chat) {

          chat.scrollTop =
            chat.scrollHeight;

        }


      } catch (error) {

        console.error(
          "sendMessage error:",
          error
        );


        alert(
          "Could not send message."
        );

      } finally {

        if (button) {

          button.disabled =
            false;

        }

      }

    }


    /* =====================================================
       MESSAGE FORM
       ===================================================== */

    function setupMessageForm() {

      const form =
        document.getElementById(
          "messageForm"
        );


      if (!form) {

        return;

      }


      form.addEventListener(
        "submit",
        function (event) {

          event.preventDefault();

          sendMessage();

        }
      );

    }


    /* =====================================================
       SEARCH FRIENDS
       ===================================================== */

    function setupMessageSearch() {

      const input =
        document.getElementById(
          "messageFriendSearch"
        );


      if (!input) {

        return;

      }


      input.addEventListener(
        "input",
        function () {

          const term =
            input.value
              .trim()
              .toLowerCase();


          if (!term) {

            renderMessageFriends(
              messagesPageFriends
            );

            return;

          }


          const filtered =
            messagesPageFriends.filter(
              function (friend) {

                const name =
                  (
                    friend.full_name ||
                    ""
                  ).toLowerCase();


                const username =
                  (
                    friend.username ||
                    ""
                  ).toLowerCase();


                return (

                  name.includes(
                    term
                  )

                  ||

                  username.includes(
                    term
                  )

                );

              }
            );


          renderMessageFriends(
            filtered
          );

        }
      );

    }


    /* =====================================================
       MARK MESSAGES SEEN
       ===================================================== */

    async function markMessagesSeen(
      friendId
    ) {

      if (!currentUser) {

        return;

      }


      try {

        const result =
          await supabaseClient
            .from("messages")
            .update({

              seen:
                true

            })
            .eq(
              "sender_id",
              friendId
            )
            .eq(
              "receiver_id",
              currentUser.id
            )
            .eq(
              "seen",
              false
            );


        if (
          result.error
        ) {

          console.error(
            "Mark messages seen error:",
            result.error
          );

        }

      } catch (error) {

        console.error(
          "markMessagesSeen error:",
          error
        );

      }

    }


    /* =====================================================
       REALTIME OVERRIDE
       ===================================================== */

    /*
     * script.js already contains the realtime system.
     *
     * We replace the global append function so incoming
     * messages use the full messages-page renderer.
     */

    window.appendRealtimeMessage =
      function (message) {

        if (!currentUser) {

          return;

        }


        if (!currentChatFriend) {

          return;

        }


        const belongsToConversation =

          (

            message.sender_id ===
            currentUser.id &&

            message.receiver_id ===
            currentChatFriend.id

          )

          ||

          (

            message.sender_id ===
            currentChatFriend.id &&

            message.receiver_id ===
            currentUser.id

          );


        if (
          !belongsToConversation
        ) {

          return;

        }


        appendMessageToChat(
          message
        );


        const chat =
          document.getElementById(
            "chatMessages"
          );


        if (chat) {

          chat.scrollTop =
            chat.scrollHeight;

        }


        /*
         * If this message came from the friend,
         * mark it as seen.
         */

        if (
          message.sender_id !==
          currentUser.id
        ) {

          markMessagesSeen(
            currentChatFriend.id
          );

        }

      };


    /* =====================================================
       AUTH STATE REFRESH
       ===================================================== */

    if (
      typeof supabaseClient !==
      "undefined"
    ) {

      supabaseClient.auth.onAuthStateChange(
        function (
          event,
          session
        ) {

          setTimeout(
            async function () {

              if (
                session &&
                session.user
              ) {

                currentUser =
                  session.user;


                await loadMessageFriends();

              } else {

                currentUser =
                  null;

                currentChatFriend =
                  null;

                showMessagesLoginState();

              }

            },
            200
          );

        }
      );

    }
