<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YouRemo - Messages</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- NAVBAR -->

  <header class="navbar">

    <div class="logo">
      YouRemo
    </div>

    <nav class="main-nav">

      <a href="index.html" title="Home">
        🏠
      </a>

      <a href="friends.html" title="Find Friends">
        🔎
      </a>

      <a href="requests.html" title="Requests">
        🤝
      </a>

      <a href="myfriends.html" title="My Friends">
        👥
      </a>

      <a href="messages.html" title="Messages">
        💬
      </a>

      <a href="profile.html" title="Profile">
        👤
      </a>

    </nav>

    <div
      id="accountButton"
      class="account-button"
      onclick="handleAccountClick()">

      <div
        id="navAvatar"
        class="nav-avatar">

        ?

      </div>

      <span id="loginButton">
        Login
      </span>

    </div>

    <div
      id="accountMenu"
      class="account-menu">

      <button onclick="goToMyProfile()">
        My Profile
      </button>

      <button onclick="openEditProfile()">
        Edit Profile
      </button>

      <button onclick="logout()">
        Logout
      </button>

    </div>

  </header>


  <!-- MAIN -->

  <main class="messages-page">

    <div class="messages-header">

      <h1>
        💬 Messages
      </h1>

      <p>
        Chat with your friends and connections.
      </p>

    </div>


    <!-- MESSAGES LAYOUT -->

    <div class="messages-layout">


      <!-- LEFT SIDE -->

      <aside class="conversation-list">

        <div class="conversation-search">

          <input
            type="text"
            id="messageFriendSearch"
            placeholder="Search friends..."
            oninput="filterMessageFriends()">

        </div>


        <div
          id="conversationList">

          <div class="loading-conversations">
            Loading friends...
          </div>

        </div>

      </aside>


      <!-- RIGHT SIDE -->

      <section class="chat-area">


        <!-- CHAT HEADER -->

        <div
          id="chatHeader"
          class="chat-header">

          <div class="chat-empty-title">
            💬 Select a friend
          </div>

        </div>


        <!-- CHAT MESSAGES -->

        <div
          id="chatMessages"
          class="chat-messages">

          <div class="empty-state">

            <div>
              💬
            </div>

            <h2>
              Your Messages
            </h2>

            <p>
              Select a friend to start chatting.
            </p>

          </div>

        </div>


        <!-- MESSAGE INPUT -->

        <div
          id="messageInputArea"
          class="message-input-area"
          style="display:none;">

          <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."
            autocomplete="off"
            onkeydown="handleMessageKey(event)">

          <button
            type="button"
            onclick="sendMessage()">

            Send

          </button>

        </div>


      </section>

    </div>

  </main>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- YOUR JAVASCRIPT -->

  <script src="script.js"></script>


  <!-- MESSAGES JAVASCRIPT -->

  <script>

    let messageFriends = [];

    let selectedMessageFriend = null;


    /* =====================================================
       LOAD FRIENDS
       ===================================================== */

    async function loadMessageFriends() {

      const container =
        document.getElementById("conversationList");

      if (!container) return;


      try {

        const {
          data: {
            user
          }
        } =
          await supabaseClient.auth.getUser();


        if (!user) {

          container.innerHTML = `

            <div class="empty-conversation">

              <div class="conversation-icon">
                🔐
              </div>

              <div>

                <strong>
                  Login required
                </strong>

                <p>
                  Login to see your friends.
                </p>

              </div>

            </div>

          `;

          return;
        }


        /*
         * Get friendships where current user
         * is either user_id or friend_id.
         */

        const {
          data,
          error
        } =
          await supabaseClient
            .from("friendships")
            .select("*")
            .or(
              `user_id.eq.${user.id},friend_id.eq.${user.id}`
            );


        if (error) {

          console.error(
            "Error loading friendships:",
            error
          );

          container.innerHTML = `

            <div class="empty-conversation">

              <div class="conversation-icon">
                ⚠️
              </div>

              <div>

                <strong>
                  Could not load friends
                </strong>

                <p>
                  ${error.message}
                </p>

              </div>

            </div>

          `;

          return;
        }


        if (!data || data.length === 0) {

          container.innerHTML = `

            <div class="empty-conversation">

              <div class="conversation-icon">
                👥
              </div>

              <div>

                <strong>
                  No friends yet
                </strong>

                <p>
                  Add a friend to start chatting.
                </p>

              </div>

            </div>

          `;

          return;
        }


        /*
         * Get the other user's ID.
         */

        const friendIds =
          data.map(friendship => {

            return friendship.user_id === user.id
              ? friendship.friend_id
              : friendship.user_id;

          });


        /*
         * Remove duplicates.
         */

        const uniqueFriendIds =
          [...new Set(friendIds)];


        /*
         * Load profiles.
         */

        const {
          data: profiles,
          error: profileError
        } =
          await supabaseClient
            .from("profiles")
            .select("*")
            .in("id", uniqueFriendIds);


        if (profileError) {

          console.error(
            "Profile loading error:",
            profileError
          );

          return;
        }


        messageFriends =
          profiles || [];


        renderMessageFriends();

      } catch (error) {

        console.error(
          "Messages error:",
          error
        );

      }

    }


    /* =====================================================
       RENDER FRIENDS
       ===================================================== */

    function renderMessageFriends(
      searchText = ""
    ) {

      const container =
        document.getElementById(
          "conversationList"
        );

      if (!container) return;


      const search =
        searchText
          .toLowerCase()
          .trim();


      const filtered =
        messageFriends.filter(friend => {

          const name =
            (
              friend.full_name ||
              friend.name ||
              friend.username ||
              ""
            ).toLowerCase();

          const username =
            (
              friend.username ||
              ""
            ).toLowerCase();

          return (
            name.includes(search) ||
            username.includes(search)
          );

        });


      if (filtered.length === 0) {

        container.innerHTML = `

          <div class="empty-conversation">

            <div class="conversation-icon">
              🔎
            </div>

            <div>

              <strong>
                No friends found
              </strong>

              <p>
                Try another search.
              </p>

            </div>

          </div>

        `;

        return;
      }


      container.innerHTML =
        filtered.map(friend => {

          const name =
            friend.full_name ||
            friend.name ||
            friend.username ||
            "Friend";


          const initial =
            name
              .charAt(0)
              .toUpperCase();


          const avatar =
            friend.avatar_url ||
            friend.profile_photo ||
            friend.photo_url ||
            "";


          return `

            <div
              class="conversation"
              onclick="openConversation('${friend.id}')">

              <div class="conversation-avatar">

                ${
                  avatar

                  ?

                  `<img
                    src="${avatar}"
                    alt="${name}">`

                  :

                  initial

                }

              </div>

              <div class="conversation-info">

                <strong>
                  ${name}
                </strong>

                <p>
                  ${friend.username
                    ? "@" + friend.username
                    : "Start a conversation"
                  }
                </p>

              </div>

            </div>

          `;

        }).join("");

    }


    /* =====================================================
       SEARCH FRIENDS
       ===================================================== */

    function filterMessageFriends() {

      const input =
        document.getElementById(
          "messageFriendSearch"
        );

      if (!input) return;


      renderMessageFriends(
        input.value
      );

    }


    /* =====================================================
       OPEN CONVERSATION
       ===================================================== */

    async function openConversation(
      friendId
    ) {

      const friend =
        messageFriends.find(
          person => person.id === friendId
        );


      if (!friend) return;


      selectedMessageFriend =
        friend;


      const name =
        friend.full_name ||
        friend.name ||
        friend.username ||
        "Friend";


      const avatar =
        friend.avatar_url ||
        friend.profile_photo ||
        friend.photo_url ||
        "";


      const header =
        document.getElementById(
          "chatHeader"
        );


      const inputArea =
        document.getElementById(
          "messageInputArea"
        );


      if (header) {

        header.innerHTML = `

          <div class="chat-user">

            <div class="conversation-avatar">

              ${
                avatar

                ?

                `<img
                  src="${avatar}"
                  alt="${name}">`

                :

                name
                  .charAt(0)
                  .toUpperCase()

              }

            </div>

            <div>

              <strong>
                ${name}
              </strong>

              <p>
                ${
                  friend.username
                    ? "@" + friend.username
                    : ""
                }
              </p>

            </div>

          </div>

        `;

      }


      if (inputArea) {

        inputArea.style.display =
          "flex";

      }


      await loadConversation(
        friendId
      );


      setTimeout(() => {

        const input =
          document.getElementById(
            "messageInput"
          );

        if (input) {

          input.focus();

        }

      }, 100);

    }


    /* =====================================================
       LOAD CONVERSATION
       ===================================================== */

    async function loadConversation(
      friendId
    ) {

      const chat =
        document.getElementById(
          "chatMessages"
        );

      if (!chat) return;


      const {
        data: {
          user
        }
      } =
        await supabaseClient.auth.getUser();


      if (!user) return;


      chat.innerHTML = `

        <div class="loading-conversations">
          Loading messages...
        </div>

      `;


      const {
        data,
        error
      } =
        await supabaseClient
          .from("messages")
          .select("*")
          .or(
            `and(sender_id.eq.${user.id},receiver_id.eq.${friendId}),and(sender_id.eq.${friendId},receiver_id.eq.${user.id})`
          )
          .order(
            "created_at",
            {
              ascending: true
            }
          );


      if (error) {

        console.error(
          "Message loading error:",
          error
        );

        chat.innerHTML = `

          <div class="empty-state">

            <div>
              ⚠️
            </div>

            <h2>
              Unable to load messages
            </h2>

            <p>
              ${error.message}
            </p>

          </div>

        `;

        return;
      }


      if (!data || data.length === 0) {

        chat.innerHTML = `

          <div class="empty-state">

            <div>
              👋
            </div>

            <h2>
              Start chatting
            </h2>

            <p>
              Send your first message to this friend.
            </p>

          </div>

        `;

        return;
      }


      chat.innerHTML =
        data.map(message => {

          const mine =
            message.sender_id === user.id;


          return `

            <div
              class="message-row ${mine ? "mine" : "theirs"}">

              <div class="message-bubble">

                ${escapeMessage(
                  message.message
                )}

              </div>

            </div>

          `;

        }).join("");


      chat.scrollTop =
        chat.scrollHeight;

    }


    /* =====================================================
       SEND MESSAGE
       ===================================================== */

    async function sendMessage() {

      if (!selectedMessageFriend) {

        return;

      }


      const input =
        document.getElementById(
          "messageInput"
        );


      if (!input) return;


      const text =
        input.value.trim();


      if (!text) return;


      const {
        data: {
          user
        }
      } =
        await supabaseClient.auth.getUser();


      if (!user) {

        alert(
          "Please login first."
        );

        return;

      }


      input.disabled = true;


      const {
        error
      } =
        await supabaseClient
          .from("messages")
          .insert({

            sender_id:
              user.id,

            receiver_id:
              selectedMessageFriend.id,

            message:
              text

          });


      input.disabled = false;


      if (error) {

        console.error(
          "Send message error:",
          error
        );

        alert(
          error.message
        );

        return;

      }


      input.value = "";

input.focus();

    }


    /* =====================================================
       ENTER KEY
       ===================================================== */

    function handleMessageKey(
      event
    ) {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        sendMessage();

      }

    }


    /* =====================================================
       ESCAPE MESSAGE
       ===================================================== */

    function escapeMessage(
      text
    ) {

      const div =
        document.createElement(
          "div"
        );

      div.textContent =
        text || "";

      return div.innerHTML;

    }


    /* =====================================================
       START
       ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      () => {

        loadMessageFriends();

      }
    );

  </script>

</body>

</html>
