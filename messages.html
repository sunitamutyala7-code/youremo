<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YouRemo - Messages</title>

  <link rel="stylesheet" href="style.css">

  <style>
    /* =====================================================
       MESSAGES PAGE
       ===================================================== */

    .messages-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 25px 60px;
    }

    .messages-header {
      margin-bottom: 20px;
    }

    .messages-header h1 {
      margin: 0 0 7px;
      font-size: 32px;
    }

    .messages-header p {
      margin: 0;
      color: #737b8d;
    }

    /* =====================================================
       MAIN LAYOUT
       ===================================================== */

    .messages-layout {
      display: flex;
      width: 100%;
      height: calc(100vh - 210px);
      min-height: 500px;

      background: #ffffff;

      border: 1px solid #e5e7eb;
      border-radius: 18px;

      overflow: hidden;

      box-shadow:
        0 10px 35px rgba(30, 35, 65, 0.08);
    }

    /* =====================================================
       FRIEND LIST
       ===================================================== */

    .conversation-list {
      width: 320px;
      min-width: 320px;

      height: 100%;

      background: #fafbff;

      border-right: 1px solid #e5e7eb;

      overflow-y: auto;
    }

    .conversation-search {
      padding: 15px;

      border-bottom: 1px solid #e5e7eb;

      background: #ffffff;

      position: sticky;
      top: 0;

      z-index: 5;
    }

    .conversation-search input {
      width: 100%;
      height: 42px;

      padding: 0 13px;

      border: 1px solid #dfe2ea;
      border-radius: 10px;

      outline: none;

      font-size: 14px;

      background: #ffffff;
    }

    .conversation-search input:focus {
      border-color: #4f46e5;

      box-shadow:
        0 0 0 3px rgba(79, 70, 229, 0.08);
    }

    /* =====================================================
       CONVERSATION
       ===================================================== */

    .conversation {
      display: flex;
      align-items: center;

      gap: 12px;

      padding: 13px 15px;

      cursor: pointer;

      border-bottom: 1px solid #eeeeee;

      transition: background 0.2s ease;
    }

    .conversation:hover {
      background: #f0f1ff;
    }

    .conversation.selected {
      background: #eef2ff;
    }

    .conversation-avatar {
      width: 48px !important;
      height: 48px !important;

      min-width: 48px !important;
      max-width: 48px !important;

      border-radius: 50%;

      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      background:
        linear-gradient(135deg, #667eea, #764ba2);

      color: #ffffff;

      font-size: 17px;
      font-weight: 700;
    }

    .conversation-avatar img {
      width: 100% !important;
      height: 100% !important;

      object-fit: cover !important;

      border-radius: 50%;

      display: block;
    }

    .conversation-info {
      flex: 1;

      min-width: 0;
    }

    .conversation-info strong {
      display: block;

      font-size: 15px;

      color: #202124;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .conversation-info p {
      margin: 4px 0 0;

      font-size: 12px;

      color: #777d8a;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* =====================================================
       EMPTY FRIEND LIST
       ===================================================== */

    .empty-conversation {
      display: flex;
      align-items: center;

      gap: 12px;

      padding: 25px 18px;

      color: #737b8d;
    }

    .conversation-icon {
      width: 45px;
      height: 45px;

      min-width: 45px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #eeeeff;

      font-size: 21px;
    }

    /* =====================================================
       CHAT AREA
       ===================================================== */

    .chat-area {
      flex: 1;

      min-width: 0;
      min-height: 0;

      height: 100%;

      display: flex;
      flex-direction: column;

      overflow: hidden;

      background: #ffffff;
    }

    /* =====================================================
       CHAT HEADER
       ===================================================== */

    .chat-header {
      min-height: 72px;

      flex: 0 0 72px;

      display: flex;
      align-items: center;

      padding: 12px 20px;

      border-bottom: 1px solid #e5e7eb;

      background: #ffffff;
    }

    .chat-empty-title {
      color: #737b8d;

      font-size: 15px;
    }

    .chat-user {
      display: flex;

      align-items: center;

      gap: 12px;
    }

    .chat-user .conversation-avatar {
      width: 44px !important;
      height: 44px !important;

      min-width: 44px !important;
      max-width: 44px !important;
    }

    .chat-user strong {
      display: block;

      font-size: 15px;

      color: #202124;
    }

    .chat-user p {
      margin: 3px 0 0;

      font-size: 12px;

      color: #777d8a;
    }

    /* =====================================================
       CHAT MESSAGES
       ===================================================== */

    .chat-messages {
      flex: 1 1 auto;

      min-height: 0;

      padding: 20px;

      overflow-y: auto;

      background: #f8f9fc;

      scroll-behavior: smooth;
    }

    .message-row {
      display: flex;

      margin-bottom: 14px;

      width: 100%;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message-row.theirs {
      justify-content: flex-start;
    }

    .message-content {
      max-width: 65%;

      display: flex;

      flex-direction: column;
    }

    .message-row.mine .message-content {
      align-items: flex-end;
    }

    .message-row.theirs .message-content {
      align-items: flex-start;
    }

    .message-bubble {
      padding: 10px 14px;

      border-radius: 15px;

      background: #ffffff;

      border: 1px solid #e5e7eb;

      color: #202124;

      font-size: 14px;

      line-height: 1.45;

      word-break: break-word;

      box-shadow:
        0 2px 7px rgba(0, 0, 0, 0.04);
    }

    .message-row.mine .message-bubble {
      background: #4f46e5;

      color: #ffffff;

      border-color: #4f46e5;
    }

    /* =====================================================
       MESSAGE TIME
       ===================================================== */

    .message-meta {
      display: flex;

      align-items: center;

      gap: 6px;

      margin-top: 5px;

      font-size: 10px;

      color: #858b98;
    }

    .message-row.mine .message-meta {
      justify-content: flex-end;
    }

    .message-sent {
  font-size: 10px;
  color: #4f46e5;
  font-weight: 600;
}

.message-seen {
  font-size: 10px;
  color: #4f46e5;
  font-weight: 600;
}

    /* =====================================================
       INPUT AREA
       ===================================================== */

    .message-input-area {
      flex: 0 0 auto;

      display: flex;

      gap: 10px;

      padding: 13px 16px;

      border-top: 1px solid #e5e7eb;

      background: #ffffff;
    }

    .message-input-area input {
      flex: 1;

      min-width: 0;

      height: 44px;

      padding: 0 14px;

      border: 1px solid #dfe2ea;

      border-radius: 10px;

      outline: none;

      font-size: 14px;

      background: #ffffff;
    }

    .message-input-area input:focus {
      border-color: #4f46e5;

      box-shadow:
        0 0 0 3px rgba(79, 70, 229, 0.08);
    }

    .message-input-area button {
      height: 44px;

      padding: 0 20px;

      border: none;

      border-radius: 10px;

      background: #4f46e5;

      color: #ffffff;

      font-weight: 700;

      cursor: pointer;

      white-space: nowrap;
    }

    .message-input-area button:hover {
      background: #4338ca;
    }

    .message-input-area button:disabled {
      opacity: 0.6;

      cursor: not-allowed;
    }

    /* =====================================================
       EMPTY CHAT
       ===================================================== */

    .chat-messages .empty-state {
      height: 100%;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;
    }

    .chat-messages .empty-state > div {
      font-size: 42px;

      margin-bottom: 12px;
    }

    .chat-messages .empty-state h2 {
      margin-bottom: 8px;
    }

    .chat-messages .empty-state p {
      color: #777d8a;
    }

    .loading-conversations {
      padding: 30px 20px;

      text-align: center;

      color: #777d8a;

      font-size: 14px;
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 750px) {

      .messages-page {
        padding: 25px 12px 40px;
      }

      .messages-layout {
        display: flex;

        flex-direction: column;

        height: calc(100vh - 170px);

        min-height: 550px;
      }

      .conversation-list {
        width: 100%;

        min-width: 0;

        height: 230px;

        flex: 0 0 230px;

        border-right: none;

        border-bottom: 1px solid #e5e7eb;
      }

      .chat-area {
        height: auto;

        flex: 1;

        min-height: 0;
      }

      .message-content {
        max-width: 80%;
      }

      .message-bubble {
        font-size: 13px;
      }

    }
  </style>
</head>

<body>

  <main class="messages-page">

    <div class="messages-header">

      </h1>

      <p>
        Chat with your friends and connections.
      </p>

    </div>


    <div class="messages-layout">

      <!-- =================================================

  <!-- =====================================================
       SUPABASE
       ===================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <!-- =====================================================
       MAIN YOUREMO SCRIPT
       IMPORTANT:
       script.js handles authentication and Realtime.
       ===================================================== -->

  <script src="script.js"></script>


  <!-- =====================================================
       MESSAGES PAGE SCRIPT
       ===================================================== -->

  <script>

    /* =====================================================
       MESSAGE PAGE VARIABLES
       ===================================================== */

    let messageFriends = [];

    let selectedMessageFriend = null;

    let currentMessageUser = null;

    let messageSending = false;


    /* =====================================================
       GET CURRENT USER
       ===================================================== */

    async function getMessageUser() {

      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth.getUser();

        if (error) {

          console.error(
            "User error:",
            error
          );

          return null;

        }

        return data.user || null;

      } catch (error) {

        console.error(
          "Get user error:",
          error
        );

        return null;

      }

    }


    /* =====================================================
       LOAD FRIENDS
       ===================================================== */

    async function loadMessageFriends() {

      const container =
        document.getElementById(
          "conversationList"
        );

      if (!container) return;


      container.innerHTML = `

        <div class="loading-conversations">
          Loading friends...
        </div>

      `;


      try {

        const user =
          await getMessageUser();


        currentMessageUser =
          user;


        if (!user) {

          container.innerHTML = `

            <div class="empty-conversation">

              <div class="conversation-icon">
                🔐
              </div>

              <div>

                <strong>
                  Login required
                </strong>

                <p>
                  Login to see your friends.
                </p>

              </div>

            </div>

          `;

          return;

        }


        /* ===============================================
           GET FRIENDSHIPS
           =============================================== */

        const {
          data,
          error
        } =
          await supabaseClient
            .from("friendships")
            .select("*")
            .or(
              `user_id.eq.${user.id},friend_id.eq.${user.id}`
            );


        if (error) {

          console.error(
            "Friendship error:",
            error
          );

          container.innerHTML = `

            <div class="empty-conversation">

              <div class="conversation-icon">
                ⚠️
              </div>

              <div>

                <strong>
                  Could not load friends
                </strong>

                <p>
                  ${escapeHtml(error.message)}
                </p>

              </div>

            </div>

          `;

          return;

        }


        if (!data || data.length === 0) {

          messageFriends = [];

          container.innerHTML = `

            <div class="empty-conversation">

              <div class="conversation-icon">
                👥
              </div>

              <div>

                <strong>
                  No friends yet
                </strong>

                <p>
                  Add a friend to start chatting.
                </p>

              </div>

            </div>

          `;

          return;

        }


        /* ===============================================
           FIND OTHER USER IDs
           =============================================== */

        const friendIds =
          data
            .map(friendship => {

              return friendship.user_id === user.id
                ? friendship.friend_id
                : friendship.user_id;

            })
            .filter(Boolean);


        const uniqueFriendIds =
          [...new Set(friendIds)];


        if (uniqueFriendIds.length === 0) {

          messageFriends = [];

          renderMessageFriends();

          return;

        }


        /* ===============================================
           LOAD PROFILES
           =============================================== */

        const {
          data: profiles,
          error: profileError
        } =
          await supabaseClient
            .from("profiles")
            .select("*")
            .in(
              "id",
              uniqueFriendIds
            );


        if (profileError) {

          console.error(
            "Profile error:",
            profileError
          );

          container.innerHTML = `

            <div class="empty-conversation">

              <div class="conversation-icon">
                ⚠️
              </div>

              <div>

                <strong>
                  Could not load profiles
                </strong>

                <p>
                  ${escapeHtml(profileError.message)}
                </p>

              </div>

            </div>

          `;

          return;

        }


        messageFriends =
          profiles || [];


        renderMessageFriends();


      } catch (error) {

        console.error(
          "Load friends error:",
          error
        );

        container.innerHTML = `

          <div class="empty-conversation">

            <div class="conversation-icon">
              ⚠️
            </div>

            <div>

              <strong>
                Something went wrong
              </strong>

              <p>
                ${escapeHtml(error.message)}
              </p>

            </div>

          </div>

        `;

      }

    }


    /* =====================================================
       RENDER FRIENDS
       ===================================================== */

    function renderMessageFriends(
      searchText = ""
    ) {

      const container =
        document.getElementById(
          "conversationList"
        );

      if (!container) return;


      const search =
        String(searchText)
          .toLowerCase()
          .trim();


      const filtered =
        messageFriends.filter(friend => {

          const name =
            String(
              friend.full_name ||
              friend.name ||
              friend.username ||
              ""
            ).toLowerCase();


          const username =
            String(
              friend.username || ""
            ).toLowerCase();


          return (
            name.includes(search) ||
            username.includes(search)
          );

        });


      if (filtered.length === 0) {

        container.innerHTML = `

          <div class="empty-conversation">

            <div class="conversation-icon">
              🔎
            </div>

            <div>

              <strong>
                No friends found
              </strong>

              <p>
                Try another search.
              </p>

            </div>

          </div>

        `;

        return;

      }


      container.innerHTML =
        filtered.map(friend => {

          const name =
            friend.full_name ||
            friend.name ||
            friend.username ||
            "Friend";


          const initial =
            name
              .charAt(0)
              .toUpperCase();


          const avatar =
            friend.avatar_url ||
            friend.profile_photo ||
            friend.photo_url ||
            "";


          const selected =
            selectedMessageFriend &&
            selectedMessageFriend.id === friend.id
              ? "selected"
              : "";


          return `

            <div
              class="conversation ${selected}"
              data-friend-id="${escapeHtml(friend.id)}">

              <div class="conversation-avatar">

                ${
                  avatar

                  ?

                  `<img
                    src="${escapeHtml(avatar)}"
                    alt="${escapeHtml(name)}">`

                  :

                  escapeHtml(initial)

                }

              </div>


              <div class="conversation-info">

                <strong>
                  ${escapeHtml(name)}
                </strong>

                <p>
                  ${
                    friend.username
                      ? "@" +
                        escapeHtml(
                          friend.username
                        )
                      : "Start a conversation"
                  }
                </p>

              </div>

            </div>

          `;

        }).join("");


      /* ===============================================
         ADD CLICK EVENTS
         Avoid inline onclick issues.
         =============================================== */

      container
        .querySelectorAll(".conversation")
        .forEach(element => {

          element.addEventListener(
            "click",
            () => {

              const friendId =
                element.dataset.friendId;

              openConversation(
                friendId
              );

            }
          );

        });

    }


    /* =====================================================
       SEARCH
       ===================================================== */

    function filterMessageFriends() {

      const input =
        document.getElementById(
          "messageFriendSearch"
        );

      if (!input) return;


      renderMessageFriends(
        input.value
      );

    }


    /* =====================================================
       OPEN CONVERSATION
       ===================================================== */

    async function openConversation(
      friendId
    ) {

      const friend =
        messageFriends.find(
          person =>
            String(person.id) ===
            String(friendId)
        );


      if (!friend) {

        console.error(
          "Friend not found:",
          friendId
        );

        return;

      }


      selectedMessageFriend =
        friend;


      renderMessageFriends(
        document.getElementById(
          "messageFriendSearch"
        )?.value || ""
      );


      const name =
        friend.full_name ||
        friend.name ||
        friend.username ||
        "Friend";


      const avatar =
        friend.avatar_url ||
        friend.profile_photo ||
        friend.photo_url ||
        "";


      const header =
        document.getElementById(
          "chatHeader"
        );


      const inputArea =
        document.getElementById(
          "messageInputArea"
        );


      if (header) {

        header.innerHTML = `

          <div class="chat-user">

            <div class="conversation-avatar">

              ${
                avatar

                ?

                `<img
                  src="${escapeHtml(avatar)}"
                  alt="${escapeHtml(name)}">`

                :

                escapeHtml(
                  name
                    .charAt(0)
                    .toUpperCase()
                )

              }

            </div>

            <div>

              <strong>
                ${escapeHtml(name)}
              </strong>

              <p>
                ${
                  friend.username
                    ? "@" +
                      escapeHtml(
                        friend.username
                      )
                    : ""
                }
              </p>

            </div>

          </div>

        `;

      }


      if (inputArea) {

        inputArea.style.display =
          "flex";

      }


      await loadConversation(
        friend.id
      );


      setTimeout(() => {

        const input =
          document.getElementById(
            "messageInput"
          );

        if (input) {

          input.focus();

        }

      }, 100);

    }


    /* =====================================================
       LOAD CONVERSATION
       ===================================================== */

    async function loadConversation(
      friendId
    ) {

      const chat =
        document.getElementById(
          "chatMessages"
        );

      if (!chat) return;


      const user =
        currentMessageUser ||
        await getMessageUser();


      if (!user) {

        return;

      }


      currentMessageUser =
        user;


      chat.innerHTML = `

        <div class="loading-conversations">
          Loading messages...
        </div>

      `;


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("messages")
            .select("*")
            .or(
              `and(sender_id.eq.${user.id},receiver_id.eq.${friendId}),and(sender_id.eq.${friendId},receiver_id.eq.${user.id})`
            )
            .order(
              "created_at",
              {
                ascending: true
              }
            );


        if (error) {

          console.error(
            "Message loading error:",
            error
          );

          chat.innerHTML = `

            <div class="empty-state">

              <div>
                ⚠️
              </div>

              <h2>
                Unable to load messages
              </h2>

              <p>
                ${escapeHtml(error.message)}
              </p>

            </div>

          `;

          return;

        }


        if (!data || data.length === 0) {

          chat.innerHTML = `

            <div class="empty-state">

              <div>
                👋
              </div>

              <h2>
                Start chatting
              </h2>

              <p>
                Send your first message to this friend.
              </p>

            </div>

          `;

          return;

        }


        renderMessages(
          data,
          user.id
        );


      } catch (error) {

        console.error(
          "Load conversation error:",
          error
        );

      }

    }


    /* =====================================================
       RENDER MESSAGES
       ===================================================== */

    function renderMessages(messages, userId) {

  const chat = document.getElementById("chatMessages");

  if (!chat) return;

  chat.innerHTML = messages.map(message => {

    const mine =
      String(message.sender_id) === String(userId);

    const time =
      formatMessageTime(message.created_at);

    const seen =
      mine &&
      (
        message.seen === true ||
        message.is_seen === true
      );

    return `
      <div
        class="message-row ${mine ? "mine" : "theirs"}"
        data-message-id="${escapeHtml(message.id || "")}"
      >

        <div class="message-content">

          <div class="message-bubble">
            ${escapeHtml(message.message || "")}
          </div>

          <div class="message-meta">

            <span>
              ${time}
            </span>

            ${
              mine
                ? `
                  ${
                    seen
                      ? `
                        <span class="message-seen">
                          ✓✓ Seen
                        </span>
                      `
                      : `
                        <span class="message-sent">
                          ✓ Sent
                        </span>
                      `
                  }
                `
                : ""
            }

          </div>

        </div>

      </div>
    `;

  }).join("");

  scrollChatToBottom();
}

    /* =====================================================
       SEND MESSAGE
       ===================================================== */

    async function sendMessage() {

      /*
       * IMPORTANT:
       * This lock prevents double sending.
       */

      if (messageSending) {

        return;

      }


      if (!selectedMessageFriend) {

        return;

      }


      const input =
        document.getElementById(
          "messageInput"
        );


      const button =
        document.getElementById(
          "sendMessageButton"
        );


      if (!input) return;


      const text =
        input.value.trim();


      if (!text) {

        return;

      }


      const user =
        currentMessageUser ||
        await getMessageUser();


      if (!user) {

        alert(
          "Please login first."
        );

        return;

      }


      currentMessageUser =
        user;


      /*
       * LOCK
       */

      messageSending = true;


      input.disabled = true;


      if (button) {

        button.disabled = true;

        button.textContent =
          "Sending...";

      }


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("messages")
            .insert({

              sender_id:
                user.id,

              receiver_id:
                selectedMessageFriend.id,

              message:
                text

            })
            .select()
            .single();


        if (error) {

          console.error(
            "Send message error:",
            error
          );

          alert(
            error.message
          );

          return;

        }


        /*
         * Clear input only after successful insert.
         */

        input.value = "";


        /*
         * Immediately add/load the message.
         * Realtime from script.js may also fire,
         * but this page does NOT create another
         * realtime channel.
         */

        if (data) {

          addMessageIfMissing(
            data,
            user.id
          );

        }


        scrollChatToBottom();


      } catch (error) {

        console.error(
          "Send message exception:",
          error
        );

      } finally {

        /*
         * UNLOCK
         */

        messageSending = false;

        input.disabled = false;

        if (button) {

          button.disabled = false;

          button.textContent =
            "Send";

        }

        input.focus();

      }

    }


    /* =====================================================
       ADD MESSAGE WITHOUT DUPLICATE
       ===================================================== */

    function addMessageIfMissing(
      message,
      userId
    ) {

      const chat =
        document.getElementById(
          "chatMessages"
        );

      if (!chat) return;


      /*
       * If this message is already visible,
       * do nothing.
       */

      const existing =
        document.querySelector(
          `[data-message-id="${message.id}"]`
        );


      if (existing) {

        return;

      }


      /*
       * Remove "Start chatting" empty state.
       */

      const empty =
        chat.querySelector(
          ".empty-state"
        );


      if (empty) {

        chat.innerHTML = "";

      }


      const mine =
        String(message.sender_id) ===
        String(userId);


      const row =
        document.createElement(
          "div"
        );


      row.className =
        `message-row ${
          mine
            ? "mine"
            : "theirs"
        }`;


      row.dataset.messageId =
        message.id || "";


      const content =
        document.createElement(
          "div"
        );


      content.className =
        "message-content";


      const bubble =
        document.createElement(
          "div"
        );


      bubble.className =
        "message-bubble";


      bubble.textContent =
        message.message || "";


      const meta =
        document.createElement(
          "div"
        );


      meta.className =
        "message-meta";


      const time =
        document.createElement(
          "span"
        );


      time.textContent =
        formatMessageTime(
          message.created_at
        );


      meta.appendChild(
        time
      );


      if (
        mine &&
        (
          message.seen === true ||
          message.is_seen === true
        )
      ) {

        const seen =
          document.createElement(
            "span"
          );

        seen.className =
          "message-seen";

        seen.textContent =
          "✓✓ Seen";

        meta.appendChild(
          seen
        );

      }


      content.appendChild(
        bubble
      );

      content.appendChild(
        meta
      );

      row.appendChild(
        content
      );

      chat.appendChild(
        row
      );

      scrollChatToBottom();

    }


    /* =====================================================
       FORMAT TIME
       ===================================================== */

    function formatMessageTime(
      timestamp
    ) {

      if (!timestamp) {

        return "";

      }


      const date =
        new Date(
          timestamp
        );


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return "";

      }


      return date.toLocaleTimeString(
        [],
        {
          hour: "numeric",
          minute: "2-digit"
        }
      );

    }


    /* =====================================================
       SCROLL CHAT
       ===================================================== */

    function scrollChatToBottom() {

      const chat =
        document.getElementById(
          "chatMessages"
        );

      if (!chat) return;


      requestAnimationFrame(() => {

        chat.scrollTop =
          chat.scrollHeight;

      });

    }


    /* =====================================================
       ESCAPE HTML
       ===================================================== */

    function escapeHtml(
      value
    ) {

      const div =
        document.createElement(
          "div"
        );


      div.textContent =
        String(value ?? "");


      return div.innerHTML;

    }


    /* =====================================================
       SEARCH EVENT
       ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      () => {

        const searchInput =
          document.getElementById(
            "messageFriendSearch"
          );


        const sendButton =
          document.getElementById(
            "sendMessageButton"
          );


        const messageInput =
          document.getElementById(
            "messageInput"
          );


        if (searchInput) {

          searchInput.addEventListener(
            "input",
            filterMessageFriends
          );

        }


        if (sendButton) {

          sendButton.addEventListener(
            "click",
            sendMessage
          );

        }


        if (messageInput) {

          messageInput.addEventListener(
            "keydown",
            event => {

              if (
                event.key === "Enter" &&
                !event.shiftKey
              ) {

                event.preventDefault();

                sendMessage();

              }

            }
          );

        }


        /*
         * Wait for Supabase/script.js to initialize.
         */

        setTimeout(
          () => {

            loadMessageFriends();

          },
          500
        );

      }
    );

  </script>
