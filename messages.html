<!DOCTYPE html>

    .nav-avatar img {

    .account-menu {
      position: absolute;

      width: 190px;

    .messages-layout {

    /* ================= FRIEND LIST ================= */

    .conversation-list {

  <script src="script.js"></script>


  <!-- =====================================================
       MESSAGE SYSTEM
       THIS IS THE ONLY MESSAGE SYSTEM IN THIS FILE
       ===================================================== -->

  <script>

  (function () {

    let messageFriends = [];
    let selectedMessageFriend = null;
    let currentMessageUser = null;
    let messageSending = false;

    window.youRemoMessagesChannel = null;


    /* =====================================================
       USER
       ===================================================== */

    async function getMessageUser() {

      try {

        const {
          data,
          error
        } = await supabaseClient.auth.getUser();

        if (error) {

          console.error(
            "Message user error:",
            error
          );

          return null;
        }

        return data.user || null;

      } catch (error) {

        console.error(
          "Get user error:",
          error
        );

        return null;
      }
    }


    /* =====================================================
       LOAD FRIENDS
       ===================================================== */

    async function loadMessageFriends() {

      const container =
        document.getElementById(
          "conversationList"
        );

      if (!container) return;


      container.innerHTML = `
        <div class="loading-conversations">
          Loading friends...
        </div>
      `;


      currentMessageUser =
        await getMessageUser();


      if (!currentMessageUser) {

        container.innerHTML = `
          <div class="empty-conversation">

            <div class="conversation-icon">
              🔐
            </div>

            <div>
              <strong>Login required</strong>
              <p>Please login to see your friends.</p>
            </div>

          </div>
        `;

        return;
      }


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("friendships")
            .select("*")
            .or(
              `user_id.eq.${currentMessageUser.id},friend_id.eq.${currentMessageUser.id}`
            );


        if (error) {

          console.error(
            "Friendship loading error:",
            error
          );

          container.innerHTML = `
            <div class="empty-conversation">

              <div class="conversation-icon">
                ⚠️
              </div>

              <div>
                <strong>Could not load friends</strong>
                <p>
                  ${escapeMessageHtml(error.message)}
                </p>
              </div>

            </div>
          `;

          return;
        }


        const friendIds =
          (data || [])
            .map(friendship => {

              if (
                String(friendship.user_id) ===
                String(currentMessageUser.id)
              ) {

                return friendship.friend_id;
              }

              return friendship.user_id;

            })
            .filter(Boolean);


        const uniqueFriendIds =
          [...new Set(friendIds)];


        if (!uniqueFriendIds.length) {

          messageFriends = [];

          renderMessageFriends();

          return;
        }


        const {
          data: profiles,
          error: profileError
        } =
          await supabaseClient
            .from("profiles")
            .select(
              "id,full_name,username,avatar_url"
            )
            .in(
              "id",
              uniqueFriendIds
            );


        if (profileError) {

          console.error(
            "Profile loading error:",
            profileError
          );

          container.innerHTML = `
            <div class="empty-conversation">

              <div class="conversation-icon">
                ⚠️
              </div>

              <div>
                <strong>Could not load profiles</strong>
                <p>
                  ${escapeMessageHtml(
                    profileError.message
                  )}
                </p>
              </div>

            </div>
          `;

          return;
        }


        messageFriends =
          profiles || [];


        renderMessageFriends();

      } catch (error) {

        console.error(
          "Load friends error:",
          error
        );
      }
    }


    /* =====================================================
       RENDER FRIENDS
       ===================================================== */

    function renderMessageFriends(
      searchText = ""
    ) {

      const container =
        document.getElementById(
          "conversationList"
        );

      if (!container) return;


      const search =
        String(searchText)
          .toLowerCase()
          .trim();


      const filtered =
        messageFriends.filter(friend => {

          const name =
            String(
              friend.full_name ||
              friend.username ||
              ""
            ).toLowerCase();


          const username =
            String(
              friend.username ||
              ""
            ).toLowerCase();


          return (
            name.includes(search) ||
            username.includes(search)
          );
        });


      if (!filtered.length) {

        container.innerHTML = `
          <div class="empty-conversation">

            <div class="conversation-icon">
              👥
            </div>

            <div>
              <strong>No friends found</strong>
              <p>Add friends to start messaging.</p>
            </div>

          </div>
        `;

        return;
      }


      container.innerHTML =
        filtered
          .map(friend => {

            const name =
              friend.full_name ||
              friend.username ||
              "Friend";


            const initial =
              name
                .charAt(0)
                .toUpperCase();


            const avatar =
              friend.avatar_url || "";


            const selected =
              selectedMessageFriend &&
              String(
                selectedMessageFriend.id
              ) ===
              String(friend.id)
                ? "selected"
                : "";


            return `

              <div
                class="conversation ${selected}"
                data-friend-id="${escapeMessageHtml(
                  friend.id
                )}"
              >

                <div class="conversation-avatar">

                  ${
                    avatar
                      ? `
                        <img
                          src="${escapeMessageHtml(
                            avatar
                          )}"
                          alt=""
                        >
                      `
                      : escapeMessageHtml(initial)
                  }

                </div>


                <div class="conversation-info">

                  <strong>
                    ${escapeMessageHtml(name)}
                  </strong>

                  <p>
                    ${
                      friend.username
                        ? "@" +
                          escapeMessageHtml(
                            friend.username
                          )
                        : "Start a conversation"
                    }
                  </p>

                </div>

              </div>
            `;

          })
          .join("");


      container
        .querySelectorAll(".conversation")
        .forEach(element => {

          element.addEventListener(
            "click",
            () => {

              openMessageConversation(
                element.dataset.friendId
              );

            }
          );

        });
    }


    /* =====================================================
       SEARCH
       ===================================================== */

    function filterMessageFriends() {

      const input =
        document.getElementById(
          "messageFriendSearch"
        );

      if (!input) return;

      renderMessageFriends(
        input.value
      );
    }


    /* =====================================================
       OPEN CHAT
       ===================================================== */

    async function openMessageConversation(
      friendId
    ) {

      const friend =
        messageFriends.find(
          person =>
            String(person.id) ===
            String(friendId)
        );


      if (!friend) return;


      selectedMessageFriend =
        friend;


      renderMessageFriends(
        document.getElementById(
          "messageFriendSearch"
        )?.value || ""
      );


      const name =
        friend.full_name ||
        friend.username ||
        "Friend";


      const avatar =
        friend.avatar_url || "";


      const header =
        document.getElementById(
          "chatHeader"
        );


      const inputArea =
        document.getElementById(
          "messageInputArea"
        );


      if (header) {

        header.innerHTML = `

          <div class="chat-user">

            <div class="conversation-avatar">

              ${
                avatar
                  ? `
                    <img
                      src="${escapeMessageHtml(
                        avatar
                      )}"
                      alt=""
                    >
                  `
                  : escapeMessageHtml(
                      name
                        .charAt(0)
                        .toUpperCase()
                    )
              }

            </div>

            <div>

              <strong>
                ${escapeMessageHtml(name)}
              </strong>

              <p>
                ${
                  friend.username
                    ? "@" +
                      escapeMessageHtml(
                        friend.username
                      )
                    : ""
                }
              </p>

            </div>

          </div>
        `;
      }


      if (inputArea) {

        inputArea.style.display =
          "flex";
      }


      /* Load first */

      await loadMessageConversation(
        friend.id
      );


      /*
       * Mark ONLY messages received from
       * this friend as seen.
       */

      await markIncomingMessagesSeen(
        friend.id
      );


      /*
       * Reload so the sender/receiver sees
       * the updated ✓✓ Seen state.
       */

      await loadMessageConversation(
        friend.id
      );


      const input =
        document.getElementById(
          "messageInput"
        );


      if (input) {

        setTimeout(
          () => input.focus(),
          100
        );
      }
    }


    /* =====================================================
       MARK INCOMING MESSAGES SEEN
       ===================================================== */

    async function markIncomingMessagesSeen(
      friendId
    ) {

      const user =
        currentMessageUser ||
        await getMessageUser();


      if (!user) return;


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("messages")
            .update({
              seen: true
            })
            .eq(
              "sender_id",
              friendId
            )
            .eq(
              "receiver_id",
              user.id
            )
            .eq(
              "seen",
              false
            )
            .select("id");


        if (error) {

          console.error(
            "Mark seen error:",
            error
          );

          return;
        }


        console.log(
          "Messages marked seen:",
          data
        );

      } catch (error) {

        console.error(
          "Mark seen exception:",
          error
        );
      }
    }


    /* =====================================================
       LOAD CONVERSATION
       ===================================================== */

    async function loadMessageConversation(
      friendId
    ) {

      const chat =
        document.getElementById(
          "chatMessages"
        );

      if (!chat) return;


      const user =
        currentMessageUser ||
        await getMessageUser();


      if (!user) return;


      currentMessageUser =
        user;


      chat.innerHTML = `
        <div class="loading-conversations">
          Loading messages...
        </div>
      `;


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("messages")
            .select(
              "id,sender_id,receiver_id,message,seen,created_at"
            )
            .or(
              `and(sender_id.eq.${user.id},receiver_id.eq.${friendId}),and(sender_id.eq.${friendId},receiver_id.eq.${user.id})`
            )
            .order(
              "created_at",
              {
                ascending: true
              }
            );


        if (error) {

          console.error(
            "Message loading error:",
            error
          );

          chat.innerHTML = `
            <div class="empty-state">

              <div>⚠️</div>

              <h2>
                Unable to load messages
              </h2>

              <p>
                ${escapeMessageHtml(error.message)}
              </p>

            </div>
          `;

          return;
        }


        if (
          !data ||
          data.length === 0
        ) {

          chat.innerHTML = `
            <div class="empty-state">

              <div>👋</div>

              <h2>
                Start chatting
              </h2>

              <p>
                Send your first message to this friend.
              </p>

            </div>
          `;

          return;
        }


        renderMessageList(
          data,
          user.id
        );

      } catch (error) {

        console.error(
          "Conversation error:",
          error
        );
      }
    }


    /* =====================================================
       RENDER MESSAGE LIST
       ===================================================== */

    function renderMessageList(
      messages,
      userId
    ) {

      const chat =
        document.getElementById(
          "chatMessages"
        );

      if (!chat) return;


      chat.innerHTML =
        messages
          .map(message => {

            const mine =
              String(
                message.sender_id
              ) ===
              String(userId);


            const time =
              formatMessageTime(
                message.created_at
              );


            return `

              <div
                class="message-row ${
                  mine
                    ? "mine"
                    : "theirs"
                }"
                data-message-id="${escapeMessageHtml(
                  message.id
                )}"
              >

                <div class="message-content">

                  <div class="message-bubble">
                    ${escapeMessageHtml(
                      message.message || ""
                    )}
                  </div>

                  <div class="message-meta">

                    <span>
                      ${time}
                    </span>

                    ${
                      mine
                        ? message.seen === true
                          ? `
                            <span class="message-seen">
                              ✓✓ Seen
                            </span>
                          `
                          : `
                            <span class="message-sent">
                              ✓ Sent
                            </span>
                          `
                        : ""
                    }

                  </div>

                </div>

              </div>
            `;

          })
          .join("");


      scrollMessageChat();
    }


    /* =====================================================
       SEND
       ===================================================== */

    async function sendMessage() {

      if (messageSending) return;


      if (!selectedMessageFriend) {

        alert(
          "Select a friend first."
        );

        return;
      }


      const input =
        document.getElementById(
          "messageInput"
        );


      const button =
        document.getElementById(
          "sendMessageButton"
        );


      if (!input) return;


      const text =
        input.value.trim();


      if (!text) return;


      const user =
        currentMessageUser ||
        await getMessageUser();


      if (!user) {

        alert(
          "Please login first."
        );

        return;
      }


      messageSending = true;

      input.disabled = true;


      if (button) {

        button.disabled = true;

        button.textContent =
          "Sending...";
      }


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("messages")
            .insert({

              sender_id:
                user.id,

              receiver_id:
                selectedMessageFriend.id,

              message:
                text,

              seen:
                false

            })
            .select(
              "id,sender_id,receiver_id,message,seen,created_at"
            )
            .single();


        if (error) {

          console.error(
            "Send message error:",
            error
          );

          alert(error.message);

          return;
        }


        input.value = "";


        if (data) {

          addMessageToScreen(
            data,
            user.id
          );
        }

      } catch (error) {

        console.error(
          "Send exception:",
          error
        );

      } finally {

        messageSending = false;

        input.disabled = false;


        if (button) {

          button.disabled = false;

          button.textContent =
            "Send";
        }


        input.focus();
      }
    }


    /* =====================================================
       ADD MESSAGE
       ===================================================== */

    function addMessageToScreen(
      message,
      userId
    ) {

      const chat =
        document.getElementById(
          "chatMessages"
        );

      if (!chat) return;


      if (message.id) {

        const existing =
          chat.querySelector(
            `[data-message-id="${message.id}"]`
          );


        if (existing) return;
      }


      const empty =
        chat.querySelector(
          ".empty-state"
        );


      if (empty) {
        chat.innerHTML = "";
      }


      const mine =
        String(
          message.sender_id
        ) ===
        String(userId);


      const row =
        document.createElement(
          "div"
        );


      row.className =
        mine
          ? "message-row mine"
          : "message-row theirs";


      row.dataset.messageId =
        message.id;


      const content =
        document.createElement(
          "div"
        );


      content.className =
        "message-content";


      const bubble =
        document.createElement(
          "div"
        );


      bubble.className =
        "message-bubble";


      bubble.textContent =
        message.message || "";


      const meta =
        document.createElement(
          "div"
        );


      meta.className =
        "message-meta";


      const time =
        document.createElement(
          "span"
        );


      time.textContent =
        formatMessageTime(
          message.created_at
        );


      meta.appendChild(time);


      if (mine) {

        const status =
          document.createElement(
            "span"
          );


        status.className =
          message.seen === true
            ? "message-seen"
            : "message-sent";


        status.textContent =
          message.seen === true
            ? "✓✓ Seen"
            : "✓ Sent";


        meta.appendChild(status);
      }


      content.appendChild(
        bubble
      );

      content.appendChild(
        meta
      );

      row.appendChild(
        content
      );

      chat.appendChild(
        row
      );


      scrollMessageChat();
    }


    /* =====================================================
       REALTIME
       ===================================================== */

    function startMessageRealtime() {

      if (
        window.youRemoMessagesChannel
      ) {

        supabaseClient.removeChannel(
          window.youRemoMessagesChannel
        );

        window.youRemoMessagesChannel =
          null;
      }


      if (!currentMessageUser) {
        return;
      }


      const channelName =
        "youremo-messages-" +
        currentMessageUser.id +
        "-" +
        Date.now();


      window.youRemoMessagesChannel =
        supabaseClient
          .channel(channelName)


          /* INSERT */

          .on(
            "postgres_changes",
            {
              event: "INSERT",
              schema: "public",
              table: "messages"
            },

            payload => {

              const message =
                payload.new;


              if (!message) return;


              const myId =
                currentMessageUser.id;


              const related =
                String(
                  message.sender_id
                ) === String(myId)
                ||
                String(
                  message.receiver_id
                ) === String(myId);


              if (!related) return;


              if (
                !selectedMessageFriend
              ) return;


              const friendId =
                selectedMessageFriend.id;


              const belongsToChat =
                (
                  String(
                    message.sender_id
                  ) === String(myId)
                  &&
                  String(
                    message.receiver_id
                  ) === String(friendId)
                )
                ||
                (
                  String(
                    message.sender_id
                  ) === String(friendId)
                  &&
                  String(
                    message.receiver_id
                  ) === String(myId)
                );


              if (!belongsToChat) return;


              addMessageToScreen(
                message,
                myId
              );


              /*
               * If we are receiving a message
               * while the chat is open, mark it
               * as seen.
               */

              if (
                String(
                  message.receiver_id
                ) === String(myId)
              ) {

                markIncomingMessagesSeen(
                  friendId
                );
              }
            }
          )


          /* UPDATE */

          .on(
            "postgres_changes",
            {
              event: "UPDATE",
              schema: "public",
              table: "messages"
            },

            payload => {

              const message =
                payload.new;


              if (!message) return;


              if (
                message.seen !== true
              ) {
                return;
              }


              updateVisibleMessageSeen(
                message.id
              );
            }
          )


          .subscribe(status => {

            console.log(
              "YouRemo Messages realtime:",
              status
            );

          });
    }


    /* =====================================================
       UPDATE SEEN
       ===================================================== */

    function updateVisibleMessageSeen(
      messageId
    ) {

      const row =
        document.querySelector(
          `[data-message-id="${messageId}"]`
        );


      if (!row) return;


      const meta =
        row.querySelector(
          ".message-meta"
        );


      if (!meta) return;


      if (
        meta.querySelector(
          ".message-seen"
        )
      ) {
        return;
      }


      const sent =
        meta.querySelector(
          ".message-sent"
        );


      if (sent) {
        sent.remove();
      }


      const seen =
        document.createElement(
          "span"
        );


      seen.className =
        "message-seen";


      seen.textContent =
        "✓✓ Seen";


      meta.appendChild(
        seen
      );


      console.log(
        "Message now Seen:",
        messageId
      );
    }


    /* =====================================================
       TIME
       ===================================================== */

    function formatMessageTime(
      timestamp
    ) {

      if (!timestamp) return "";


      const date =
        new Date(timestamp);


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return "";
      }


      return date.toLocaleTimeString(
        [],
        {
          hour: "numeric",
          minute: "2-digit"
        }
      );
    }


    /* =====================================================
       SCROLL
       ===================================================== */

    function scrollMessageChat() {

      const chat =
        document.getElementById(
          "chatMessages"
        );


      if (!chat) return;


      requestAnimationFrame(() => {

        chat.scrollTop =
          chat.scrollHeight;

      });
    }


    /* =====================================================
       ESCAPE
       ===================================================== */

    function escapeMessageHtml(
      value
    ) {

      const div =
        document.createElement(
          "div"
        );


      div.textContent =
        String(
          value ?? ""
        );


      return div.innerHTML;
    }


    /* =====================================================
       START
       ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      async function () {

        console.log(
          "💬 YouRemo Messages page initialized"
        );


        const searchInput =
          document.getElementById(
            "messageFriendSearch"
          );


        const sendButton =
          document.getElementById(
            "sendMessageButton"
          );


        const messageInput =
          document.getElementById(
            "messageInput"
          );


        if (searchInput) {

          searchInput.addEventListener(
            "input",
            filterMessageFriends
          );
        }


        if (sendButton) {

          sendButton.addEventListener(
            "click",
            sendMessage
          );
        }


        if (messageInput) {

          messageInput.addEventListener(
            "keydown",
            event => {

              if (
                event.key === "Enter" &&
                !event.shiftKey
              ) {

                event.preventDefault();

                sendMessage();
              }
            }
          );
        }


        currentMessageUser =
          await getMessageUser();


        if (!currentMessageUser) {

          await loadMessageFriends();

          return;
        }


        /*
         * Load friends first.
         */

        await loadMessageFriends();


        /*
         * Start realtime once.
         */

        startMessageRealtime();

      }
    );

  })();

  </script>

</body>
</html>
