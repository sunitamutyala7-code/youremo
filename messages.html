<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>YouRemo - Messages</title>

  <link
    rel="stylesheet"
    href="style.css">

  <style>

    /* =====================================================
       MESSAGES PAGE
       ===================================================== */

    .messages-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 25px 60px;
    }

    .messages-header {
      margin-bottom: 22px;
    }

    .messages-header h1 {
      margin: 0 0 7px;
      font-size: 32px;
      color: #172033;
    }

    .messages-header p {
      margin: 0;
      color: #737b8d;
    }


    /* =====================================================
       MAIN LAYOUT
       ===================================================== */

    .messages-layout {
      display: flex;

      width: 100%;

      height: calc(100vh - 190px);

      min-height: 520px;

      background: #ffffff;

      border: 1px solid #e5e7eb;

      border-radius: 18px;

      overflow: hidden;

      box-shadow:
        0 10px 35px rgba(30, 35, 65, 0.08);
    }


    /* =====================================================
       LEFT SIDE
       ===================================================== */

    .conversation-list {

      width: 320px;

      min-width: 320px;

      height: 100%;

      background: #fafbff;

      border-right: 1px solid #e5e7eb;

      overflow-y: auto;
    }


    .conversation-search {

      padding: 15px;

      border-bottom: 1px solid #e5e7eb;

      background: #ffffff;
    }


    .conversation-search input {

      width: 100%;

      height: 42px;

      padding: 0 13px;

      border: 1px solid #dfe2ea;

      border-radius: 10px;

      outline: none;

      font-size: 14px;

      color: #202124;
    }


    .conversation-search input:focus {

      border-color: #4f46e5;

      box-shadow:
        0 0 0 3px rgba(79, 70, 229, 0.08);
    }


    /* =====================================================
       FRIEND / CONVERSATION
       ===================================================== */

    .conversation {

      position: relative;

      display: flex;

      align-items: center;

      gap: 12px;

      padding: 14px 15px;

      cursor: pointer;

      border-bottom: 1px solid #eeeeee;

      transition:
        background 0.2s ease;
    }


    .conversation:hover {

      background: #f0f1ff;
    }


    .conversation.active {

      background: #eef2ff;
    }


    .conversation-avatar {

      width: 48px !important;

      height: 48px !important;

      min-width: 48px !important;

      max-width: 48px !important;

      border-radius: 50%;

      overflow: hidden;

      display: flex;

      align-items: center;

      justify-content: center;

      flex-shrink: 0;

      background:
        linear-gradient(
          135deg,
          #667eea,
          #764ba2
        );

      color: #ffffff;

      font-size: 17px;

      font-weight: 700;
    }


    .conversation-avatar img {

      width: 100% !important;

      height: 100% !important;

      max-width: 100% !important;

      max-height: 100% !important;

      object-fit: cover !important;

      border-radius: 50%;

      display: block;
    }


    .conversation-info {

      flex: 1;

      min-width: 0;
    }


    .conversation-info strong {

      display: block;

      font-size: 15px;

      color: #202124;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;
    }


    .conversation-info p {

      margin: 4px 0 0;

      font-size: 12px;

      color: #777d8a;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;
    }


    /* =====================================================
       UNREAD BADGE
       ===================================================== */

    .unread-badge {

      min-width: 20px;

      height: 20px;

      padding: 0 6px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 999px;

      background: #4f46e5;

      color: #ffffff;

      font-size: 10px;

      font-weight: 700;

      flex-shrink: 0;
    }


    /* =====================================================
       EMPTY LEFT SIDE
       ===================================================== */

    .empty-conversation {

      display: flex;

      align-items: center;

      gap: 12px;

      padding: 25px 18px;

      color: #737b8d;
    }


    .conversation-icon {

      width: 45px;

      height: 45px;

      min-width: 45px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 50%;

      background: #eeeeff;

      font-size: 21px;
    }


    /* =====================================================
       CHAT AREA
       ===================================================== */

    .chat-area {

      flex: 1;

      min-width: 0;

      min-height: 0;

      height: 100%;

      display: flex;

      flex-direction: column;

      background: #ffffff;

      overflow: hidden;
    }


    /* =====================================================
       CHAT HEADER
       ===================================================== */

    .chat-header {

      flex: 0 0 auto;

      min-height: 72px;

      display: flex;

      align-items: center;

      padding: 12px 20px;

      border-bottom: 1px solid #e5e7eb;

      background: #ffffff;
    }


    .chat-empty-title {

      color: #737b8d;

      font-size: 14px;
    }


    .chat-user {

      display: flex;

      align-items: center;

      gap: 12px;
    }


    .chat-user .conversation-avatar {

      width: 44px !important;

      height: 44px !important;

      min-width: 44px !important;

      max-width: 44px !important;
    }


    .chat-user strong {

      display: block;

      font-size: 15px;

      color: #202124;
    }


    .chat-user p {

      margin: 3px 0 0;

      font-size: 12px;

      color: #777d8a;
    }


    /* =====================================================
       CHAT MESSAGES
       ===================================================== */

    .chat-messages {

      flex: 1 1 auto;

      min-height: 0;

      padding: 20px;

      overflow-y: auto;

      background: #f8f9fc;

      scroll-behavior: smooth;
    }


    .message-row {

      display: flex;

      margin-bottom: 12px;

      width: 100%;
    }


    .message-row.mine {

      justify-content: flex-end;
    }


    .message-row.theirs {

      justify-content: flex-start;
    }


    .message-bubble {

      max-width: 65%;

      padding: 10px 14px;

      border-radius: 15px;

      background: #ffffff;

      border: 1px solid #e5e7eb;

      color: #202124;

      font-size: 14px;

      line-height: 1.45;

      word-break: break-word;

      box-shadow:
        0 2px 7px rgba(0, 0, 0, 0.04);
    }


    .message-row.mine .message-bubble {

      background: #4f46e5;

      color: #ffffff;

      border-color: #4f46e5;
    }


    .message-text {

      white-space: pre-wrap;
    }


    /* =====================================================
       MESSAGE META
       ===================================================== */

    .message-meta {

      display: flex;

      align-items: center;

      justify-content: flex-end;

      gap: 6px;

      margin-top: 5px;
    }


    .message-time {

      font-size: 10px;

      line-height: 1;

      opacity: 0.65;

      white-space: nowrap;
    }


    .message-status {

      font-size: 10px;

      line-height: 1;

      opacity: 0.9;

      white-space: nowrap;
    }


    .message-row.mine .message-status {

      color: rgba(255, 255, 255, 0.9);
    }


    .message-row.theirs .message-time {

      color: #777d8a;
    }


    /* =====================================================
       INPUT AREA
       ===================================================== */

    .message-input-area {

      flex: 0 0 auto;

      display: flex;

      align-items: center;

      gap: 10px;

      padding: 14px 16px;

      border-top: 1px solid #e5e7eb;

      background: #ffffff;
    }


    .message-input-area input {

      flex: 1;

      min-width: 0;

      height: 44px;

      padding: 0 14px;

      border: 1px solid #dfe2ea;

      border-radius: 10px;

      outline: none;

      font-size: 14px;

      color: #202124;
    }


    .message-input-area input:focus {

      border-color: #4f46e5;

      box-shadow:
        0 0 0 3px rgba(79, 70, 229, 0.08);
    }


    .message-input-area button {

      height: 44px;

      padding: 0 20px;

      border: none;

      border-radius: 10px;

      background: #4f46e5;

      color: #ffffff;

      font-weight: 700;

      cursor: pointer;

      flex-shrink: 0;
    }


    .message-input-area button:hover {

      background: #4338ca;
    }


    .message-input-area button:disabled {

      opacity: 0.6;

      cursor: not-allowed;
    }


    /* =====================================================
       LOADING
       ===================================================== */

    .loading-conversations {

      padding: 30px 20px;

      text-align: center;

      color: #777d8a;

      font-size: 14px;
    }


    /* =====================================================
       EMPTY CHAT
       ===================================================== */

    .chat-messages .empty-state {

      height: 100%;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      color: #737b8d;
    }


    .chat-messages .empty-state > div {

      font-size: 42px;

      margin-bottom: 12px;
    }


    .chat-messages .empty-state h2 {

      margin-bottom: 8px;

      color: #202124;
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 750px) {

      .messages-page {

        padding: 25px 12px 40px;
      }


      .messages-header h1 {

        font-size: 27px;
      }


      .messages-layout {

        height: calc(100vh - 155px);

        min-height: 500px;

        display: flex;

        flex-direction: column;
      }


      .conversation-list {

        width: 100%;

        min-width: 0;

        height: 220px;

        min-height: 220px;

        border-right: none;

        border-bottom: 1px solid #e5e7eb;
      }


      .chat-area {

        flex: 1;

        min-height: 0;

        height: auto;
      }


      .message-bubble {

        max-width: 80%;
      }


      .message-input-area {

        padding: 10px;
      }


      .message-input-area button {

        padding: 0 15px;
      }
    }

  </style>

</head>


<body>

  <!-- =====================================================

  <main class="messages-page">


    <div class="messages-header">

      </h1>


      <p>

      </p>

    </div>


    <!-- ===================================================

    <div class="messages-layout">

  <!-- =====================================================

       ===================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <!-- =====================================================
       YOUR MAIN JAVASCRIPT
       ===================================================== -->

  <script src="script.js"></script>


  <!-- =====================================================
       MESSAGE JAVASCRIPT
       ===================================================== -->

  <script>

    /* =====================================================
       VARIABLES
       ===================================================== */

    let messageFriends = [];

    let selectedMessageFriend = null;


    /* =====================================================
       LOAD FRIENDS
       ===================================================== */

    async function loadMessageFriends() {

      const container =
        document.getElementById(
          "conversationList"
        );


      if (!container) return;


      container.innerHTML = `

        <div class="loading-conversations">

          Loading friends...

        </div>

      `;


      try {

        const {

          data: {
            user

          }

        } =
          await supabaseClient.auth.getUser();


        if (!user) {

          container.innerHTML = `

            <div class="empty-conversation">

              <div class="conversation-icon">
                🔐
              </div>

              <div>

                <strong>
                  Login required
                </strong>

                <p>
                  Login to see your friends.
                </p>

              </div>

            </div>

          `;

          return;
        }


        /* ===============================================
           GET FRIENDSHIPS
           =============================================== */

        const {

          data,
          error

        } =
          await supabaseClient
            .from("friendships")
            .select("*")
            .or(
              `user_id.eq.${user.id},friend_id.eq.${user.id}`
            );


        if (error) {

          console.error(
            "Error loading friendships:",
            error
          );


          container.innerHTML = `

            <div class="empty-conversation">

              <div class="conversation-icon">
                ⚠️
              </div>

              <div>

                <strong>
                  Could not load friends
                </strong>

                <p>
                  ${escapeMessage(error.message)}
                </p>

              </div>

            </div>

          `;

          return;
        }


        if (!data || data.length === 0) {

          container.innerHTML = `

            <div class="empty-conversation">

              <div class="conversation-icon">
                👥
              </div>

              <div>

                <strong>
                  No friends yet
                </strong>

                <p>
                  Add a friend to start chatting.
                </p>

              </div>

            </div>

          `;

          return;
        }


        /* ===============================================
           FIND OTHER USER IDS
           =============================================== */

        const friendIds =
          data.map(friendship => {

            return friendship.user_id === user.id

              ? friendship.friend_id

              : friendship.user_id;

          });


        const uniqueFriendIds =
          [
            ...new Set(friendIds)
          ];


        if (uniqueFriendIds.length === 0) {

          container.innerHTML = `

            <div class="empty-conversation">

              <div class="conversation-icon">
                👥
              </div>

              <div>

                <strong>
                  No friends yet
                </strong>

              </div>

            </div>

          `;

          return;
        }


        /* ===============================================
           LOAD PROFILES
           =============================================== */

        const {

          data: profiles,
          error: profileError

        } =
          await supabaseClient
            .from("profiles")
            .select("*")
            .in(
              "id",
              uniqueFriendIds
            );


        if (profileError) {

          console.error(
            "Profile loading error:",
            profileError
          );


          container.innerHTML = `

            <div class="empty-conversation">

              <div class="conversation-icon">
                ⚠️
              </div>

              <div>

                <strong>
                  Could not load profiles
                </strong>

                <p>
                  ${escapeMessage(profileError.message)}
                </p>

              </div>

            </div>

          `;

          return;
        }


        messageFriends =
          profiles || [];


        /* ===============================================
           RENDER FRIENDS
           =============================================== */

        await renderMessageFriends();

      }

      catch (error) {

        console.error(
          "Messages error:",
          error
        );


        container.innerHTML = `

          <div class="empty-conversation">

            <div class="conversation-icon">
              ⚠️
            </div>

            <div>

              <strong>
                Something went wrong
              </strong>

              <p>
                ${escapeMessage(error.message)}
              </p>

            </div>

          </div>

        `;

      }

    }


    /* =====================================================
       RENDER FRIENDS
       ===================================================== */

    async function renderMessageFriends(
      searchText = ""
    ) {

      const container =
        document.getElementById(
          "conversationList"
        );


      if (!container) return;


      const search =
        String(searchText)
          .toLowerCase()
          .trim();


      let filtered =
        messageFriends.filter(
          friend => {

            const name =
              (
                friend.full_name ||
                friend.name ||
                friend.username ||
                ""
              )
                .toLowerCase();


            const username =
              (
                friend.username ||
                ""
              )
                .toLowerCase();


            return (
              name.includes(search) ||
              username.includes(search)
            );

          }
        );


      if (filtered.length === 0) {

        container.innerHTML = `

          <div class="empty-conversation">

            <div class="conversation-icon">
              🔎
            </div>

            <div>

              <strong>
                No friends found
              </strong>

              <p>
                Try another search.
              </p>

            </div>

          </div>

        `;

        return;
      }


      /* ===============================================
         CREATE FRIEND LIST
         =============================================== */

      let html = "";


      for (const friend of filtered) {

        const name =
          friend.full_name ||
          friend.name ||
          friend.username ||
          "Friend";


        const initial =
          name
            .charAt(0)
            .toUpperCase();


        const avatar =
          friend.avatar_url ||
          friend.profile_photo ||
          friend.photo_url ||
          "";


        let unreadCount = 0;


        /* =============================================
           GET UNREAD COUNT
           ============================================= */

        try {

          const {

            data: {
              user
            }

          } =
            await supabaseClient.auth.getUser();


          if (user) {

            const {

              count

            } =
              await supabaseClient
                .from("messages")
                .select(
                  "id",
                  {
                    count: "exact",
                    head: true
                  }
                )
                .eq(
                  "sender_id",
                  friend.id
                )
                .eq(
                  "receiver_id",
                  user.id
                )
                .eq(
                  "seen",
                  false
                );


            unreadCount =
              count || 0;

          }

        }

        catch (error) {

          console.error(
            "Unread count error:",
            error
          );

        }


        html += `

          <div
            class="conversation ${
              selectedMessageFriend &&
              selectedMessageFriend.id === friend.id
                ? "active"
                : ""
            }"
            onclick="openConversation('${friend.id}')">


            <div class="conversation-avatar">

              ${
                avatar

                  ?

                `<img
                  src="${avatar}"
                  alt="${escapeMessage(name)}">`

                  :

                initial
              }

            </div>


            <div class="conversation-info">

              <strong>
                ${escapeMessage(name)}
              </strong>


              <p>

                ${
                  friend.username

                    ?

                  "@" +
                  escapeMessage(
                    friend.username
                  )

                    :

                  "Start a conversation"
                }

              </p>

            </div>


            ${
              unreadCount > 0

                ?

              `<div class="unread-badge">
                ${
                  unreadCount > 99
                    ? "99+"
                    : unreadCount
                }
              </div>`

                :

              ""
            }

          </div>

        `;

      }


      container.innerHTML =
        html;

    }


    /* =====================================================
       SEARCH
       ===================================================== */

    function filterMessageFriends() {

      const input =
        document.getElementById(
          "messageFriendSearch"
        );


      if (!input) return;


      renderMessageFriends(
        input.value
      );

    }


    /* =====================================================
       OPEN CONVERSATION
       ===================================================== */

    async function openConversation(
      friendId
    ) {

      const friend =
        messageFriends.find(
          person =>
            person.id === friendId
        );


      if (!friend) return;


      selectedMessageFriend =
        friend;


      const name =
        friend.full_name ||
        friend.name ||
        friend.username ||
        "Friend";


      const avatar =
        friend.avatar_url ||
        friend.profile_photo ||
        friend.photo_url ||
        "";


      const header =
        document.getElementById(
          "chatHeader"
        );


      const inputArea =
        document.getElementById(
          "messageInputArea"
        );


      /* ===============================================
         HEADER
         =============================================== */

      if (header) {

        header.innerHTML = `

          <div class="chat-user">

            <div class="conversation-avatar">

              ${
                avatar

                  ?

                `<img
                  src="${avatar}"
                  alt="${escapeMessage(name)}">`

                  :

                name
                  .charAt(0)
                  .toUpperCase()
              }

            </div>


            <div>

              <strong>
                ${escapeMessage(name)}
              </strong>


              <p>

                ${
                  friend.username

                    ?

                  "@" +
                  escapeMessage(
                    friend.username
                  )

                    :

                  ""
                }

              </p>

            </div>

          </div>

        `;

      }


      /* ===============================================
         SHOW INPUT
         =============================================== */

      if (inputArea) {

        inputArea.style.display =
          "flex";

      }


      /* ===============================================
         LOAD CHAT
         =============================================== */

      await loadConversation(
        friendId
      );


      /* ===============================================
         REFRESH FRIEND LIST
         Removes unread badge
         =============================================== */

      await renderMessageFriends(
        document.getElementById(
          "messageFriendSearch"
        )?.value || ""
      );


      /* ===============================================
         FOCUS INPUT
         =============================================== */

      setTimeout(
        () => {

          const input =
            document.getElementById(
              "messageInput"
            );


          if (input) {

            input.focus();

          }

        },
        100
      );

    }


    /* =====================================================
       LOAD CONVERSATION
       ===================================================== */

    async function loadConversation(
      friendId
    ) {

      const chat =
        document.getElementById(
          "chatMessages"
        );


      if (!chat) return;


      const {

        data: {
          user
        }

      } =
        await supabaseClient.auth.getUser();


      if (!user) {

        return;
      }


      chat.innerHTML = `

        <div class="loading-conversations">

          Loading messages...

        </div>

      `;


      /* ===============================================
         GET MESSAGES
         =============================================== */

      const {

        data,
        error

      } =
        await supabaseClient
          .from("messages")
          .select("*")
          .or(
            `and(sender_id.eq.${user.id},receiver_id.eq.${friendId}),and(sender_id.eq.${friendId},receiver_id.eq.${user.id})`
          )
          .order(
            "created_at",
            {
              ascending: true
            }
          );


      /* ===============================================
         ERROR
         =============================================== */

      if (error) {

        console.error(
          "Message loading error:",
          error
        );


        chat.innerHTML = `

          <div class="empty-state">

            <div>
              ⚠️
            </div>


            <h2>
              Unable to load messages
            </h2>


            <p>
              ${escapeMessage(error.message)}
            </p>

          </div>

        `;

        return;
      }


      /* ===============================================
         NO MESSAGES
         =============================================== */

      if (
        !data ||
        data.length === 0
      ) {

        chat.innerHTML = `

          <div class="empty-state">

            <div>
              👋
            </div>


            <h2>
              Start chatting
            </h2>


            <p>
              Send your first message to this friend.
            </p>

          </div>

        `;


        /* Mark any old incoming messages as seen */

        await markMessagesAsSeen(
          user.id,
          friendId
        );


        return;
      }


      /* ===============================================
         MARK RECEIVED MESSAGES AS SEEN
         =============================================== */

      await markMessagesAsSeen(
        user.id,
        friendId
      );


      /* ===============================================
         RENDER MESSAGES
         =============================================== */

      chat.innerHTML =
        data.map(
          message => {

            const mine =
              message.sender_id ===
              user.id;


            const messageTime =
              new Date(
                message.created_at
              ).toLocaleTimeString(
                [],
                {
                  hour: "numeric",
                  minute: "2-digit"
                }
              );


            let status = "";


            if (mine) {

              status =
                message.seen
                  ? "✓✓ Seen"
                  : "✓ Sent";

            }


            return `

              <div
                class="message-row ${
                  mine
                    ? "mine"
                    : "theirs"
                }">


                <div class="message-bubble">


                  <div class="message-text">

                    ${escapeMessage(
                      message.message
                    )}

                  </div>


                  <div class="message-meta">


                    <span
                      class="message-time">

                      ${messageTime}

                    </span>


                    ${
                      mine

                        ?

                      `<span
                        class="message-status">

                        ${status}

                      </span>`

                        :

                      ""
                    }


                  </div>


                </div>


              </div>

            `;

          }
        ).join("");


      /* ===============================================
         SCROLL TO BOTTOM
         =============================================== */

      requestAnimationFrame(
        () => {

          chat.scrollTop =
            chat.scrollHeight;

        }
      );

    }


    /* =====================================================
       MARK MESSAGES AS SEEN
       ===================================================== */

    async function markMessagesAsSeen(
      userId,
      friendId
    ) {

      try {

        const {
          error
        } =
          await supabaseClient
            .from("messages")
            .update({
              seen: true
            })
            .eq(
              "receiver_id",
              userId
            )
            .eq(
              "sender_id",
              friendId
            )
            .eq(
              "seen",
              false
            );


        if (error) {

          console.error(
            "Mark seen error:",
            error
          );

        }

      }

      catch (error) {

        console.error(
          "Mark seen exception:",
          error
        );

      }

    }


    /* =====================================================
       SEND MESSAGE
       ===================================================== */

    async function sendMessage() {

      if (
        !selectedMessageFriend
      ) {

        return;
      }


      const input =
        document.getElementById(
          "messageInput"
        );


      const button =
        document.getElementById(
          "sendMessageButton"
        );


      if (!input) return;


      const text =
        input.value.trim();


      if (!text) return;


      const {

        data: {
          user
        }

      } =
        await supabaseClient.auth.getUser();


      if (!user) {

        alert(
          "Please login first."
        );

        return;
      }


      if (button) {

        button.disabled = true;

      }


      input.disabled = true;


      /* ===============================================
         INSERT MESSAGE
         =============================================== */

      const {

        data,
        error

      } =
        await supabaseClient
          .from("messages")
          .insert({

            sender_id:
              user.id,

            receiver_id:
              selectedMessageFriend.id,

            message:
              text,

            seen:
              false

          })
          .select()
          .single();


      input.disabled = false;


      if (button) {

        button.disabled = false;

      }


      if (error) {

        console.error(
          "Send message error:",
          error
        );


        alert(
          error.message
        );


        return;
      }


      /* ===============================================
         CLEAR INPUT
         =============================================== */

      input.value = "";


      /* ===============================================
         ADD MESSAGE IMMEDIATELY
         =============================================== */

      if (data) {

        addMessageToChat(
          data,
          user.id
        );

      }


      input.focus();

    }


    /* =====================================================
       ADD NEW MESSAGE TO CHAT
       ===================================================== */

    function addMessageToChat(
      message,
      currentUserId
    ) {

      const chat =
        document.getElementById(
          "chatMessages"
        );


      if (!chat) return;


      /* Remove empty state */

      const empty =
        chat.querySelector(
          ".empty-state"
        );


      if (empty) {

        chat.innerHTML = "";

      }


      const mine =
        message.sender_id ===
        currentUserId;


      const messageTime =
        new Date(
          message.created_at
        ).toLocaleTimeString(
          [],
          {
            hour: "numeric",
            minute: "2-digit"
          }
        );


      const status =
        message.seen
          ? "✓✓ Seen"
          : "✓ Sent";


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "message-row " +
        (
          mine
            ? "mine"
            : "theirs"
        );


      row.innerHTML = `

        <div class="message-bubble">

          <div class="message-text">

            ${escapeMessage(
              message.message
            )}

          </div>


          <div class="message-meta">

            <span class="message-time">

              ${messageTime}

            </span>


            ${
              mine

                ?

              `<span class="message-status">

                ${status}

              </span>`

                :

              ""
            }

          </div>

        </div>

      `;


      chat.appendChild(
        row
      );


      chat.scrollTop =
        chat.scrollHeight;

    }


    /* =====================================================
       ENTER KEY
       ===================================================== */

    function handleMessageKey(
      event
    ) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }


    /* =====================================================
       ESCAPE TEXT
       ===================================================== */

    function escapeMessage(
      text
    ) {

      const div =
        document.createElement(
          "div"
        );


      div.textContent =
        text || "";


      return div.innerHTML;

    }


    /* =====================================================
       START
       ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      async () => {

        /*
         * Wait briefly for script.js
         * and Supabase authentication.
         */

        setTimeout(
          async () => {

            await loadMessageFriends();

          },
          300
        );

      }
    );

  </script>

</body>
