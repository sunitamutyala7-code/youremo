<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouRemo - Messages</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head><body>
<header class="nav">
  <a class="logo" href="index.html">YouRemo</a>
  <nav class="nav-links">
    <button onclick="goHome()">🏠</button><button onclick="goToFriends()">👥</button>
    <button onclick="goToRequests()">🔔 <span id="requestBadge" class="badge">0</span></button>
    <button onclick="goToMessages()">💬</button><button onclick="goToProfile()">👤</button>
  </nav>
  <div class="account">
    <button class="account-btn" id="loginButton" onclick="handleAccountClick()"><span id="navAvatar" class="avatar">?</span><span>Login</span></button>
    <div id="accountMenu" class="account-menu">
      <button onclick="goToProfile()">My Profile</button><button onclick="goToFriends()">My Friends</button>
      <button class="logout" onclick="logout()">Logout</button>
    </div>
  </div>
</header>

<main class="container page"><div class="page-head"><h1>💬 Messages</h1><p>Chat with your friends and connections.</p></div>
<div class="messages-layout">
<aside class="conversations"><div class="conversation-search"><input id="messageFriendSearch" placeholder="Search friends..."></div><div id="conversationList" class="conversation-list"></div></aside>
<section class="chat-panel">
<div class="chat-header"><div id="chatFriendAvatar" class="avatar">?</div><div><h3 id="chatFriendName">Select a friend</h3><p id="chatFriendUsername"></p></div></div>
<div id="chatMessages" class="chat-messages"><div class="empty-state"><div>💬</div><h2>Your Messages</h2><p>Select a friend to start chatting.</p></div></div>
<div class="message-compose"><input id="messageInput" class="message-input" placeholder="Type a message..."><button id="sendMessageButton" class="primary-btn" onclick="sendMessage()">Send</button></div>
</section></div></main>

<div id="authModal" class="modal">
  <div class="modal-card">
    <button class="modal-close" onclick="closeAuth()">×</button>
    <form class="auth-form" onsubmit="event.preventDefault(); document.querySelector('.auth-submit').click();">
      <h2 id="authTitle">Welcome Back</h2><p id="authSubtitle">Login to your YouRemo account</p>
      <input id="authName" style="display:none" placeholder="Full name" autocomplete="name">
      <input id="authUsername" style="display:none" placeholder="Username" autocomplete="username">
      <input id="authEmail" type="email" placeholder="Email" autocomplete="email">
      <input id="authPassword" type="password" placeholder="Password" autocomplete="current-password">
      <button class="primary-btn auth-submit" type="button" onclick="login()">Login</button>
      <button id="authSwitch" class="auth-switch" type="button" onclick="showSignup()">Create an account</button>
    </form>
  </div>
</div>
<div id="toast" class="toast"></div>
<script src="script.js"></script></body></html>
