<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YouRemo - Messages</title>

  <link rel="stylesheet" href="style.css">

  <style>

    /* =====================================================
       MESSAGES PAGE
       ===================================================== */

    .messages-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 25px 60px;
    }

    .messages-header {
      margin-bottom: 20px;
    }

    .messages-header h1 {
      margin: 0 0 7px;
      font-size: 32px;
    }

    .messages-header p {
      margin: 0;
      color: #737b8d;
    }


    /* =====================================================
       MAIN LAYOUT
       ===================================================== */

    .messages-layout {
      display: flex;
      width: 100%;
      height: calc(100vh - 210px);
      min-height: 500px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 35px rgba(30, 35, 65, 0.08);
    }


    /* =====================================================
       CONVERSATION LIST
       ===================================================== */

    .conversation-list {
      width: 320px;
      min-width: 320px;
      height: 100%;
      background: #fafbff;
      border-right: 1px solid #e5e7eb;
      overflow-y: auto;
    }

    .conversation-search {
      padding: 15px;
      border-bottom: 1px solid #e5e7eb;
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .conversation-search input {
      width: 100%;
      height: 42px;
      padding: 0 13px;
      border: 1px solid #dfe2ea;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
      box-sizing: border-box;
    }

    .conversation-search input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.08);
    }

    .conversation {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 15px;
      cursor: pointer;
      border-bottom: 1px solid #eeeeee;
      transition: background 0.2s ease;
    }

    .conversation:hover {
      background: #f0f1ff;
    }

    .conversation.selected {
      background: #eef2ff;
    }

    .conversation-avatar {
      width: 48px !important;
      height: 48px !important;
      min-width: 48px !important;
      max-width: 48px !important;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      font-size: 17px;
      font-weight: 700;
    }

    .conversation-avatar img {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      border-radius: 50%;
      display: block;
    }

    .conversation-info {
      flex: 1;
      min-width: 0;
    }

    .conversation-info strong {
      display: block;
      font-size: 15px;
      color: #202124;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .conversation-info p {
      margin: 4px 0 0;
      font-size: 12px;
      color: #777d8a;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty-conversation {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 25px 18px;
      color: #737b8d;
    }

    .conversation-icon {
      width: 45px;
      height: 45px;
      min-width: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #eeeeff;
      font-size: 21px;
    }

    .loading-conversations {
      padding: 30px 20px;
      text-align: center;
      color: #777d8a;
      font-size: 14px;
    }


    /* =====================================================
       CHAT AREA
       ===================================================== */

    .chat-area {
      flex: 1;
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
    }

    .chat-header {
      min-height: 72px;
      flex: 0 0 72px;
      display: flex;
      align-items: center;
      padding: 12px 20px;
      border-bottom: 1px solid #e5e7eb;
      background: #fff;
      box-sizing: border-box;
    }

    .chat-empty-title {
      color: #737b8d;
      font-size: 15px;
    }

    .chat-user {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-user .conversation-avatar {
      width: 44px !important;
      height: 44px !important;
      min-width: 44px !important;
      max-width: 44px !important;
    }

    .chat-user strong {
      display: block;
      font-size: 15px;
      color: #202124;
    }

    .chat-user p {
      margin: 3px 0 0;
      font-size: 12px;
      color: #777d8a;
    }


    /* =====================================================
       CHAT MESSAGES
       ===================================================== */

    .chat-messages {
      flex: 1 1 auto;
      min-height: 0;
      padding: 20px;
      overflow-y: auto;
      background: #f8f9fc;
      scroll-behavior: smooth;
    }

    .message-row {
      display: flex;
      margin-bottom: 14px;
      width: 100%;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message-row.theirs {
      justify-content: flex-start;
    }

    .message-content {
      max-width: 65%;
      display: flex;
      flex-direction: column;
    }

    .message-row.mine .message-content {
      align-items: flex-end;
    }

    .message-row.theirs .message-content {
      align-items: flex-start;
    }

    .message-bubble {
      padding: 10px 14px;
      border-radius: 15px;
      background: #fff;
      border: 1px solid #e5e7eb;
      color: #202124;
      font-size: 14px;
      line-height: 1.45;
      word-break: break-word;
      box-shadow: 0 2px 7px rgba(0, 0, 0, 0.04);
    }

    .message-row.mine .message-bubble {
      background: #4f46e5;
      color: #fff;
      border-color: #4f46e5;
    }

    .message-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 5px;
      font-size: 10px;
      color: #858b98;
    }

    .message-row.mine .message-meta {
      justify-content: flex-end;
    }

    .message-sent {
      font-size: 10px;
      color: #4f46e5;
      font-weight: 600;
    }

    .message-seen {
      font-size: 10px;
      color: #4f46e5;
      font-weight: 600;
    }


    /* =====================================================
       INPUT
       ===================================================== */

    .message-input-area {
      flex: 0 0 auto;
      display: flex;
      gap: 10px;
      padding: 13px 16px;
      border-top: 1px solid #e5e7eb;
      background: #fff;
    }

    .message-input-area input {
      flex: 1;
      min-width: 0;
      height: 44px;
      padding: 0 14px;
      border: 1px solid #dfe2ea;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
      background: #fff;
      box-sizing: border-box;
    }

    .message-input-area input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.08);
    }

    .message-input-area button {
      height: 44px;
      padding: 0 20px;
      border: none;
      border-radius: 10px;
      background: #4f46e5;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .message-input-area button:hover {
      background: #4338ca;
    }

    .message-input-area button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }


    /* =====================================================
       EMPTY STATE
       ===================================================== */

    .chat-messages .empty-state {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .chat-messages .empty-state > div {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .chat-messages .empty-state h2 {
      margin-bottom: 8px;
    }

    .chat-messages .empty-state p {
      color: #777d8a;
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 750px) {

      .messages-page {
        padding: 25px 12px 40px;
      }

      .messages-layout {
        flex-direction: column;
        height: calc(100vh - 170px);
        min-height: 550px;
      }

      .conversation-list {
        width: 100%;
        min-width: 0;
        height: 230px;
        flex: 0 0 230px;
        border-right: none;
        border-bottom: 1px solid #e5e7eb;
      }

      .chat-area {
        height: auto;
        flex: 1;
        min-height: 0;
      }

      .message-content {
        max-width: 80%;
      }

      .message-bubble {
        font-size: 13px;
      }

    }

  </style>

</head>


<body>

<!-- =====================================================
     SUPABASE
     ===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- =====================================================
     YOUR MAIN SCRIPT
     ===================================================== -->

<script src="script.js"></script>



<script>

  /* =====================================================
     PAGE VARIABLES
     ===================================================== */

  let messageFriends = [];

  let selectedMessageFriend = null;

  let currentMessageUser = null;

  let messageSending = false;


  /*
   * IMPORTANT:
   *
   * We use a UNIQUE variable name here.
   *
   * Do NOT call this messageRealtimeChannel because
   * script.js may already have a variable with that name.
   */

  let messagesPageRealtimeChannel = null;



  /* =====================================================
     GET CURRENT USER
     ===================================================== */

  async function getMessageUser() {

    try {

      const {
        data,
        error
      } = await supabaseClient.auth.getUser();


      if (error) {

        console.error(
          "Get user error:",
          error
        );

        return null;

      }


      return data.user || null;


    } catch (error) {

      console.error(
        "Get user exception:",
        error
      );

      return null;

    }

  }



  /* =====================================================
     START MESSAGE REALTIME
     
     THIS HANDLES:

     1. New messages
     2. Seen updates
     ===================================================== */

  async function startMessagesPageRealtime() {

    /*
     * Get user first.
     */

    const user =
      currentMessageUser ||
      await getMessageUser();


    if (!user) {

      console.log(
        "Messages realtime: no logged-in user."
      );

      return;

    }


    currentMessageUser =
      user;


    /*
     * Remove ONLY our page channel.
     */

    if (messagesPageRealtimeChannel) {

      try {

        await supabaseClient.removeChannel(
          messagesPageRealtimeChannel
        );

      } catch (error) {

        console.error(
          "Could not remove old message channel:",
          error
        );

      }

      messagesPageRealtimeChannel =
        null;

    }


    console.log(
      "Starting Messages page realtime..."
    );


    /*
     * Create realtime channel.
     */

    messagesPageRealtimeChannel =
      supabaseClient
        .channel(
          "messages-page-" +
          user.id +
          "-" +
          Date.now()
        )


        /* =============================================
           NEW MESSAGE
           ============================================= */

        .on(
          "postgres_changes",
          {
            event: "INSERT",
            schema: "public",
            table: "messages"
          },
          function(payload) {

            console.log(
              "🔥 New message realtime:",
              payload.new
            );


            handleMessagesPageNewMessage(
              payload.new
            );

          }
        )


        /* =============================================
           MESSAGE UPDATE

           MOST IMPORTANT FOR SEEN.

           When receiver opens chat:

           seen false → true

           Supabase sends UPDATE here.

           Sender's browser receives it.
           ============================================= */

        .on(
          "postgres_changes",
          {
            event: "UPDATE",
            schema: "public",
            table: "messages"
          },
          function(payload) {

            console.log(
              "👀 Message UPDATE realtime:",
              payload.new
            );


            handleMessagesPageMessageUpdate(
              payload.new
            );

          }
        )


        .subscribe(
          function(status, error) {

            console.log(
              "Messages realtime status:",
              status
            );


            if (error) {

              console.error(
                "Messages realtime error:",
                error
              );

            }

          }
        );

  }



  /* =====================================================
     HANDLE NEW MESSAGE
     ===================================================== */

  function handleMessagesPageNewMessage(
    message
  ) {

    if (!currentMessageUser) {
      return;
    }


    const userId =
      currentMessageUser.id;


    /*
     * Ignore messages unrelated to this user.
     */

    const belongsToUser =
      String(message.sender_id) ===
        String(userId)
      ||
      String(message.receiver_id) ===
        String(userId);


    if (!belongsToUser) {
      return;
    }


    /*
     * No conversation selected.
     */

    if (!selectedMessageFriend) {
      return;
    }


    const friendId =
      selectedMessageFriend.id;


    /*
     * Check current conversation.
     */

    const belongsToCurrentConversation =
      (
        String(message.sender_id) ===
          String(userId)
        &&
        String(message.receiver_id) ===
          String(friendId)
      )
      ||
      (
        String(message.sender_id) ===
          String(friendId)
        &&
        String(message.receiver_id) ===
          String(userId)
      );


    if (!belongsToCurrentConversation) {

      console.log(
        "Realtime message belongs to another conversation."
      );

      return;

    }


    /*
     * Add message to screen.
     */

    addMessageIfMissing(
      message,
      userId
    );


    /*
     * IMPORTANT:
     *
     * If WE are the receiver and the conversation
     * is currently open, mark this new message seen.
     *
     * If the conversation is NOT open, do NOT mark it.
     */

    if (
      String(message.receiver_id) ===
      String(userId)
    ) {

      markSingleMessageSeen(
        message.id
      );

    }

  }



  /* =====================================================
     HANDLE MESSAGE UPDATE
     
     THIS IS WHAT CHANGES:

     ✓ Sent

     TO:

     ✓✓ Seen
     ===================================================== */

  function handleMessagesPageMessageUpdate(
    message
  ) {

    if (!currentMessageUser) {
      return;
    }


    /*
     * Only care about messages sent by us.
     *
     * If somebody else reads our message,
     * that message changes seen=true.
     */

    if (
      String(message.sender_id) !==
      String(currentMessageUser.id)
    ) {

      /*
       * However, if this is a received message and
       * the current conversation is open, make sure
       * it appears correctly.
       */

      if (
        selectedMessageFriend &&
        String(message.sender_id) ===
        String(selectedMessageFriend.id) &&
        String(message.receiver_id) ===
        String(currentMessageUser.id)
      ) {

        updateReceivedMessageInScreen(
          message
        );

      }

      return;

    }


    /*
     * Only update if seen is actually TRUE.
     */

    if (
      message.seen !== true
    ) {

      return;

    }


    console.log(
      "✅ Our message was seen:",
      message.id
    );


    /*
     * Change ✓ Sent → ✓✓ Seen.
     */

    updateMessageSeen(
      message.id
    );

  }



  /* =====================================================
     UPDATE SEEN UI
     ===================================================== */

  function updateMessageSeen(
    messageId
  ) {

    if (!messageId) {
      return;
    }


    const row =
      document.querySelector(
        `.message-row[data-message-id="${CSS.escape(String(messageId))}"]`
      );


    if (!row) {

      console.log(
        "Seen UI row not found:",
        messageId
      );

      return;

    }


    const meta =
      row.querySelector(
        ".message-meta"
      );


    if (!meta) {
      return;
    }


    /*
     * Already Seen?
     */

    if (
      meta.querySelector(
        ".message-seen"
      )
    ) {

      return;

    }


    /*
     * Remove Sent.
     */

    const sent =
      meta.querySelector(
        ".message-sent"
      );


    if (sent) {
      sent.remove();
    }


    /*
     * Create Seen.
     */

    const seen =
      document.createElement(
        "span"
      );


    seen.className =
      "message-seen";


    seen.textContent =
      "✓✓ Seen";


    meta.appendChild(
      seen
    );


    console.log(
      "✓✓ Seen displayed:",
      messageId
    );

  }



  /* =====================================================
     UPDATE RECEIVED MESSAGE
     ===================================================== */

  function updateReceivedMessageInScreen(
    message
  ) {

    const row =
      document.querySelector(
        `.message-row[data-message-id="${CSS.escape(String(message.id))}"]`
      );


    if (!row) {
      return;
    }


    /*
     * No special visual status for received messages.
     */

  }



  /* =====================================================
     LOAD FRIENDS
     ===================================================== */

  async function loadMessageFriends() {

    const container =
      document.getElementById(
        "conversationList"
      );


    if (!container) {
      return;
    }


    container.innerHTML = `
      <div class="loading-conversations">
        Loading friends...
      </div>
    `;


    try {

      const user =
        await getMessageUser();


      currentMessageUser =
        user;


      if (!user) {

        container.innerHTML = `
          <div class="empty-conversation">

            <div class="conversation-icon">
              🔐
            </div>

            <div>

              <strong>
                Login required
              </strong>

              <p>
                Login to see your friends.
              </p>

            </div>

          </div>
        `;

        return;

      }


      /*
       * Start realtime AFTER user is known.
       */

      await startMessagesPageRealtime();


      /*
       * Get friendships.
       */

      const {
        data,
        error
      } =
        await supabaseClient
          .from("friendships")
          .select("*")
          .or(
            `user_id.eq.${user.id},friend_id.eq.${user.id}`
          );


      if (error) {

        console.error(
          "Friendship error:",
          error
        );


        container.innerHTML = `
          <div class="empty-conversation">

            <div class="conversation-icon">
              ⚠️
            </div>

            <div>

              <strong>
                Could not load friends
              </strong>

              <p>
                ${escapeHtml(error.message)}
              </p>

            </div>

          </div>
        `;

        return;

      }


      const friendIds =
        (data || [])
          .map(
            friendship => {

              return String(
                friendship.user_id
              ) === String(user.id)

                ? friendship.friend_id

                : friendship.user_id;

            }
          )
          .filter(Boolean);


      const uniqueFriendIds =
        [...new Set(friendIds)];


      if (!uniqueFriendIds.length) {

        messageFriends = [];

        renderMessageFriends();

        return;

      }


      /*
       * Load profiles.
       */

      const {
        data: profiles,
        error: profileError
      } =
        await supabaseClient
          .from("profiles")
          .select("*")
          .in(
            "id",
            uniqueFriendIds
          );


      if (profileError) {

        console.error(
          "Profile error:",
          profileError
        );


        container.innerHTML = `
          <div class="empty-conversation">

            <div class="conversation-icon">
              ⚠️
            </div>

            <div>

              <strong>
                Could not load profiles
              </strong>

              <p>
                ${escapeHtml(profileError.message)}
              </p>

            </div>

          </div>
        `;

        return;

      }


      messageFriends =
        profiles || [];


      renderMessageFriends();


    } catch (error) {

      console.error(
        "Load friends error:",
        error
      );

    }

  }



  /* =====================================================
     RENDER FRIENDS
     ===================================================== */

  function renderMessageFriends(
    searchText = ""
  ) {

    const container =
      document.getElementById(
        "conversationList"
      );


    if (!container) {
      return;
    }


    const search =
      String(searchText)
        .toLowerCase()
        .trim();


    const filtered =
      messageFriends.filter(
        friend => {

          const name =
            String(
              friend.full_name ||
              friend.name ||
              friend.username ||
              ""
            ).toLowerCase();


          const username =
            String(
              friend.username ||
              ""
            ).toLowerCase();


          return (
            name.includes(search) ||
            username.includes(search)
          );

        }
      );


    if (!filtered.length) {

      container.innerHTML = `
        <div class="empty-conversation">

          <div class="conversation-icon">
            🔎
          </div>

          <div>

            <strong>
              No friends found
            </strong>

            <p>
              Try another search.
            </p>

          </div>

        </div>
      `;

      return;

    }


    container.innerHTML =
      filtered
        .map(
          friend => {

            const name =
              friend.full_name ||
              friend.name ||
              friend.username ||
              "Friend";


            const initial =
              name
                .charAt(0)
                .toUpperCase();


            const avatar =
              friend.avatar_url ||
              friend.profile_photo ||
              friend.photo_url ||
              "";


            const selected =
              selectedMessageFriend &&
              String(
                selectedMessageFriend.id
              ) === String(friend.id)

                ? "selected"

                : "";


            return `
              <div
                class="conversation ${selected}"
                data-friend-id="${escapeHtml(friend.id)}">

                <div class="conversation-avatar">

                  ${
                    avatar

                      ? `
                        <img
                          src="${escapeHtml(avatar)}"
                          alt="${escapeHtml(name)}">
                      `

                      : escapeHtml(initial)
                  }

                </div>


                <div class="conversation-info">

                  <strong>
                    ${escapeHtml(name)}
                  </strong>

                  <p>
                    ${
                      friend.username

                        ? "@" +
                          escapeHtml(
                            friend.username
                          )

                        : "Start a conversation"
                    }
                  </p>

                </div>

              </div>
            `;

          }
        )
        .join("");


    /*
     * Add click handlers.
     */

    container
      .querySelectorAll(
        ".conversation"
      )
      .forEach(
        element => {

          element.addEventListener(
            "click",
            function() {

              openConversation(
                element.dataset.friendId
              );

            }
          );

        }
      );

  }



  /* =====================================================
     SEARCH
     ===================================================== */

  function filterMessageFriends() {

    const input =
      document.getElementById(
        "messageFriendSearch"
      );


    if (!input) {
      return;
    }


    renderMessageFriends(
      input.value
    );

  }



  /* =====================================================
     OPEN CONVERSATION
     
     IMPORTANT:
     
     ONLY HERE do we mark received messages as SEEN.
     ===================================================== */

  async function openConversation(
    friendId
  ) {

    const friend =
      messageFriends.find(
        person =>
          String(person.id) ===
          String(friendId)
      );


    if (!friend) {

      console.error(
        "Friend not found:",
        friendId
      );

      return;

    }


    selectedMessageFriend =
      friend;


    renderMessageFriends(
      document.getElementById(
        "messageFriendSearch"
      )?.value || ""
    );


    /*
     * Header.
     */

    const name =
      friend.full_name ||
      friend.name ||
      friend.username ||
      "Friend";


    const avatar =
      friend.avatar_url ||
      friend.profile_photo ||
      friend.photo_url ||
      "";


    const header =
      document.getElementById(
        "chatHeader"
      );


    if (header) {

      header.innerHTML = `
        <div class="chat-user">

          <div class="conversation-avatar">

            ${
              avatar

                ? `
                  <img
                    src="${escapeHtml(avatar)}"
                    alt="${escapeHtml(name)}">
                `

                : escapeHtml(
                    name
                      .charAt(0)
                      .toUpperCase()
                  )
            }

          </div>

          <div>

            <strong>
              ${escapeHtml(name)}
            </strong>

            <p>
              ${
                friend.username

                  ? "@" +
                    escapeHtml(
                      friend.username
                    )

                  : ""
              }
            </p>

          </div>

        </div>
      `;

    }


    /*
     * Show input.
     */

    const inputArea =
      document.getElementById(
        "messageInputArea"
      );


    if (inputArea) {

      inputArea.style.display =
        "flex";

    }


    /*
     * Load messages.
     *
     * This function also marks ONLY the received
     * messages in THIS conversation as seen.
     */

    await loadConversation(
      friend.id
    );


    /*
     * Focus input.
     */

    setTimeout(
      function() {

        const input =
          document.getElementById(
            "messageInput"
          );


        if (input) {
          input.focus();
        }

      },
      100
    );

  }



  /* =====================================================
     LOAD CONVERSATION
     ===================================================== */

  async function loadConversation(
    friendId
  ) {

    const chat =
      document.getElementById(
        "chatMessages"
      );


    if (!chat) {
      return;
    }


    const user =
      currentMessageUser ||
      await getMessageUser();


    if (!user) {
      return;
    }


    currentMessageUser =
      user;


    chat.innerHTML = `
      <div class="loading-conversations">
        Loading messages...
      </div>
    `;


    try {

      /*
       * Get conversation.
       */

      const {
        data: messages,
        error
      } =
        await supabaseClient
          .from("messages")
          .select("*")
          .or(
            `and(sender_id.eq.${user.id},receiver_id.eq.${friendId}),and(sender_id.eq.${friendId},receiver_id.eq.${user.id})`
          )
          .order(
            "created_at",
            {
              ascending: true
            }
          );


      if (error) {

        console.error(
          "Message loading error:",
          error
        );


        chat.innerHTML = `
          <div class="empty-state">

            <div>⚠️</div>

            <h2>
              Unable to load messages
            </h2>

            <p>
              ${escapeHtml(error.message)}
            </p>

          </div>
        `;

        return;

      }


      /*
       * IMPORTANT:
       *
       * We ONLY mark messages as seen if:
       *
       * sender_id = friend
       * receiver_id = current user
       * seen = false
       *
       * This function is called ONLY after the user
       * opens the conversation.
       */

      const unreadMessages =
        (messages || []).filter(
          message => {

            return (
              String(message.sender_id) ===
              String(friendId)

              &&

              String(message.receiver_id) ===
              String(user.id)

              &&

              message.seen !== true
            );

          }
        );


      /*
       * Mark them seen.
       */

      if (
        unreadMessages.length > 0
      ) {

        console.log(
          "👀 Marking current conversation as seen:",
          unreadMessages.length
        );


        /*
         * Update all unread messages belonging
         * to this conversation.
         */

        const {
          error: seenError
        } =
          await supabaseClient
            .from("messages")
            .update({
              seen: true
            })
            .eq(
              "sender_id",
              friendId
            )
            .eq(
              "receiver_id",
              user.id
            )
            .eq(
              "seen",
              false
            );


        if (seenError) {

          console.error(
            "Mark messages seen error:",
            seenError
          );

        } else {

          console.log(
            "✅ Current conversation messages marked seen."
          );

        }

      }


      /*
       * Reload the conversation after marking seen.
       *
       * This is ONLY for the receiver's screen.
       */

      let displayMessages =
        messages || [];


      if (
        unreadMessages.length > 0
      ) {

        const {
          data: refreshedMessages,
          error: refreshError
        } =
          await supabaseClient
            .from("messages")
            .select("*")
            .or(
              `and(sender_id.eq.${user.id},receiver_id.eq.${friendId}),and(sender_id.eq.${friendId},receiver_id.eq.${user.id})`
            )
            .order(
              "created_at",
              {
                ascending: true
              }
            );


        if (!refreshError) {

          displayMessages =
            refreshedMessages || [];

        }

      }


      /*
       * No messages.
       */

      if (
        displayMessages.length === 0
      ) {

        chat.innerHTML = `
          <div class="empty-state">

            <div>👋</div>

            <h2>
              Start chatting
            </h2>

            <p>
              Send your first message to this friend.
            </p>

          </div>
        `;

        return;

      }


      /*
       * Display.
       */

      renderMessages(
        displayMessages,
        user.id
      );


    } catch (error) {

      console.error(
        "Load conversation error:",
        error
      );

    }

  }



  /* =====================================================
     MARK ONE MESSAGE SEEN
     
     Used when a new message arrives while the
     conversation is already open.
     ===================================================== */

  async function markSingleMessageSeen(
    messageId
  ) {

    if (!messageId) {
      return;
    }


    if (!currentMessageUser) {
      return;
    }


    if (!selectedMessageFriend) {
      return;
    }


    try {

      const {
        error
      } =
        await supabaseClient
          .from("messages")
          .update({
            seen: true
          })
          .eq(
            "id",
            messageId
          )
          .eq(
            "receiver_id",
            currentMessageUser.id
          )
          .eq(
            "seen",
            false
          );


      if (error) {

        console.error(
          "Mark single message seen error:",
          error
        );

        return;

      }


      console.log(
        "👀 New message marked seen:",
        messageId
      );


    } catch (error) {

      console.error(
        "Mark single message seen exception:",
        error
      );

    }

  }



  /* =====================================================
     RENDER MESSAGES
     ===================================================== */

  function renderMessages(
    messages,
    userId
  ) {

    const chat =
      document.getElementById(
        "chatMessages"
      );


    if (!chat) {
      return;
    }


    chat.innerHTML =
      messages
        .map(
          message => {

            const mine =
              String(message.sender_id) ===
              String(userId);


            const time =
              formatMessageTime(
                message.created_at
              );


            /*
             * ONLY OUR messages can show
             * Sent / Seen.
             */

            const seen =
              mine &&
              message.seen === true;


            return `
              <div
                class="message-row ${mine ? "mine" : "theirs"}"
                data-message-id="${escapeHtml(message.id || "")}">

                <div class="message-content">

                  <div class="message-bubble">
                    ${escapeHtml(
                      message.message || ""
                    )}
                  </div>


                  <div class="message-meta">

                    <span>
                      ${time}
                    </span>


                    ${
                      mine

                        ? seen

                          ? `
                            <span class="message-seen">
                              ✓✓ Seen
                            </span>
                          `

                          : `
                            <span class="message-sent">
                              ✓ Sent
                            </span>
                          `

                        : ""
                    }

                  </div>

                </div>

              </div>
            `;

          }
        )
        .join("");


    scrollChatToBottom();

  }



  /* =====================================================
     SEND MESSAGE
     ===================================================== */

  async function sendMessage() {

    if (messageSending) {
      return;
    }


    if (!selectedMessageFriend) {

      alert(
        "Select a friend first."
      );

      return;

    }


    const input =
      document.getElementById(
        "messageInput"
      );


    const button =
      document.getElementById(
        "sendMessageButton"
      );


    if (!input) {
      return;
    }


    const text =
      input.value.trim();


    if (!text) {
      return;
    }


    const user =
      currentMessageUser ||
      await getMessageUser();


    if (!user) {

      alert(
        "Please login first."
      );

      return;

    }


    currentMessageUser =
      user;


    messageSending =
      true;


    input.disabled =
      true;


    if (button) {

      button.disabled =
        true;

      button.textContent =
        "Sending...";

    }


    try {

      /*
       * IMPORTANT:
       *
       * Every newly sent message starts:
       *
       * seen = false
       *
       * It becomes true ONLY when receiver opens
       * the conversation.
       */

      const {
        data,
        error
      } =
        await supabaseClient
          .from("messages")
          .insert({

            sender_id:
              user.id,

            receiver_id:
              selectedMessageFriend.id,

            message:
              text,

            seen:
              false

          })
          .select()
          .single();


      if (error) {

        console.error(
          "Send message error:",
          error
        );


        alert(
          error.message
        );

        return;

      }


      input.value = "";


      /*
       * Realtime will also receive this INSERT.
       *
       * addMessageIfMissing prevents duplicate display.
       */

      if (data) {

        addMessageIfMissing(
          data,
          user.id
        );

      }


    } catch (error) {

      console.error(
        "Send message exception:",
        error
      );


    } finally {

      messageSending =
        false;


      input.disabled =
        false;


      if (button) {

        button.disabled =
          false;

        button.textContent =
          "Send";

      }


      input.focus();

    }

  }



  /* =====================================================
     ADD MESSAGE IF NOT ALREADY ON SCREEN
     ===================================================== */

  function addMessageIfMissing(
    message,
    userId
  ) {

    const chat =
      document.getElementById(
        "chatMessages"
      );


    if (!chat) {
      return;
    }


    /*
     * If message already exists, don't duplicate it.
     */

    if (message.id) {

      const existing =
        chat.querySelector(
          `.message-row[data-message-id="${CSS.escape(String(message.id))}"]`
        );


      if (existing) {

        /*
         * If the existing message is ours and the
         * database now says seen=true, update it.
         */

        if (
          message.seen === true
        ) {

          updateMessageSeen(
            message.id
          );

        }

        return;

      }

    }


    /*
     * Remove empty state.
     */

    const empty =
      chat.querySelector(
        ".empty-state"
      );


    if (empty) {
      chat.innerHTML = "";
    }


    const mine =
      String(message.sender_id) ===
      String(userId);


    /*
     * Row.
     */

    const row =
      document.createElement(
        "div"
      );


    row.className =
      "message-row " +
      (
        mine
          ? "mine"
          : "theirs"
      );


    if (message.id) {

      row.dataset.messageId =
        message.id;

    }


    /*
     * Content.
     */

    const content =
      document.createElement(
        "div"
      );


    content.className =
      "message-content";


    /*
     * Bubble.
     */

    const bubble =
      document.createElement(
        "div"
      );


    bubble.className =
      "message-bubble";


    bubble.textContent =
      message.message || "";


    /*
     * Meta.
     */

    const meta =
      document.createElement(
        "div"
      );


    meta.className =
      "message-meta";


    /*
     * Time.
     */

    const time =
      document.createElement(
        "span"
      );


    time.textContent =
      formatMessageTime(
        message.created_at
      );


    meta.appendChild(
      time
    );


    /*
     * Sent / Seen.
     */

    if (mine) {

      const status =
        document.createElement(
          "span"
        );


      if (
        message.seen === true
      ) {

        status.className =
          "message-seen";

        status.textContent =
          "✓✓ Seen";

      } else {

        status.className =
          "message-sent";

        status.textContent =
          "✓ Sent";

      }


      meta.appendChild(
        status
      );

    }


    /*
     * Build.
     */

    content.appendChild(
      bubble
    );

    content.appendChild(
      meta
    );

    row.appendChild(
      content
    );

    chat.appendChild(
      row
    );


    scrollChatToBottom();

  }



  /* =====================================================
     SEND BUTTON / ENTER
     ===================================================== */

  function setupMessageInput() {

    const sendButton =
      document.getElementById(
        "sendMessageButton"
      );


    const messageInput =
      document.getElementById(
        "messageInput"
      );


    if (sendButton) {

      sendButton.addEventListener(
        "click",
        sendMessage
      );

    }


    if (messageInput) {

      messageInput.addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter" &&
            !event.shiftKey
          ) {

            event.preventDefault();

            sendMessage();

          }

        }
      );

    }

  }



  /* =====================================================
     FORMAT TIME
     ===================================================== */

  function formatMessageTime(
    timestamp
  ) {

    if (!timestamp) {
      return "";
    }


    const date =
      new Date(timestamp);


    if (
      Number.isNaN(
        date.getTime()
      )
    ) {

      return "";

    }


    return date.toLocaleTimeString(
      [],
      {
        hour: "numeric",
        minute: "2-digit"
      }
    );

  }



  /* =====================================================
     SCROLL
     ===================================================== */

  function scrollChatToBottom() {

    const chat =
      document.getElementById(
        "chatMessages"
      );


    if (!chat) {
      return;
    }


    requestAnimationFrame(
      function() {

        chat.scrollTop =
          chat.scrollHeight;

      }
    );

  }



  /* =====================================================
     ESCAPE HTML
     ===================================================== */

  function escapeHtml(
    value
  ) {

    const div =
      document.createElement(
        "div"
      );


    div.textContent =
      String(value ?? "");


    return div.innerHTML;

  }



  /* =====================================================
     PAGE START
     ===================================================== */

  document.addEventListener(
    "DOMContentLoaded",
    function() {

      /*
       * Search.
       */

      const searchInput =
        document.getElementById(
          "messageFriendSearch"
        );


      if (searchInput) {

        searchInput.addEventListener(
          "input",
          filterMessageFriends
        );

      }


      /*
       * Send input.
       */

      setupMessageInput();


      /*
       * Load friends.
       */

      setTimeout(
        function() {

          loadMessageFriends();

        },
        500
      );

    }
  );

</script>
