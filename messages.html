aaa<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>YouRemo - Messages</title>

  <link rel="stylesheet" href="style.css">

  <style>
    /* =====================================================
       MESSAGES PAGE
       ===================================================== */

    .messages-page {
      width: min(1200px, calc(100% - 40px));
      margin: 0 auto;
      padding: 35px 0 60px;
    }

    .messages-header {
      margin-bottom: 20px;
    }

    .messages-header h1 {
      margin: 0 0 7px;
      font-size: 32px;
      color: #20242d;
    }

    .messages-header p {
      margin: 0;
      color: #737b8d;
      font-size: 14px;
    }

    /* =====================================================
       MESSAGE LAYOUT
       ===================================================== */

    .messages-layout {
      display: flex;
      width: 100%;
      height: calc(100vh - 190px);
      min-height: 520px;

      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      overflow: hidden;

      box-shadow:
        0 10px 35px rgba(30, 35, 65, 0.08);
    }

    /* =====================================================
       FRIEND LIST
       ===================================================== */

    .conversation-list {
      width: 320px;
      min-width: 320px;
      height: 100%;

      background: #fafbff;
      border-right: 1px solid #e5e7eb;

      overflow-y: auto;
    }

    .conversation-search {
      padding: 15px;

      background: #fff;
      border-bottom: 1px solid #e5e7eb;

      position: sticky;
      top: 0;
      z-index: 5;
    }

    .conversation-search input {
      width: 100%;
      height: 42px;

      padding: 0 13px;

      border: 1px solid #dfe2ea;
      border-radius: 10px;

      outline: none;

      font-size: 14px;
      color: #202124;

      box-sizing: border-box;
    }

    .conversation-search input:focus {
      border-color: #4f46e5;

      box-shadow:
        0 0 0 3px rgba(79, 70, 229, 0.08);
    }

    /* =====================================================
       CONVERSATION
       ===================================================== */

    .conversation {
      display: flex;
      align-items: center;

      gap: 12px;

      padding: 13px 15px;

      cursor: pointer;

      border-bottom: 1px solid #eeeeee;

      transition:
        background 0.2s ease;
    }

    .conversation:hover {
      background: #f0f1ff;
    }

    .conversation.selected {
      background: #eef2ff;
    }

    /* =====================================================
       AVATAR
       ===================================================== */

    .conversation-avatar {
      width: 48px !important;
      height: 48px !important;

      min-width: 48px !important;
      max-width: 48px !important;

      border-radius: 50%;

      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      background:
        linear-gradient(
          135deg,
          #667eea,
          #764ba2
        );

      color: #fff;

      font-size: 17px;
      font-weight: 700;
    }

    .conversation-avatar img {
      width: 100% !important;
      height: 100% !important;

      object-fit: cover !important;

      border-radius: 50%;

      display: block;
    }

    /* =====================================================
       FRIEND INFORMATION
       ===================================================== */

    .conversation-info {
      flex: 1;
      min-width: 0;
    }

    .conversation-info strong {
      display: block;

      font-size: 15px;

      color: #202124;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .conversation-info p {
      margin: 4px 0 0;

      font-size: 12px;

      color: #777d8a;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* =====================================================
       EMPTY FRIEND LIST
       ===================================================== */

    .empty-conversation {
      display: flex;
      align-items: center;

      gap: 12px;

      padding: 25px 18px;

      color: #737b8d;
    }

    .empty-conversation strong {
      color: #30343d;
      font-size: 14px;
    }

    .empty-conversation p {
      margin: 4px 0 0;

      font-size: 12px;
      color: #777d8a;
    }

    .conversation-icon {
      width: 45px;
      height: 45px;

      min-width: 45px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #eeeeff;

      font-size: 21px;
    }

    .loading-conversations {
      padding: 30px 20px;

      text-align: center;

      color: #777d8a;

      font-size: 14px;
    }

    /* =====================================================
       CHAT AREA
       ===================================================== */

    .chat-area {
      flex: 1;

      min-width: 0;
      min-height: 0;

      height: 100%;

      display: flex;
      flex-direction: column;

      overflow: hidden;

      background: #fff;
    }

    /* =====================================================
       CHAT HEADER
       ===================================================== */

    .chat-header {
      min-height: 72px;
      height: 72px;

      flex: 0 0 72px;

      display: flex;
      align-items: center;

      padding: 12px 20px;

      border-bottom: 1px solid #e5e7eb;

      background: #fff;

      box-sizing: border-box;
    }

    .chat-empty-title {
      color: #737b8d;

      font-size: 15px;
    }

    .chat-user {
      display: flex;
      align-items: center;

      gap: 12px;
    }

    .chat-user .conversation-avatar {
      width: 44px !important;
      height: 44px !important;

      min-width: 44px !important;
      max-width: 44px !important;
    }

    .chat-user strong {
      display: block;

      font-size: 15px;

      color: #202124;
    }

    .chat-user p {
      margin: 3px 0 0;

      font-size: 12px;

      color: #777d8a;
    }

    /* =====================================================
       CHAT MESSAGES
       ===================================================== */

    .chat-messages {
      flex: 1 1 auto;

      min-height: 0;

      padding: 20px;

      overflow-y: auto;

      background: #f8f9fc;

      scroll-behavior: smooth;
    }

    .message-row {
      display: flex;

      width: 100%;

      margin-bottom: 14px;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message-row.theirs {
      justify-content: flex-start;
    }

    .message-content {
      max-width: 65%;

      display: flex;
      flex-direction: column;
    }

    .message-row.mine .message-content {
      align-items: flex-end;
    }

    .message-row.theirs .message-content {
      align-items: flex-start;
    }

    .message-bubble {
      padding: 10px 14px;

      border-radius: 15px;

      background: #fff;

      border: 1px solid #e5e7eb;

      color: #202124;

      font-size: 14px;

      line-height: 1.45;

      word-break: break-word;

      box-shadow:
        0 2px 7px rgba(0, 0, 0, 0.04);
    }

    .message-row.mine .message-bubble {
      background: #4f46e5;

      color: #fff;

      border-color: #4f46e5;
    }

    .message-meta {
      display: flex;
      align-items: center;

      gap: 6px;

      margin-top: 5px;

      font-size: 10px;

      color: #858b98;
    }

    .message-row.mine .message-meta {
      justify-content: flex-end;
    }

    .message-sent {
      font-size: 10px;

      color: #4f46e5;

      font-weight: 600;
    }

    .message-seen {
      font-size: 10px;

      color: #4f46e5;

      font-weight: 700;
    }

    /* =====================================================
       MESSAGE INPUT
       ===================================================== */

    .message-input-area {
      flex: 0 0 auto;

      display: flex;

      gap: 10px;

      padding: 13px 16px;

      border-top: 1px solid #e5e7eb;

      background: #fff;
    }

    .message-input-area input {
      flex: 1;

      min-width: 0;

      height: 44px;

      padding: 0 14px;

      border: 1px solid #dfe2ea;

      border-radius: 10px;

      outline: none;

      font-size: 14px;

      box-sizing: border-box;
    }

    .message-input-area input:focus {
      border-color: #4f46e5;

      box-shadow:
        0 0 0 3px rgba(79, 70, 229, 0.08);
    }

    .message-input-area button {
      height: 44px;

      padding: 0 20px;

      border: none;

      border-radius: 10px;

      background: #4f46e5;

      color: #fff;

      font-weight: 700;

      cursor: pointer;

      white-space: nowrap;

      transition:
        background 0.2s ease,
        transform 0.15s ease;
    }

    .message-input-area button:hover {
      background: #4338ca;
    }

    .message-input-area button:active {
      transform: scale(0.97);
    }

    .message-input-area button:disabled {
      opacity: 0.6;

      cursor: not-allowed;
    }

    /* =====================================================
       EMPTY CHAT
       ===================================================== */

    .empty-state {
      height: 100%;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 30px;
    }

    .empty-state > div {
      font-size: 42px;

      margin-bottom: 12px;
    }

    .empty-state h2 {
      margin: 0 0 8px;

      color: #30343d;

      font-size: 19px;
    }

    .empty-state p {
      margin: 0;

      color: #777d8a;

      font-size: 13px;
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 750px) {

      .messages-page {
        width: calc(100% - 20px);

        padding: 20px 0 35px;
      }

      .messages-header h1 {
        font-size: 27px;
      }

      .messages-header p {
        font-size: 13px;
      }

      .messages-layout {
        flex-direction: column;

        height: calc(100vh - 160px);

        min-height: 560px;

        border-radius: 15px;
      }

      .conversation-list {
        width: 100%;

        min-width: 0;

        height: 230px;

        flex: 0 0 230px;

        border-right: none;

        border-bottom: 1px solid #e5e7eb;
      }

      .chat-area {
        height: auto;

        flex: 1;

        min-height: 0;
      }

      .chat-header {
        min-height: 64px;

        height: 64px;

        flex-basis: 64px;

        padding: 10px 13px;
      }

      .chat-messages {
        padding: 14px;
      }

      .message-content {
        max-width: 80%;
      }

      .message-bubble {
        font-size: 13px;

        padding: 9px 12px;
      }

      .message-input-area {
        padding: 10px;

        gap: 7px;
      }

      .message-input-area input {
        height: 42px;

        font-size: 13px;
      }

      .message-input-area button {
        height: 42px;

        padding: 0 15px;
      }
    }

    @media (max-width: 450px) {

      .messages-page {
        width: calc(100% - 12px);

        padding-top: 12px;
      }

      .messages-header {
        margin-bottom: 12px;
      }

      .messages-header h1 {
        font-size: 24px;
      }

      .messages-layout {
        height: calc(100vh - 135px);

        min-height: 500px;
      }

      .conversation-list {
        height: 190px;

        flex-basis: 190px;
      }

      .conversation {
        padding: 10px 12px;
      }

      .conversation-avatar {
        width: 42px !important;
        height: 42px !important;

        min-width: 42px !important;
        max-width: 42px !important;
      }

      .conversation-info strong {
        font-size: 14px;
      }

      .conversation-info p {
        font-size: 11px;
      }

      .message-content {
        max-width: 85%;
      }

      .message-input-area input {
        min-width: 0;
      }

      .message-input-area button {
        padding: 0 13px;
      }
    }
  </style>

</head>

<body>
