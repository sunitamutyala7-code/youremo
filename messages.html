<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>YouRemo - Messages</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f8fc;
      color: #202124;
    }

    /* ================================
       NAVIGATION
       ================================ */

    .navbar {
      width: 100%;
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
      background: rgba(255,255,255,0.96);
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      color: #4f46e5;
      text-decoration: none;
    }

    .main-nav {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .main-nav a {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border-radius: 10px;
      font-size: 20px;
      transition: 0.2s ease;
    }

    .main-nav a:hover {
      background: #f0f1ff;
    }

    .main-nav a.active {
      background: #eef2ff;
    }

    .account-button {
      min-height: 44px;
      padding: 4px 10px 4px 5px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #fff;
      cursor: pointer;
      font-weight: 700;
    }

    .nav-avatar {
      width: 34px;
      height: 34px;
      min-width: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: linear-gradient(135deg,#6366f1,#8b5cf6);
      color: white;
      font-weight: 800;
    }

    .nav-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .account-menu {
      position: absolute;
      right: 25px;
      top: 60px;
      width: 190px;
      padding: 7px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 13px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.12);
      display: none;
      z-index: 500;
    }

    .account-menu button {
      width: 100%;
      border: 0;
      background: transparent;
      padding: 11px 12px;
      text-align: left;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 600;
    }

    .account-menu button:hover {
      background: #f3f4ff;
      color: #4f46e5;
    }

    /* ================================
       PAGE
       ================================ */

    .messages-page {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
      padding: 35px 0 60px;
    }

    .messages-header {
      margin-bottom: 20px;
    }

    .messages-header h1 {
      margin: 0 0 7px;
      font-size: 32px;
    }

    .messages-header p {
      margin: 0;
      color: #737b8d;
      font-size: 14px;
    }

    /* ================================
       MESSAGE LAYOUT
       ================================ */

    .messages-layout {
      width: 100%;
      height: calc(100vh - 190px);
      min-height: 520px;
      display: flex;
      overflow: hidden;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(30,35,65,0.08);
    }

    /* ================================
       FRIEND LIST
       ================================ */

    .conversation-list {
      width: 320px;
      min-width: 320px;
      height: 100%;
      overflow-y: auto;
      background: #fafbff;
      border-right: 1px solid #e5e7eb;
    }

    .conversation-search {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 14px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    .conversation-search input {
      width: 100%;
      height: 43px;
      padding: 0 13px;
      border: 1px solid #dfe2ea;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
    }

    .conversation-search input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79,70,229,0.08);
    }

    .conversation {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 15px;
      cursor: pointer;
      border-bottom: 1px solid #eeeeee;
      transition: background 0.2s ease;
    }

    .conversation:hover {
      background: #f0f1ff;
    }

    .conversation.selected {
      background: #eef2ff;
    }

    .conversation-avatar {
      width: 48px !important;
      height: 48px !important;
      min-width: 48px !important;
      max-width: 48px !important;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg,#667eea,#764ba2);
      color: white;
      font-size: 17px;
      font-weight: 800;
    }

    .conversation-avatar img {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      display: block;
    }

    .conversation-info {
      flex: 1;
      min-width: 0;
    }

    .conversation-info strong {
      display: block;
      color: #202124;
      font-size: 15px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .conversation-info p {
      margin: 4px 0 0;
      color: #777d8a;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .loading-conversations {
      padding: 30px 20px;
      text-align: center;
      color: #777d8a;
      font-size: 14px;
    }

    .empty-conversation {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 25px 18px;
      color: #737b8d;
    }

    .conversation-icon {
      width: 45px;
      height: 45px;
      min-width: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #eeeeff;
      font-size: 20px;
    }

    .empty-conversation strong {
      color: #30343d;
      font-size: 14px;
    }

    .empty-conversation p {
      margin: 4px 0 0;
      font-size: 12px;
    }

    /* ================================
       CHAT
       ================================ */

    .chat-area {
      flex: 1;
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: white;
    }

    .chat-header {
      flex: 0 0 72px;
      min-height: 72px;
      display: flex;
      align-items: center;
      padding: 12px 20px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    .chat-empty-title {
      color: #737b8d;
      font-size: 15px;
    }

    .chat-user {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-user strong {
      display: block;
      font-size: 15px;
      color: #202124;
    }

    .chat-user p {
      margin: 3px 0 0;
      color: #777d8a;
      font-size: 12px;
    }

    /* ================================
       MESSAGES
       ================================ */

    .chat-messages {
      flex: 1 1 auto;
      min-height: 0;
      padding: 20px;
      overflow-y: auto;
      background: #f8f9fc;
      scroll-behavior: smooth;
    }

    .message-row {
      display: flex;
      width: 100%;
      margin-bottom: 14px;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message-row.theirs {
      justify-content: flex-start;
    }

    .message-content {
      max-width: 65%;
      display: flex;
      flex-direction: column;
    }

    .message-row.mine .message-content {
      align-items: flex-end;
    }

    .message-row.theirs .message-content {
      align-items: flex-start;
    }

    .message-bubble {
      padding: 10px 14px;
      border-radius: 15px;
      background: white;
      border: 1px solid #e5e7eb;
      color: #202124;
      font-size: 14px;
      line-height: 1.45;
      word-break: break-word;
      box-shadow: 0 2px 7px rgba(0,0,0,0.04);
    }

    .message-row.mine .message-bubble {
      background: #4f46e5;
      color: white;
      border-color: #4f46e5;
    }

    .message-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 5px;
      color: #858b98;
      font-size: 10px;
    }

    .message-sent {
      color: #4f46e5;
      font-weight: 600;
    }

    .message-seen {
      color: #4f46e5;
      font-weight: 700;
    }

    /* ================================
       INPUT
       ================================ */

    .message-input-area {
      flex: 0 0 auto;
      display: flex;
      gap: 10px;
      padding: 13px 16px;
      background: white;
      border-top: 1px solid #e5e7eb;
    }

    .message-input-area input {
      flex: 1;
      min-width: 0;
      height: 44px;
      padding: 0 14px;
      border: 1px solid #dfe2ea;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
    }

    .message-input-area input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79,70,229,0.08);
    }

    .message-input-area button {
      height: 44px;
      padding: 0 21px;
      border: 0;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .message-input-area button:hover {
      background: #4338ca;
    }

    .message-input-area button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ================================
       EMPTY CHAT
       ================================ */

    .empty-state {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .empty-state > div {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .empty-state h2 {
      margin: 0 0 7px;
      color: #30343d;
      font-size: 20px;
    }

    .empty-state p {
      margin: 0;
      color: #777d8a;
      font-size: 13px;
    }

    /* ================================
       MOBILE
       ================================ */

    @media (max-width: 750px) {

      .navbar {
        padding: 0 12px;
      }

      .logo {
        font-size: 21px;
      }

      .main-nav {
        gap: 1px;
      }

      .main-nav a {
        width: 36px;
        height: 36px;
        font-size: 18px;
      }

      #loginButton {
        display: none;
      }

      .account-button {
        padding-right: 5px;
      }

      .messages-page {
        width: calc(100% - 16px);
        padding: 20px 0 35px;
      }

      .messages-header h1 {
        font-size: 26px;
      }

      .messages-header p {
        font-size: 13px;
      }

      .messages-layout {
        height: calc(100vh - 155px);
        min-height: 550px;
        flex-direction: column;
        border-radius: 15px;
      }

      .conversation-list {
        width: 100%;
        min-width: 0;
        height: 220px;
        min-height: 220px;
        flex: 0 0 220px;
        border-right: 0;
        border-bottom: 1px solid #e5e7eb;
      }

      .chat-area {
        height: auto;
        flex: 1;
        min-height: 0;
      }

      .chat-header {
        flex-basis: 62px;
        min-height: 62px;
        padding: 9px 13px;
      }

      .chat-messages {
        padding: 14px 12px;
      }

      .message-content {
        max-width: 82%;
      }

      .message-bubble {
        font-size: 13px;
        padding: 9px 12px;
      }

      .message-input-area {
        padding: 9px;
        gap: 7px;
      }

      .message-input-area input {
        height: 42px;
        font-size: 13px;
      }

      .message-input-area button {
        height: 42px;
        padding: 0 15px;
      }
    }

    @media (max-width: 430px) {

      .main-nav a {
        width: 32px;
        font-size: 17px;
      }

      .conversation-list {
        height: 205px;
        min-height: 205px;
        flex-basis: 205px;
      }

      .message-content {
        max-width: 88%;
      }

      .message-input-area button {
        padding: 0 12px;
      }
    }
  </style>

</head>

  <!-- Supabase -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- YOUR EXISTING MAIN SCRIPT -->

  <script src="script.js"></script>

  <!-- ================================
       MESSAGES PAGE SCRIPT
       ================================ -->

  <script>
    /*
      =========================================================
      YOUREMO MESSAGES PAGE
      =========================================================

      IMPORTANT:
      This file DOES NOT declare:

          selectedMessageFriend
          currentUser
          messageRealtimeChannel

      Those already exist in script.js.

      This prevents the:
      "Identifier has already been declared"
      error.
    */


    let messageFriendsPage = [];
    let messageSendingPage = false;


    /* =========================================================
       GET CURRENT USER
       ========================================================= */

    async function getMessagesPageUser() {

      try {

        const result =
          await supabaseClient.auth.getUser();

        if (result.error) {

          console.error(
            "Messages user error:",
            result.error
          );

          return null;
        }

        return result.data.user || null;

      } catch (error) {

        console.error(
          "Messages user exception:",
          error
        );

        return null;
      }
    }


    /* =========================================================
       LOAD FRIENDS
       ========================================================= */

    async function loadMessagesPageFriends() {

      const container =
        document.getElementById(
          "conversationList"
        );

      if (!container) return;


      container.innerHTML = `
        <div class="loading-conversations">
          Loading friends...
        </div>
      `;


      const user =
        await getMessagesPageUser();


      if (!user) {

        container.innerHTML = `
          <div class="empty-conversation">

            <div class="conversation-icon">
              🔐
            </div>

            <div>
              <strong>Login required</strong>
              <p>Login to see your friends.</p>
            </div>

          </div>
        `;

        return;
      }


      try {

        const result =
          await supabaseClient
            .from("friendships")
            .select("*")
            .or(
              "user_id.eq." +
              user.id +
              ",friend_id.eq." +
              user.id
            );


        if (result.error) {

          console.error(
            "Friendships error:",
            result.error
          );

          container.innerHTML = `
            <div class="empty-conversation">

              <div class="conversation-icon">
                ⚠️
              </div>

              <div>
                <strong>Could not load friends</strong>
                <p>${escapeMessagesPage(
                  result.error.message
                )}</p>
              </div>

            </div>
          `;

          return;
        }


        const friendships =
          result.data || [];


        const friendIds =
          friendships
            .map(function(row) {

              if (
                String(row.user_id) ===
                String(user.id)
              ) {
                return row.friend_id;
              }

              return row.user_id;

            })
            .filter(Boolean);


        const uniqueIds =
          [...new Set(friendIds)];


        if (!uniqueIds.length) {

          messageFriendsPage = [];

          renderMessagesPageFriends();

          return;
        }


        const profileResult =
          await supabaseClient
            .from("profiles")
            .select(
              "id,full_name,username,avatar_url"
            )
            .in(
              "id",
              uniqueIds
            );


        if (profileResult.error) {

          console.error(
            "Profiles error:",
            profileResult.error
          );

          container.innerHTML = `
            <div class="empty-conversation">

              <div class="conversation-icon">
                ⚠️
              </div>

              <div>
                <strong>Could not load profiles</strong>
                <p>${escapeMessagesPage(
                  profileResult.error.message
                )}</p>
              </div>

            </div>
          `;

          return;
        }


        messageFriendsPage =
          profileResult.data || [];


        renderMessagesPageFriends();

      } catch (error) {

        console.error(
          "Load friends exception:",
          error
        );

        container.innerHTML = `
          <div class="empty-conversation">

            <div class="conversation-icon">
              ⚠️
            </div>

            <div>
              <strong>Something went wrong</strong>
              <p>Please refresh the page.</p>
            </div>

          </div>
        `;
      }
    }


    /* =========================================================
       RENDER FRIENDS
       ========================================================= */

    function renderMessagesPageFriends(
      searchText
    ) {

      const container =
        document.getElementById(
          "conversationList"
        );

      if (!container) return;


      const search =
        String(
          searchText || ""
        )
        .toLowerCase()
        .trim();


      const filtered =
        messageFriendsPage.filter(
          function(friend) {

            const name =
              String(
                friend.full_name ||
                friend.username ||
                ""
              )
              .toLowerCase();


            const username =
              String(
                friend.username ||
                ""
              )
              .toLowerCase();


            return (
              name.includes(search) ||
              username.includes(search)
            );
          }
        );


      if (!filtered.length) {

        container.innerHTML = `
          <div class="empty-conversation">

            <div class="conversation-icon">
              👥
            </div>

            <div>
              <strong>No friends found</strong>
              <p>Add friends first.</p>
            </div>

          </div>
        `;

        return;
      }


      container.innerHTML =
        filtered
          .map(function(friend) {

            const name =
              friend.full_name ||
              friend.username ||
              "Friend";


            const initial =
              name
                .charAt(0)
                .toUpperCase();


            const avatar =
              friend.avatar_url || "";


            /*
              IMPORTANT:
              Use the existing global selected friend
              from script.js through window.
            */

            const selected =
              window.selectedMessageFriend &&
              String(
                window.selectedMessageFriend.id
              ) ===
              String(friend.id)
                ? "selected"
                : "";


            return `
              <div
                class="conversation ${selected}"
                data-friend-id="${escapeMessagesPage(
                  friend.id
                )}"
              >

                <div class="conversation-avatar">

                  ${
                    avatar

                    ? `
                      <img
                        src="${escapeMessagesPage(
                          avatar
                        )}"
                        alt="${escapeMessagesPage(
                          name
                        )}"
                      >
                    `

                    : escapeMessagesPage(
                        initial
                      )
                  }

                </div>

                <div class="conversation-info">

                  <strong>
                    ${escapeMessagesPage(name)}
                  </strong>

                  <p>
                    ${
                      friend.username
                        ? "@" +
                          escapeMessagesPage(
                            friend.username
                          )
                        : "Start a conversation"
                    }
                  </p>

                </div>

              </div>
            `;

          })
          .join("");


      container
        .querySelectorAll(
          ".conversation"
        )
        .forEach(function(element) {

          element.addEventListener(
            "click",
            function() {

              const friendId =
                element.dataset.friendId;

              openMessagesPageConversation(
                friendId
              );

            }
          );

        });
    }


    /* =========================================================
       SEARCH
       ========================================================= */

    function filterMessagesPageFriends() {

      const input =
        document.getElementById(
          "messageFriendSearch"
        );

      if (!input) return;

      renderMessagesPageFriends(
        input.value
      );
    }


    /* =========================================================
       OPEN CHAT
       ========================================================= */

    async function openMessagesPageConversation(
      friendId
    ) {

      const friend =
        messageFriendsPage.find(
          function(person) {

            return (
              String(person.id) ===
              String(friendId)
            );

          }
        );


      if (!friend) return;


      /*
        DO NOT declare:

          let selectedMessageFriend

        Instead store it on window.
      */

      window.selectedMessageFriend =
        friend;


      renderMessagesPageFriends(
        document.getElementById(
          "messageFriendSearch"
        )?.value || ""
      );


      const name =
        friend.full_name ||
        friend.username ||
        "Friend";


      const avatar =
        friend.avatar_url || "";


      const header =
        document.getElementById(
          "chatHeader"
        );


      const inputArea =
        document.getElementById(
          "messageInputArea"
        );


      if (header) {

        header.innerHTML = `

          <div class="chat-user">

            <div class="conversation-avatar">

              ${
                avatar

                ? `
                  <img
                    src="${escapeMessagesPage(
                      avatar
                    )}"
                    alt="${escapeMessagesPage(
                      name
                    )}"
                  >
                `

                : escapeMessagesPage(
                    name
                      .charAt(0)
                      .toUpperCase()
                  )
              }

            </div>

            <div>

              <strong>
                ${escapeMessagesPage(name)}
              </strong>

              <p>
                ${
                  friend.username
                    ? "@" +
                      escapeMessagesPage(
                        friend.username
                      )
                    : ""
                }
              </p>

            </div>

          </div>

        `;
      }


      if (inputArea) {

        inputArea.style.display =
          "flex";
      }


      await loadMessagesPageConversation(
        friend.id
      );


      setTimeout(function() {

        const input =
          document.getElementById(
            "messageInput"
          );

        if (input) {
          input.focus();
        }

      }, 100);
    }


    /* =========================================================
       LOAD CHAT
       ========================================================= */

    async function loadMessagesPageConversation(
      friendId
    ) {

      const chat =
        document.getElementById(
          "chatMessages"
        );

      if (!chat) return;


      const user =
        await getMessagesPageUser();


      if (!user) return;


      chat.innerHTML = `
        <div class="loading-conversations">
          Loading messages...
        </div>
      `;


      try {

        const result =
          await supabaseClient
            .from("messages")
            .select(
              "id,sender_id,receiver_id,message,seen,created_at"
            )
            .or(
              "and(sender_id.eq." +
              user.id +
              ",receiver_id.eq." +
              friendId +
              "),and(sender_id.eq." +
              friendId +
              ",receiver_id.eq." +
              user.id +
              ")"
            )
            .order(
              "created_at",
              {
                ascending: true
              }
            );


        if (result.error) {

          console.error(
            "Message loading error:",
            result.error
          );

          chat.innerHTML = `
            <div class="empty-state">

              <div>⚠️</div>

              <h2>
                Unable to load messages
              </h2>

              <p>
                ${escapeMessagesPage(
                  result.error.message
                )}
              </p>

            </div>
          `;

          return;
        }


        const messages =
          result.data || [];


        if (!messages.length) {

          chat.innerHTML = `
            <div class="empty-state">

              <div>👋</div>

              <h2>
                Start chatting
              </h2>

              <p>
                Send your first message.
              </p>

            </div>
          `;

          return;
        }


        renderMessagesPageList(
          messages,
          user.id
        );

      } catch (error) {

        console.error(
          "Conversation exception:",
          error
        );

      }
    }


    /* =========================================================
       RENDER CHAT
       ========================================================= */

    function renderMessagesPageList(
      messages,
      userId
    ) {

      const chat =
        document.getElementById(
          "chatMessages"
        );

      if (!chat) return;


      chat.innerHTML =
        messages
          .map(function(message) {

            const mine =
              String(
                message.sender_id
              ) ===
              String(userId);


            const seen =
              message.seen === true;


            const time =
              message.created_at
                ? new Date(
                    message.created_at
                  ).toLocaleTimeString(
                    "en-IN",
                    {
                      hour: "numeric",
                      minute: "2-digit"
                    }
                  )
                : "";


            return `

              <div
                class="message-row ${
                  mine
                    ? "mine"
                    : "theirs"
                }"
                data-message-id="${escapeMessagesPage(
                  message.id
                )}"
              >

                <div class="message-content">

                  <div class="message-bubble">
                    ${escapeMessagesPage(
                      message.message || ""
                    )}
                  </div>

                  <div class="message-meta">

                    <span>
                      ${time}
                    </span>

                    ${
                      mine

                        ? seen

                          ? `
                            <span class="message-seen">
                              ✓✓ Seen
                            </span>
                          `

                          : `
                            <span class="message-sent">
                              ✓ Sent
                            </span>
                          `

                        : ""
                    }

                  </div>

                </div>

              </div>

            `;

          })
          .join("");


      scrollMessagesPage();
    }


    /* =========================================================
       SEND MESSAGE
       ========================================================= */

    async function sendMessagesPageMessage() {

      if (messageSendingPage) return;


      const friend =
        window.selectedMessageFriend;


      if (!friend) {

        alert(
          "Please select a friend first."
        );

        return;
      }


      const input =
        document.getElementById(
          "messageInput"
        );


      const button =
        document.getElementById(
          "sendMessageButton"
        );


      if (!input) return;


      const text =
        input.value.trim();


      if (!text) return;


      const user =
        await getMessagesPageUser();


      if (!user) {

        alert(
          "Please login first."
        );

        return;
      }


      messageSendingPage =
        true;


      input.disabled =
        true;


      if (button) {

        button.disabled =
          true;

        button.textContent =
          "Sending...";
      }


      try {

        const result =
          await supabaseClient
            .from("messages")
            .insert({
              sender_id:
                user.id,

              receiver_id:
                friend.id,

              message:
                text,

              seen:
                false
            })
            .select(
              "id,sender_id,receiver_id,message,seen,created_at"
            )
            .single();


        if (result.error) {

          console.error(
            "Send message error:",
            result.error
          );

          alert(
            result.error.message
          );

          return;
        }


        input.value = "";


        if (result.data) {

          addMessagesPageMessage(
            result.data,
            user.id
          );
        }

      } catch (error) {

        console.error(
          "Send message exception:",
          error
        );

        alert(
          "Could not send message."
        );

      } finally {

        messageSendingPage =
          false;

        input.disabled =
          false;

        if (button) {

          button.disabled =
            false;

          button.textContent =
            "Send";
        }

        input.focus();
      }
    }


    /* =========================================================
       ADD SENT MESSAGE
       ========================================================= */

    function addMessagesPageMessage(
      message,
      userId
    ) {

      const chat =
        document.getElementById(
          "chatMessages"
        );

      if (!chat) return;


      if (
        message.id &&
        chat.querySelector(
          '[data-message-id="' +
          CSS.escape(
            String(message.id)
          ) +
          '"]'
        )
      ) {
        return;
      }


      const empty =
        chat.querySelector(
          ".empty-state"
        );


      if (empty) {
        chat.innerHTML = "";
      }


      const mine =
        String(
          message.sender_id
        ) ===
        String(userId);


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "message-row " +
        (
          mine
            ? "mine"
            : "theirs"
        );


      row.dataset.messageId =
        message.id;


      const content =
        document.createElement(
          "div"
        );


      content.className =
        "message-content";


      const bubble =
        document.createElement(
          "div"
        );


      bubble.className =
        "message-bubble";


      bubble.textContent =
        message.message || "";


      const meta =
        document.createElement(
          "div"
        );


      meta.className =
        "message-meta";


      const time =
        document.createElement(
          "span"
        );


      time.textContent =
        message.created_at
          ? new Date(
              message.created_at
            ).toLocaleTimeString(
              "en-IN",
              {
                hour: "numeric",
                minute: "2-digit"
              }
            )
          : "";


      meta.appendChild(
        time
      );


      if (mine) {

        const status =
          document.createElement(
            "span"
          );


        status.className =
          "message-sent";


        status.textContent =
          "✓ Sent";


        meta.appendChild(
          status
        );
      }


      content.appendChild(
        bubble
      );

      content.appendChild(
        meta
      );

      row.appendChild(
        content
      );

      chat.appendChild(
        row
      );


      scrollMessagesPage();
    }


    /* =========================================================
       SCROLL
       ========================================================= */

    function scrollMessagesPage() {

      const chat =
        document.getElementById(
          "chatMessages"
        );

      if (!chat) return;


      requestAnimationFrame(
        function() {

          chat.scrollTop =
            chat.scrollHeight;

        }
      );
    }


    /* =========================================================
       ESCAPE
       ========================================================= */

    function escapeMessagesPage(
      value
    ) {

      const div =
        document.createElement(
          "div"
        );

      div.textContent =
        String(
          value ?? ""
        );

      return div.innerHTML;
    }


    /* =========================================================
       INITIALIZE
       ========================================================= */

    document.addEventListener(
      "DOMContentLoaded",
      async function() {

        console.log(
          "Messages page UI starting..."
        );


        const search =
          document.getElementById(
            "messageFriendSearch"
          );


        const sendButton =
          document.getElementById(
            "sendMessageButton"
          );


        const input =
          document.getElementById(
            "messageInput"
          );


        if (search) {

          search.addEventListener(
            "input",
            filterMessagesPageFriends
          );
        }


        if (sendButton) {

          sendButton.addEventListener(
            "click",
            sendMessagesPageMessage
          );
        }


        if (input) {

          input.addEventListener(
            "keydown",
            function(event) {

              if (
                event.key === "Enter"
              ) {

                event.preventDefault();

                sendMessagesPageMessage();
              }

            }
          );
        }


        /*
          Give script.js time to finish loading
          currentUser/authentication.
        */

        setTimeout(
          function() {

            loadMessagesPageFriends();

          },
          400
        );

      }
    );

  </script>
