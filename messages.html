<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YouRemo - Messages</title>

  <link rel="stylesheet" href="style.css">

  <style>
    /* =====================================================
       MESSAGES PAGE
       ===================================================== */

    .messages-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 25px 70px;
    }

    .messages-header {
      margin-bottom: 22px;
    }

    .messages-header h1 {
      margin: 0 0 7px;
      font-size: 32px;
    }

    .messages-header p {
      margin: 0;
      color: #737b8d;
    }

    /* MAIN CHAT BOX */

    .messages-layout {
      display: flex;
      width: 100%;
      height: calc(100vh - 220px);
      min-height: 500px;

      background: #ffffff;

      border: 1px solid #e5e7eb;
      border-radius: 18px;

      overflow: hidden;

      box-shadow:
        0 10px 35px rgba(30, 35, 65, 0.08);
    }

    /* =====================================================
       LEFT FRIEND LIST
       ===================================================== */

    .conversation-list {
      width: 320px;
      min-width: 320px;

      height: 100%;

      background: #fafbff;

      border-right: 1px solid #e5e7eb;

      overflow-y: auto;
    }

    .conversation-search {
      padding: 15px;

      border-bottom: 1px solid #e5e7eb;

      background: #fafbff;
    }

    .conversation-search input {
      width: 100%;
      height: 42px;

      padding: 0 13px;

      border: 1px solid #dfe2ea;
      border-radius: 10px;

      outline: none;

      font-size: 14px;

      background: #ffffff;
    }

    .conversation-search input:focus {
      border-color: #4f46e5;
    }

    .conversation {
      display: flex;
      align-items: center;

      gap: 12px;

      padding: 14px 15px;

      cursor: pointer;

      border-bottom: 1px solid #eeeeee;

      transition: background 0.2s ease;
    }

    .conversation:hover {
      background: #f0f1ff;
    }

    .conversation.selected {
      background: #eef2ff;
    }

    .conversation-avatar {
      width: 48px !important;
      height: 48px !important;

      min-width: 48px !important;
      max-width: 48px !important;

      border-radius: 50%;

      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      background:
        linear-gradient(
          135deg,
          #667eea,
          #764ba2
        );

      color: white;

      font-size: 17px;
      font-weight: 700;
    }

    .conversation-avatar img {
      width: 100% !important;
      height: 100% !important;

      object-fit: cover !important;

      border-radius: 50%;
    }

    .conversation-info {
      flex: 1;

      min-width: 0;
    }

    .conversation-info strong {
      display: block;

      color: #202124;

      font-size: 15px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .conversation-info p {
      margin: 4px 0 0;

      color: #777d8a;

      font-size: 12px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* =====================================================
       CHAT AREA
       ===================================================== */

    .chat-area {
      flex: 1;

      min-width: 0;
      min-height: 0;

      height: 100%;

      display: flex;
      flex-direction: column;

      background: #ffffff;

      overflow: hidden;
    }

    /* CHAT HEADER */

    .chat-header {
      min-height: 72px;

      flex-shrink: 0;

      display: flex;
      align-items: center;

      padding: 12px 20px;

      border-bottom: 1px solid #e5e7eb;

      background: #ffffff;
    }

    .chat-empty-title {
      color: #737b8d;

      font-size: 15px;
      font-weight: 600;
    }

    .chat-user {
      display: flex;
      align-items: center;

      gap: 12px;
    }

    .chat-user .conversation-avatar {
      width: 44px !important;
      height: 44px !important;

      min-width: 44px !important;
      max-width: 44px !important;
    }

    .chat-user strong {
      display: block;

      font-size: 15px;
    }

    .chat-user p {
      margin: 3px 0 0;

      color: #777d8a;

      font-size: 12px;
    }

    /* =====================================================
       MESSAGE AREA
       ===================================================== */

    .chat-messages {
      flex: 1 1 auto;

      min-height: 0;

      padding: 20px;

      overflow-y: auto;

      background: #f8f9fc;

      scroll-behavior: smooth;
    }

    .message-row {
      display: flex;

      margin-bottom: 13px;

      width: 100%;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message-row.theirs {
      justify-content: flex-start;
    }

    .message-content {
      max-width: 65%;
    }

    .message-bubble {
      padding: 10px 14px;

      border-radius: 15px;

      background: #ffffff;

      border: 1px solid #e5e7eb;

      color: #202124;

      font-size: 14px;

      line-height: 1.45;

      word-break: break-word;

      box-shadow:
        0 2px 7px rgba(0, 0, 0, 0.04);
    }

    .message-row.mine .message-bubble {
      background: #4f46e5;

      color: #ffffff;

      border-color: #4f46e5;
    }

    /* TIME */

    .message-time {
      margin-top: 5px;

      font-size: 11px;

      color: #777d8a;

      opacity: 0.75;

      text-align: right;

      line-height: 1;
    }

    .message-row.mine .message-time {
      color: #777d8a;
    }

    /* SEEN */

    .message-seen {
      margin-top: 4px;

      font-size: 10px;

      color: #4f46e5;

      text-align: right;

      font-weight: 600;
    }

    /* =====================================================
       INPUT
       ===================================================== */

    .message-input-area {
      flex: 0 0 auto;

      display: none;

      gap: 10px;

      padding: 14px 16px;

      border-top: 1px solid #e5e7eb;

      background: #ffffff;
    }

    .message-input-area input {
      flex: 1;

      min-width: 0;

      height: 44px;

      padding: 0 14px;

      border: 1px solid #dfe2ea;

      border-radius: 10px;

      outline: none;

      font-size: 14px;
    }

    .message-input-area input:focus {
      border-color: #4f46e5;

      box-shadow:
        0 0 0 3px rgba(79, 70, 229, 0.08);
    }

    .message-input-area button {
      height: 44px;

      padding: 0 20px;

      border: none;

      border-radius: 10px;

      background: #4f46e5;

      color: #ffffff;

      font-weight: 700;

      cursor: pointer;
    }

    .message-input-area button:hover {
      background: #4338ca;
    }

    .message-input-area button:disabled {
      opacity: 0.6;

      cursor: default;
    }

    /* =====================================================
       EMPTY / LOADING
       ===================================================== */

    .loading-conversations {
      padding: 30px 20px;

      text-align: center;

      color: #777d8a;

      font-size: 14px;
    }

    .empty-conversation {
      display: flex;
      align-items: center;

      gap: 12px;

      padding: 25px 18px;

      color: #737b8d;
    }

    .conversation-icon {
      width: 45px;
      height: 45px;

      min-width: 45px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #eeeeff;

      font-size: 21px;
    }

    .chat-messages .empty-state {
      height: 100%;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .chat-messages .empty-state > div {
      font-size: 42px;

      margin-bottom: 12px;
    }

    .chat-messages .empty-state h2 {
      margin-bottom: 7px;
    }

    .chat-messages .empty-state p {
      color: #737b8d;
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 750px) {

      .messages-page {
        padding: 30px 15px 50px;
      }

      .messages-layout {
        display: flex;

        flex-direction: column;

        height: auto;

        min-height: 0;
      }

      .conversation-list {
        width: 100%;
        min-width: 0;

        height: 280px;

        border-right: none;

        border-bottom: 1px solid #e5e7eb;
      }

      .chat-area {
        height: 550px;

        min-height: 550px;
      }

      .message-content {
        max-width: 80%;
      }
    }
  </style>
</head>


<body>

  <!-- =====================================================
       NAVBAR
       ===================================================== -->

  <header class="navbar">

    <div class="logo">
      YouRemo
    </div>

    <nav class="main-nav">

      <a href="index.html" title="Home">🏠</a>

      <a href="friends.html" title="Find Friends">🔎</a>

      <a href="requests.html" title="Requests">🤝</a>

      <a href="myfriends.html" title="My Friends">👥</a>

      <a
        href="messages.html"
        class="active"
        title="Messages">
        💬
      </a>

      <a href="profile.html" title="Profile">👤</a>

    </nav>


    <div
      id="accountButton"
      class="account-button"
      onclick="handleAccountClick()">

      <div
        id="navAvatar"
        class="nav-avatar">

        ?

      </div>

      <span id="loginButton">
        Login
      </span>

    </div>


    <div
      id="accountMenu"
      class="account-menu">

      <button onclick="goToMyProfile()">
        My Profile
      </button>

      <button onclick="openEditProfile()">
        Edit Profile
      </button>

      <button onclick="logout()">
        Logout
      </button>

    </div>

  </header>


  <!-- =====================================================
       MAIN
       ===================================================== -->

  <main class="messages-page">

    <div class="messages-header">

      <h1>
        💬 Messages
      </h1>

      <p>
        Chat with your friends and connections.
      </p>

    </div>


    <div class="messages-layout">


      <!-- =================================================
           FRIENDS
           ================================================= -->

      <aside class="conversation-list">

        <div class="conversation-search">

          <input
            type="text"
            id="messageFriendSearch"
            placeholder="Search friends..."
            oninput="filterMessageFriends()">

        </div>


        <div id="conversationList">

          <div class="loading-conversations">
            Loading friends...
          </div>

        </div>

      </aside>


      <!-- =================================================
           CHAT
           ================================================= -->

      <section class="chat-area">


        <!-- CHAT HEADER -->

        <div
          id="chatHeader"
          class="chat-header">

          <div class="chat-empty-title">
            💬 Select a friend
          </div>

        </div>


        <!-- CHAT MESSAGES -->

        <div
          id="chatMessages"
          class="chat-messages">

          <div class="empty-state">

            <div>
              💬
            </div>

            <h2>
              Your Messages
            </h2>

            <p>
              Select a friend to start chatting.
            </p>

          </div>

        </div>


        <!-- INPUT -->

        <div
          id="messageInputArea"
          class="message-input-area">

          <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."
            autocomplete="off"
            onkeydown="handleMessageKey(event)">

          <button
            id="sendMessageButton"
            type="button"
            onclick="sendMessage()">

            Send

          </button>

        </div>

      </section>

    </div>

  </main>


  <!-- =====================================================
       SUPABASE
       ===================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <!-- =====================================================
       YOUR MAIN SCRIPT
       ===================================================== -->

  <script src="script.js"></script>


  <!-- =====================================================
       MESSAGE SYSTEM
       ===================================================== -->

  <script>

    /* =====================================================
       VARIABLES
       ===================================================== */

    let messageFriends = [];

    let selectedMessageFriend = null;

    let messageRealtimeChannel = null;

    let currentMessageUser = null;


    /* =====================================================
       START
       ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      async function () {

        console.log(
          "Messages page started."
        );

        await initializeMessages();

      }
    );


    /* =====================================================
       INITIALIZE
       ===================================================== */

    async function initializeMessages() {

      try {

        const {
          data: {
            user
          }
        } =
          await supabaseClient.auth.getUser();


        if (!user) {

          console.log(
            "No logged-in user."
          );

          showLoginRequired();

          return;

        }


        currentMessageUser = user;


        console.log(
          "Message user:",
          user.id
        );


        await loadMessageFriends();


        /*
         * Start Realtime only once.
         */

        startMessageRealtime();


      } catch (error) {

        console.error(
          "Message initialization error:",
          error
        );

      }

    }


    /* =====================================================
       LOGIN REQUIRED
       ===================================================== */

    function showLoginRequired() {

      const container =
        document.getElementById(
          "conversationList"
        );

      if (!container) return;


      container.innerHTML = `

        <div class="empty-conversation">

          <div class="conversation-icon">
            🔐
          </div>

          <div>

            <strong>
              Login required
            </strong>

            <p>
              Login to see your friends.
            </p>

          </div>

        </div>

      `;

    }


    /* =====================================================
       LOAD FRIENDS
       ===================================================== */

    async function loadMessageFriends() {

      const container =
        document.getElementById(
          "conversationList"
        );

      if (!container) return;


      try {

        const user =
          currentMessageUser;


        if (!user) return;


        container.innerHTML = `

          <div class="loading-conversations">
            Loading friends...
          </div>

        `;


        const {
          data,
          error
        } =
          await supabaseClient
            .from("friendships")
            .select("*")
            .or(
              `user_id.eq.${user.id},friend_id.eq.${user.id}`
            );


        if (error) {

          console.error(
            "Friendship error:",
            error
          );

          container.innerHTML = `

            <div class="empty-conversation">

              <div class="conversation-icon">
                ⚠️
              </div>

              <div>

                <strong>
                  Could not load friends
                </strong>

                <p>
                  ${escapeMessage(error.message)}
                </p>

              </div>

            </div>

          `;

          return;

        }


        if (!data || data.length === 0) {

          container.innerHTML = `

            <div class="empty-conversation">

              <div class="conversation-icon">
                👥
              </div>

              <div>

                <strong>
                  No friends yet
                </strong>

                <p>
                  Add a friend to start chatting.
                </p>

              </div>

            </div>

          `;

          return;

        }


        const friendIds =
          data.map(
            friendship => {

              return friendship.user_id === user.id
                ? friendship.friend_id
                : friendship.user_id;

            }
          );


        const uniqueFriendIds =
          [
            ...new Set(friendIds)
          ];


        const {
          data: profiles,
          error: profileError
        } =
          await supabaseClient
            .from("profiles")
            .select("*")
            .in(
              "id",
              uniqueFriendIds
            );


        if (profileError) {

          console.error(
            "Profile error:",
            profileError
          );

          return;

        }


        messageFriends =
          profiles || [];


        console.log(
          "Friends loaded:",
          messageFriends
        );


        renderMessageFriends();

      } catch (error) {

        console.error(
          "Load friends error:",
          error
        );

      }

    }


    /* =====================================================
       RENDER FRIENDS
       ===================================================== */

    function renderMessageFriends(
      searchText = ""
    ) {

      const container =
        document.getElementById(
          "conversationList"
        );


      if (!container) return;


      const search =
        searchText
          .toLowerCase()
          .trim();


      const filtered =
        messageFriends.filter(
          friend => {

            const name =
              (
                friend.full_name ||
                friend.name ||
                friend.username ||
                ""
              ).toLowerCase();


            const username =
              (
                friend.username ||
                ""
              ).toLowerCase();


            return (
              name.includes(search) ||
              username.includes(search)
            );

          }
        );


      if (filtered.length === 0) {

        container.innerHTML = `

          <div class="empty-conversation">

            <div class="conversation-icon">
              🔎
            </div>

            <div>

              <strong>
                No friends found
              </strong>

              <p>
                Try another search.
              </p>

            </div>

          </div>

        `;

        return;

      }


      container.innerHTML =
        filtered.map(
          friend => {

            const name =
              friend.full_name ||
              friend.name ||
              friend.username ||
              "Friend";


            const initial =
              name
                .charAt(0)
                .toUpperCase();


            const avatar =
              friend.avatar_url ||
              friend.profile_photo ||
              friend.photo_url ||
              "";


            const selected =
              selectedMessageFriend &&
              selectedMessageFriend.id === friend.id
                ? "selected"
                : "";


            return `

              <div
                class="conversation ${selected}"
                onclick="openConversation('${friend.id}')">

                <div class="conversation-avatar">

                  ${
                    avatar

                    ?

                    `<img
                      src="${escapeAttribute(avatar)}"
                      alt="${escapeAttribute(name)}">`

                    :

                    initial

                  }

                </div>


                <div class="conversation-info">

                  <strong>
                    ${escapeMessage(name)}
                  </strong>

                  <p>

                    ${
                      friend.username
                        ? "@" +
                          escapeMessage(
                            friend.username
                          )
                        : "Start a conversation"
                    }

                  </p>

                </div>

              </div>

            `;

          }
        ).join("");

    }


    /* =====================================================
       SEARCH
       ===================================================== */

    function filterMessageFriends() {

      const input =
        document.getElementById(
          "messageFriendSearch"
        );


      if (!input) return;


      renderMessageFriends(
        input.value
      );

    }


    /* =====================================================
       OPEN CONVERSATION
       ===================================================== */

    async function openConversation(
      friendId
    ) {

      const friend =
        messageFriends.find(
          person =>
            person.id === friendId
        );


      if (!friend) return;


      selectedMessageFriend =
        friend;


      renderMessageFriends(
        document.getElementById(
          "messageFriendSearch"
        )?.value || ""
      );


      const name =
        friend.full_name ||
        friend.name ||
        friend.username ||
        "Friend";


      const avatar =
        friend.avatar_url ||
        friend.profile_photo ||
        friend.photo_url ||
        "";


      const header =
        document.getElementById(
          "chatHeader"
        );


      const inputArea =
        document.getElementById(
          "messageInputArea"
        );


      if (header) {

        header.innerHTML = `

          <div class="chat-user">

            <div class="conversation-avatar">

              ${
                avatar

                ?

                `<img
                  src="${escapeAttribute(avatar)}"
                  alt="${escapeAttribute(name)}">`

                :

                escapeMessage(
                  name
                    .charAt(0)
                    .toUpperCase()
                )

              }

            </div>


            <div>

              <strong>
                ${escapeMessage(name)}
              </strong>

              <p>

                ${
                  friend.username
                    ? "@" +
                      escapeMessage(
                        friend.username
                      )
                    : ""
                }

              </p>

            </div>

          </div>

        `;

      }


      if (inputArea) {

        inputArea.style.display =
          "flex";

      }


      await loadConversation(
        friendId
      );


      setTimeout(
        function () {

          const input =
            document.getElementById(
              "messageInput"
            );


          if (input) {

            input.focus();

          }

        },
        100
      );

    }


    /* =====================================================
       LOAD CONVERSATION
       ===================================================== */

    async function loadConversation(
      friendId
    ) {

      const chat =
        document.getElementById(
          "chatMessages"
        );


      if (!chat) return;


      const user =
        currentMessageUser;


      if (!user) return;


      chat.innerHTML = `

        <div class="loading-conversations">
          Loading messages...
        </div>

      `;


      const {
        data,
        error
      } =
        await supabaseClient
          .from("messages")
          .select("*")
          .or(
            `and(sender_id.eq.${user.id},receiver_id.eq.${friendId}),and(sender_id.eq.${friendId},receiver_id.eq.${user.id})`
          )
          .order(
            "created_at",
            {
              ascending: true
            }
          );


      if (error) {

        console.error(
          "Message loading error:",
          error
        );


        chat.innerHTML = `

          <div class="empty-state">

            <div>
              ⚠️
            </div>

            <h2>
              Unable to load messages
            </h2>

            <p>
              ${escapeMessage(error.message)}
            </p>

          </div>

        `;

        return;

      }


      console.log(
        "Messages successfully loaded:",
        data
      );


      if (!data || data.length === 0) {

        chat.innerHTML = `

          <div class="empty-state">

            <div>
              👋
            </div>

            <h2>
              Start chatting
            </h2>

            <p>
              Send your first message to this friend.
            </p>

          </div>

        `;

        return;

      }


      renderMessages(
        data,
        user.id
      );

    }


    /* =====================================================
       RENDER MESSAGES
       ===================================================== */

    function renderMessages(
      messages,
      userId
    ) {

      const chat =
        document.getElementById(
          "chatMessages"
        );


      if (!chat) return;


      chat.innerHTML =
        messages.map(
          message => {

            const mine =
              message.sender_id === userId;


            const time =
              formatMessageTime(
                message.created_at
              );


            let seenHTML = "";


            /*
             * Show Seen only for our messages
             * when the database has a seen/read field.
             */

            if (
              mine &&
              (
                message.seen === true ||
                message.is_seen === true ||
                message.read === true
              )
            ) {

              seenHTML = `

                <div class="message-seen">
                  ✓✓ Seen
                </div>

              `;

            }


            return `

              <div
                class="message-row ${
                  mine
                    ? "mine"
                    : "theirs"
                }">

                <div class="message-content">

                  <div class="message-bubble">

                    ${escapeMessage(
                      message.message
                    )}

                  </div>


                  <div class="message-time">

                    ${time}

                  </div>


                  ${seenHTML}

                </div>

              </div>

            `;

          }
        ).join("");


      scrollChatToBottom();

    }


    /* =====================================================
       SEND MESSAGE
       ===================================================== */

    async function sendMessage() {

      if (!selectedMessageFriend) {

        return;

      }


      const input =
        document.getElementById(
          "messageInput"
        );


      const button =
        document.getElementById(
          "sendMessageButton"
        );


      if (!input) return;


      const text =
        input.value.trim();


      if (!text) return;


      const user =
        currentMessageUser;


      if (!user) {

        alert(
          "Please login first."
        );

        return;

      }


      /*
       * Disable input while sending.
       */

      input.disabled = true;


      if (button) {

        button.disabled = true;

        button.textContent =
          "Sending...";

      }


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("messages")
            .insert({

              sender_id:
                user.id,

              receiver_id:
                selectedMessageFriend.id,

              message:
                text

            })
            .select()
            .single();


        if (error) {

          console.error(
            "Send message error:",
            error
          );


          alert(
            error.message
          );


          return;

        }


        console.log(
          "Message sent successfully:",
          data
        );


        /*
         * Clear input immediately.
         */

        input.value = "";


        /*
         * IMPORTANT:
         *
         * We load the conversation here.
         *
         * Realtime will ALSO receive the INSERT,
         * but our Realtime code below ignores
         * messages sent by the current user.
         *
         * This prevents duplicate messages.
         */

        await loadConversation(
          selectedMessageFriend.id
        );


      } catch (error) {

        console.error(
          "Send error:",
          error
        );

      } finally {

        input.disabled = false;


        if (button) {

          button.disabled = false;

          button.textContent =
            "Send";

        }


        input.focus();

      }

    }


    /* =====================================================
       ENTER KEY
       ===================================================== */

    function handleMessageKey(
      event
    ) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }


    /* =====================================================
       REALTIME
       ===================================================== */

    function startMessageRealtime() {

      /*
       * VERY IMPORTANT:
       *
       * Do not create the channel more than once.
       */

      if (messageRealtimeChannel) {

        console.log(
          "Message realtime already running."
        );

        return;

      }


      if (!currentMessageUser) {

        return;

      }


      console.log(
        "Starting message realtime..."
      );


      messageRealtimeChannel =
        supabaseClient
          .channel(
            "youremo-messages-realtime"
          )
          .on(
            "postgres_changes",
            {
              event: "INSERT",
              schema: "public",
              table: "messages"
            },
            async function (payload) {

              console.log(
                "🔥 REALTIME MESSAGE RECEIVED:",
                payload.new
              );


              const newMessage =
                payload.new;


              /*
               * Ignore unrelated messages.
               */

              const isForCurrentUser =
                newMessage.receiver_id ===
                currentMessageUser.id;


              const isFromCurrentUser =
                newMessage.sender_id ===
                currentMessageUser.id;


              if (
                !isForCurrentUser &&
                !isFromCurrentUser
              ) {

                return;

              }


              /*
               * IMPORTANT DUPLICATE FIX
               *
               * If WE sent this message,
               * sendMessage() already reloads
               * the conversation.
               *
               * Therefore Realtime must NOT
               * reload it again.
               */

              if (isFromCurrentUser) {

                console.log(
                  "Own message received through realtime - ignored to prevent duplicate."
                );

                return;

              }


              /*
               * Incoming message.
               *
               * If the conversation is currently open,
               * reload it immediately.
               */

              if (
                selectedMessageFriend &&
                newMessage.sender_id ===
                  selectedMessageFriend.id &&
                newMessage.receiver_id ===
                  currentMessageUser.id
              ) {

                console.log(
                  "Incoming message for current chat."
                );


                await loadConversation(
                  selectedMessageFriend.id
                );

              }

            }
          )
          .subscribe(
            function (status) {

              console.log(
                "Realtime status:",
                status
              );

            }
          );

    }


    /* =====================================================
       TIME FORMAT
       ===================================================== */

    function formatMessageTime(
      timestamp
    ) {

      if (!timestamp) {

        return "";

      }


      const date =
        new Date(timestamp);


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return "";

      }


      return date.toLocaleTimeString(
        [],
        {
          hour: "numeric",
          minute: "2-digit"
        }
      );

    }


    /* =====================================================
       SCROLL
       ===================================================== */

    function scrollChatToBottom() {

      const chat =
        document.getElementById(
          "chatMessages"
        );


      if (!chat) return;


      requestAnimationFrame(
        function () {

          chat.scrollTop =
            chat.scrollHeight;

        }
      );

    }


    /* =====================================================
       ESCAPE HTML
       ===================================================== */

    function escapeMessage(
      text
    ) {

      const div =
        document.createElement(
          "div"
        );


      div.textContent =
        text || "";


      return div.innerHTML;

    }


    /* =====================================================
       ESCAPE ATTRIBUTE
       ===================================================== */

    function escapeAttribute(
      text
    ) {

      return String(
        text || ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        );

    }

  </script>
