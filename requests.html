```html
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YouRemo - Friend Requests</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =====================================================
       NAVBAR
       ===================================================== -->

  <header class="navbar">

    <div class="logo">
      YouRemo
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="friends.html">Friends</a>
      <a href="requests.html" class="active">Requests</a>
      <a href="profile.html">Profile</a>
      <a href="myfriends.html">My Friends</a>
      <a href="about.html">About</a>
    </nav>

    <div
      id="accountButton"
      class="account-button"
      onclick="handleAccountClick()">

      <div
        id="navAvatar"
        class="nav-avatar">
        ?
      </div>

      <span id="loginButton">
        Login
      </span>

    </div>

    <div
      id="accountMenu"
      class="account-menu">

      <button onclick="goToMyProfile()">
        My Profile
      </button>

      <button onclick="openEditProfile()">
        Edit Profile
      </button>

      <button onclick="logout()">
        Logout
      </button>

    </div>

  </header>


  <!-- =====================================================
       MAIN
       ===================================================== -->

  <main>

    <section class="requests-page">

      <div class="page-header">

        <div>

          <h1>
            Friend Requests
          </h1>

          <p>
            See who wants to connect with you.
          </p>

        </div>

        <div
          id="requestBadge"
          class="request-badge">

          0

        </div>

      </div>


      <!-- REQUESTS -->

      <div
        id="friendRequests"
        class="friend-results">

        <div class="empty-state">

          <div>
            🔄
          </div>

          <h2>
            Loading requests...
          </h2>

          <p>
            Please wait.
          </p>

        </div>

      </div>

    </section>

  </main>


  <!-- =====================================================
       FOOTER
       ===================================================== -->

  <footer>

    <p>
      © 2026 YouRemo. All rights reserved.
    </p>

  </footer>


  <!-- =====================================================
       SUPABASE
       ===================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- =====================================================
       YOUREMO JAVASCRIPT
       ===================================================== -->

  <script src="script.js"></script>

</body>

</html>
