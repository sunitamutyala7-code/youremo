<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YouRemo - Friend Requests</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       NAVBAR
       ========================= -->

  <header class="navbar">

    <div class="logo">
      YouRemo
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="friends.html">Friends</a>
      <a href="requests.html">Requests</a>
      <a href="profile.html">Profile</a>
      <a href="myfriends.html">My Friends</a>
      <a href="about.html">About</a>
    </nav>

    <div
      id="accountButton"
      class="account-button"
      onclick="handleAccountClick()">

      <div id="navAvatar" class="nav-avatar">
        ?
      </div>

      <span id="loginButton">
        Login
      </span>

    </div>

    <div
      id="accountMenu"
      class="account-menu">

      <button onclick="goToMyProfile()">
        My Profile
      </button>

      <button onclick="openEditProfile()">
        Edit Profile
      </button>

      <button onclick="logout()">
        Logout
      </button>

    </div>

  </header>


  <!-- =========================
       REQUESTS PAGE
       ========================= -->

  <main>

    <section class="requests-section requests-page">

      <div class="requests-heading">

        <div>

          <h1>
            Friend Requests
          </h1>

          <p class="section-text">
            See who wants to connect with you.
          </p>

        </div>


        <div class="request-count-box">

          <span>
            🤝
          </span>

          <strong id="requestBadge">
            0
          </strong>

          <small>
            Pending
          </small>

        </div>

      </div>


      <!-- REQUEST LIST -->

      <div
        id="friendRequests"
        class="friend-results">

        <div class="empty-state">

          <div>
            ⏳
          </div>

          <p>
            Loading requests...
          </p>

        </div>

      </div>


      <!-- FIND FRIENDS -->

      <div class="requests-action">

        <button
          class="primary-btn"
          type="button"
          onclick="window.location.href='friends.html'">

          Find Friends

        </button>

      </div>

    </section>

  </main>


  <!-- =========================
       SUPABASE
       ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- =========================
       YOUREMO JAVASCRIPT
       ========================= -->

  <script src="script.js"></script>

</body>

</html>
