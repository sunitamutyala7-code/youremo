<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YouRemo - Notifications</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top left,
          rgba(99, 102, 241, 0.08),
          transparent 32%),
        #f7f8fc;
      color: #20242d;
    }

    /* =========================
       NAVIGATION
       ========================= */

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      min-height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 25px;

      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(14px);

      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.6px;

      background: linear-gradient(
        135deg,
        #4f46e5,
        #7c3aed
      );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .main-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .main-nav a {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 11px;

      text-decoration: none;
      font-size: 19px;

      transition: 0.2s ease;
    }

    .main-nav a:hover {
      background: #f0f1ff;
      transform: translateY(-1px);
    }

    .main-nav a.active {
      background: #eef2ff;
      box-shadow: inset 0 0 0 1px #e0e3ff;
    }

    /* =========================
       ACCOUNT
       ========================= */

    .account-area {
      position: relative;
    }

    .account-button {
      min-height: 44px;

      display: flex;
      align-items: center;
      gap: 8px;

      padding: 5px 10px 5px 6px;

      border: 1px solid #e1e4eb;
      border-radius: 12px;

      background: #fff;
      cursor: pointer;

      font-weight: 700;
    }

    .account-button:hover {
      border-color: #c9cbf7;
      box-shadow: 0 5px 18px rgba(30, 35, 70, 0.08);
    }

    .nav-avatar {
      width: 34px;
      height: 34px;
      min-width: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
      border-radius: 50%;

      background: linear-gradient(
        135deg,
        #6366f1,
        #8b5cf6
      );

      color: #fff;
      font-weight: 800;
    }

    .nav-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .account-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);

      width: 190px;

      padding: 7px;

      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;

      box-shadow: 0 15px 40px rgba(20, 25, 45, 0.14);

      display: none;
      z-index: 500;
    }

    .account-menu button {
      width: 100%;

      padding: 11px 12px;

      border: 0;
      border-radius: 9px;

      background: transparent;

      text-align: left;

      cursor: pointer;

      color: #353942;
      font-weight: 600;
    }

    .account-menu button:hover {
      background: #f3f4ff;
      color: #4f46e5;
    }

    /* =========================
       PAGE
       ========================= */

    .notifications-page {
      width: min(900px, calc(100% - 30px));

      margin: 0 auto;

      padding: 40px 0 70px;
    }

    .notifications-hero {
      position: relative;
      overflow: hidden;

      padding: 38px 40px;

      margin-bottom: 22px;

      border-radius: 22px;

      background: linear-gradient(
        135deg,
        #4f46e5,
        #6366f1 50%,
        #7c3aed
      );

      color: #fff;

      box-shadow:
        0 18px 45px rgba(79, 70, 229, 0.18);
    }

    .notifications-hero::before {
      content: "";

      position: absolute;

      width: 240px;
      height: 240px;

      right: -70px;
      top: -100px;

      border-radius: 50%;

      background: rgba(255, 255, 255, 0.08);
    }

    .notifications-hero-content {
      position: relative;
      z-index: 2;
    }

    .notifications-hero h1 {
      margin: 0 0 8px;

      font-size: 36px;
      letter-spacing: -1px;
    }

    .notifications-hero p {
      margin: 0;

      color: rgba(255, 255, 255, 0.88);

      line-height: 1.6;
    }

    /* =========================
       NOTIFICATION CARD
       ========================= */

    .notifications-container {
      background: rgba(255, 255, 255, 0.96);

      border: 1px solid #e5e7eb;
      border-radius: 20px;

      overflow: hidden;

      box-shadow:
        0 10px 35px rgba(30, 35, 65, 0.06);
    }

    .notifications-toolbar {
      min-height: 65px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;

      padding: 13px 18px;

      border-bottom: 1px solid #e5e7eb;
    }

    .notification-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .notification-title strong {
      font-size: 16px;
    }

    .unread-count {
      min-width: 27px;
      height: 27px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 0 8px;

      border-radius: 999px;

      background: #eef2ff;
      color: #4f46e5;

      font-size: 12px;
      font-weight: 800;
    }

    .mark-all-btn {
      height: 37px;

      padding: 0 13px;

      border: 1px solid #dfe2ea;
      border-radius: 9px;

      background: #fff;

      color: #4f46e5;

      font-size: 12px;
      font-weight: 700;

      cursor: pointer;
    }

    .mark-all-btn:hover {
      background: #f3f4ff;
      border-color: #c8caf4;
    }

    /* =========================
       LIST
       ========================= */

    #notificationsList {
      width: 100%;
    }

    .notification-item {
      position: relative;

      display: flex;
      align-items: center;

      gap: 14px;

      padding: 17px 19px;

      border-bottom: 1px solid #edf0f4;

      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .notification-item:last-child {
      border-bottom: 0;
    }

    .notification-item:hover {
      background: #fafaff;
    }

    .notification-item.unread {
      background: #f7f7ff;
    }

    .notification-item.unread::before {
      content: "";

      position: absolute;

      left: 0;
      top: 12px;
      bottom: 12px;

      width: 3px;

      border-radius: 0 4px 4px 0;

      background: #4f46e5;
    }

    .notification-icon {
      width: 48px;
      height: 48px;
      min-width: 48px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 14px;

      background: #eef2ff;

      font-size: 21px;
    }

    .notification-content {
      flex: 1;
      min-width: 0;
    }

    .notification-message {
      margin: 0;

      color: #30343d;

      font-size: 14px;
      line-height: 1.5;
    }

    .notification-message strong {
      color: #171a21;
    }

    .notification-time {
      margin-top: 5px;

      color: #8a909d;

      font-size: 11px;
    }

    .notification-dot {
      width: 9px;
      height: 9px;
      min-width: 9px;

      border-radius: 50%;

      background: #4f46e5;
    }

    .notification-action {
      min-width: 80px;
      height: 34px;

      padding: 0 10px;

      border: 0;
      border-radius: 8px;

      background: #eef2ff;

      color: #4f46e5;

      font-size: 11px;
      font-weight: 700;

      cursor: pointer;
    }

    .notification-action:hover {
      background: #e0e7ff;
    }

    /* =========================
       EMPTY
       ========================= */

    .notifications-empty {
      min-height: 300px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      padding: 40px 20px;

      text-align: center;
    }

    .notifications-empty-icon {
      width: 64px;
      height: 64px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 15px;

      border-radius: 18px;

      background: #eef2ff;

      font-size: 29px;
    }

    .notifications-empty h2 {
      margin: 0 0 7px;

      font-size: 18px;
    }

    .notifications-empty p {
      max-width: 400px;

      margin: 0;

      color: #858b98;

      font-size: 13px;
      line-height: 1.6;
    }

    .notifications-loading {
      min-height: 250px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #777d8a;

      font-size: 14px;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 750px) {

      .navbar {
        min-height: 62px;
        padding: 0 12px;
      }

      .logo {
        font-size: 21px;
      }

      .main-nav {
        gap: 2px;
      }

      .main-nav a {
        width: 36px;
        height: 36px;
        font-size: 17px;
      }

      #loginButton {
        display: none;
      }

      .account-button {
        padding-right: 5px;
      }

      .notifications-page {
        width: calc(100% - 20px);

        padding: 20px 0 45px;
      }

      .notifications-hero {
        padding: 28px 23px;

        border-radius: 18px;
      }

      .notifications-hero h1 {
        font-size: 30px;
      }

      .notifications-hero p {
        font-size: 13px;
      }

      .notifications-container {
        border-radius: 17px;
      }

      .notifications-toolbar {
        padding: 12px;
      }

      .notification-item {
        align-items: flex-start;

        padding: 15px 13px;

        gap: 11px;
      }

      .notification-icon {
        width: 43px;
        height: 43px;
        min-width: 43px;

        border-radius: 12px;

        font-size: 18px;
      }

      .notification-message {
        font-size: 13px;
      }

      .notification-action {
        min-width: 64px;
        padding: 0 7px;
        font-size: 10px;
      }

      .mark-all-btn {
        font-size: 11px;
        padding: 0 9px;
      }
    }

    @media (max-width: 500px) {

      .notification-action {
        display: none;
      }

      .notification-dot {
        margin-top: 5px;
      }

      .notification-title strong {
        font-size: 14px;
      }
    }
  </style>

</head>

  <script src="script.js"></script>

  <!-- =========================
       NOTIFICATION SYSTEM
       ========================= -->

  <script>

    /*
      IMPORTANT:
      All variables use the "youRemoNotifications"
      prefix so they do not conflict with script.js
      or messages.html.
    */

    let youRemoNotificationsData = [];
    let youRemoNotificationsUser = null;


    /* =========================
       GET USER
       ========================= */

    async function youRemoGetNotificationUser() {

      try {

        const result =
          await supabaseClient.auth.getUser();

        if (result.error) {

          console.error(
            "Notification user error:",
            result.error
          );

          return null;
        }

        return result.data.user || null;

      } catch (error) {

        console.error(
          "Notification user exception:",
          error
        );

        return null;
      }
    }


    /* =========================
       ESCAPE HTML
       ========================= */

    function youRemoEscapeNotificationHtml(value) {

      const div =
        document.createElement("div");

      div.textContent =
        String(value ?? "");

      return div.innerHTML;
    }


    /* =========================
       TIME
       ========================= */

    function youRemoNotificationTime(timestamp) {

      if (!timestamp) return "";

      const date =
        new Date(timestamp);

      if (
        Number.isNaN(date.getTime())
      ) {
        return "";
      }

      const now =
        new Date();

      const difference =
        now.getTime() -
        date.getTime();

      const minutes =
        Math.floor(
          difference / 60000
        );

      if (minutes < 1) {
        return "Just now";
      }

      if (minutes < 60) {
        return minutes + " min ago";
      }

      const hours =
        Math.floor(minutes / 60);

      if (hours < 24) {
        return hours + " hr ago";
      }

      const days =
        Math.floor(hours / 24);

      if (days < 7) {
        return days + " day" +
          (days === 1 ? "" : "s") +
          " ago";
      }

      return date.toLocaleDateString(
        [],
        {
          day: "numeric",
          month: "short",
          year: "numeric"
        }
      );
    }


    /* =========================
       DETERMINE NOTIFICATION
       ========================= */

    function youRemoNotificationDetails(notification) {

      const type =
        String(
          notification.type ||
          notification.notification_type ||
          ""
        ).toLowerCase();

      if (
        type.includes("request") ||
        type.includes("friend")
      ) {

        return {
          icon: "🤝",
          text: "You have a new friend connection notification.",
          action: "View"
        };
      }

      if (
        type.includes("message") ||
        type.includes("chat")
      ) {

        return {
          icon: "💬",
          text: "You have a new message.",
          action: "Open"
        };
      }

      return {
        icon: "🔔",
        text:
          notification.message ||
          notification.content ||
          "You have a new notification.",
        action: "View"
      };
    }


    /* =========================
       LOAD NOTIFICATIONS
       ========================= */

    async function youRemoLoadNotifications() {

      const list =
        document.getElementById(
          "notificationsList"
        );

      if (!list) return;

      list.innerHTML = `
        <div class="notifications-loading">
          Loading notifications...
        </div>
      `;


      youRemoNotificationsUser =
        await youRemoGetNotificationUser();


      if (!youRemoNotificationsUser) {

        list.innerHTML = `
          <div class="notifications-empty">

            <div class="notifications-empty-icon">
              🔐
            </div>

            <h2>
              Login Required
            </h2>

            <p>
              Login to your YouRemo account
              to see your notifications.
            </p>

          </div>
        `;

        youRemoUpdateUnreadCount();

        return;
      }


      /*
        We first try the "notifications" table.
      */

      try {

        const result =
          await supabaseClient
            .from("notifications")
            .select("*")
            .eq(
              "user_id",
              youRemoNotificationsUser.id
            )
            .order(
              "created_at",
              {
                ascending: false
              }
            );


        if (
          result.error
        ) {

          console.warn(
            "Notifications table unavailable:",
            result.error.message
          );

          /*
            Do not crash the page if the table
            does not exist yet.
          */

          youRemoNotificationsData = [];

          youRemoRenderNotifications();

          return;
        }


        youRemoNotificationsData =
          result.data || [];

        youRemoRenderNotifications();

      } catch (error) {

        console.error(
          "Notification loading exception:",
          error
        );

        youRemoNotificationsData = [];

        youRemoRenderNotifications();
      }
    }


    /* =========================
       RENDER
       ========================= */

    function youRemoRenderNotifications() {

      const list =
        document.getElementById(
          "notificationsList"
        );

      if (!list) return;


      if (
        !youRemoNotificationsData.length
      ) {

        list.innerHTML = `
          <div class="notifications-empty">

            <div class="notifications-empty-icon">
              🔔
            </div>

            <h2>
              You're all caught up
            </h2>

            <p>
              New friend requests, messages,
              and other activity will appear here.
            </p>

          </div>
        `;

        youRemoUpdateUnreadCount();

        return;
      }


      list.innerHTML =
        youRemoNotificationsData
          .map(
            notification => {

              const details =
                youRemoNotificationDetails(
                  notification
                );


              const unread =
                notification.read === false ||
                notification.is_read === false ||
                notification.seen === false;


              const unreadClass =
                unread
                  ? "unread"
                  : "";


              const message =
                notification.message ||
                notification.content ||
                details.text;


              const time =
                youRemoNotificationTime(
                  notification.created_at
                );


              return `
                <div
                  class="notification-item ${unreadClass}"
                  data-notification-id="${youRemoEscapeNotificationHtml(notification.id)}"
                >

                  <div class="notification-icon">
                    ${details.icon}
                  </div>

                  <div class="notification-content">

                    <p class="notification-message">
                      ${youRemoEscapeNotificationHtml(message)}
                    </p>

                    <div class="notification-time">
                      ${youRemoEscapeNotificationHtml(time)}
                    </div>

                  </div>

                  ${
                    unread
                      ? `
                        <div class="notification-dot"></div>
                      `
                      : ""
                  }

                  <button
                    type="button"
                    class="notification-action"
                    data-action="open"
                    data-id="${youRemoEscapeNotificationHtml(notification.id)}"
                  >
                    ${details.action}
                  </button>

                </div>
              `;

            }
          )
          .join("");


      list
        .querySelectorAll(
          ".notification-item"
        )
        .forEach(
          item => {

            item.addEventListener(
              "click",
              function(event) {

                if (
                  event.target.closest(
                    ".notification-action"
                  )
                ) {
                  return;
                }

                const id =
                  item.dataset.notificationId;

                youRemoMarkNotificationRead(
                  id
                );

              }
            );

          }
        );


      list
        .querySelectorAll(
          ".notification-action"
        )
        .forEach(
          button => {

            button.addEventListener(
              "click",
              function(event) {

                event.stopPropagation();

                const id =
                  button.dataset.id;

                youRemoMarkNotificationRead(
                  id
                );

              }
            );

          }
        );


      youRemoUpdateUnreadCount();
    }


    /* =========================
       UNREAD COUNT
       ========================= */

    function youRemoUpdateUnreadCount() {

      const badge =
        document.getElementById(
          "unreadCount"
        );

      if (!badge) return;


      const count =
        youRemoNotificationsData
          .filter(
            notification =>
              notification.read === false ||
              notification.is_read === false ||
              notification.seen === false
          )
          .length;


      badge.textContent =
        String(count);
    }


    /* =========================
       MARK ONE AS READ
       ========================= */

    async function youRemoMarkNotificationRead(
      notificationId
    ) {

      if (!notificationId) return;


      const notification =
        youRemoNotificationsData.find(
          item =>
            String(item.id) ===
            String(notificationId)
        );


      if (!notification) return;


      const updateData = {};


      if (
        Object.prototype.hasOwnProperty.call(
          notification,
          "read"
        )
      ) {
        updateData.read = true;
      }

      if (
        Object.prototype.hasOwnProperty.call(
          notification,
          "is_read"
        )
      ) {
        updateData.is_read = true;
      }

      if (
        Object.prototype.hasOwnProperty.call(
          notification,
          "seen"
        )
      ) {
        updateData.seen = true;
      }


      if (
        !Object.keys(updateData).length
      ) {

        return;
      }


      try {

        const result =
          await supabaseClient
            .from("notifications")
            .update(updateData)
            .eq(
              "id",
              notificationId
            );


        if (result.error) {

          console.error(
            "Mark notification read error:",
            result.error
          );

          return;
        }


        Object.assign(
          notification,
          updateData
        );


        youRemoRenderNotifications();

      } catch (error) {

        console.error(
          "Mark notification exception:",
          error
        );
      }
    }


    /* =========================
       MARK ALL READ
       ========================= */

    async function youRemoMarkAllNotificationsRead() {

      if (
        !youRemoNotificationsUser
      ) {
        return;
      }


      const unread =
        youRemoNotificationsData.filter(
          notification =>
            notification.read === false ||
            notification.is_read === false ||
            notification.seen === false
        );


      if (!unread.length) {
        return;
      }


      try {

        /*
          Update only columns that actually
          exist in the returned rows.
        */

        for (
          const notification of unread
        ) {

          const updateData = {};


          if (
            Object.prototype.hasOwnProperty.call(
              notification,
              "read"
            )
          ) {
            updateData.read = true;
          }

          if (
            Object.prototype.hasOwnProperty.call(
              notification,
              "is_read"
            )
          ) {
            updateData.is_read = true;
          }

          if (
            Object.prototype.hasOwnProperty.call(
              notification,
              "seen"
            )
          ) {
            updateData.seen = true;
          }


          if (
            !Object.keys(updateData).length
          ) {
            continue;
          }


          await supabaseClient
            .from("notifications")
            .update(updateData)
            .eq(
              "id",
              notification.id
            );


          Object.assign(
            notification,
            updateData
          );
        }


        youRemoRenderNotifications();

      } catch (error) {

        console.error(
          "Mark all notifications error:",
          error
        );
      }
    }


    /* =========================
       REALTIME
       ========================= */

    window.youRemoNotificationsChannel = null;


    function youRemoStartNotificationRealtime() {

      if (
        window.youRemoNotificationsChannel
      ) {

        try {

          supabaseClient.removeChannel(
            window.youRemoNotificationsChannel
          );

        } catch (error) {

          console.warn(
            "Could not remove notification channel:",
            error
          );
        }

        window.youRemoNotificationsChannel =
          null;
      }


      if (
        !youRemoNotificationsUser
      ) {
        return;
      }


      const channelName =
        "youremo-notifications-" +
        youRemoNotificationsUser.id +
        "-" +
        Date.now();


      window.youRemoNotificationsChannel =
        supabaseClient
          .channel(channelName)
          .on(
            "postgres_changes",
            {
              event: "INSERT",
              schema: "public",
              table: "notifications",
              filter:
                "user_id=eq." +
                youRemoNotificationsUser.id
            },
            function(payload) {

              if (
                payload &&
                payload.new
              ) {

                youRemoNotificationsData
                  .unshift(
                    payload.new
                  );

                youRemoRenderNotifications();
              }
            }
          )
          .subscribe(
            function(status) {

              console.log(
                "Notification realtime status:",
                status
              );

            }
          );
    }


    /* =========================
       INITIALIZATION
       ========================= */

    document.addEventListener(
      "DOMContentLoaded",
      async function() {

        console.log(
          "🔔 YouRemo Notifications page starting..."
        );


        const markAllButton =
          document.getElementById(
            "markAllButton"
          );


        if (markAllButton) {

          markAllButton.addEventListener(
            "click",
            youRemoMarkAllNotificationsRead
          );
        }


        youRemoNotificationsUser =
          await youRemoGetNotificationUser();


        await youRemoLoadNotifications();


        if (
          youRemoNotificationsUser
        ) {

          youRemoStartNotificationRealtime();

        }

      }
    );

  </script>
