<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouRemo - My Profile</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head><body>
<header class="nav">
  <a class="logo" href="index.html">YouRemo</a>
  <nav class="nav-links">
    <button onclick="goHome()">🏠</button><button onclick="goToFriends()">👥</button>
    <button onclick="goToRequests()">🔔 <span id="requestBadge" class="badge">0</span></button>
    <button onclick="goToMessages()">💬</button><button onclick="goToProfile()">👤</button>
  </nav>
  <div class="account">
    <button class="account-btn" id="loginButton" onclick="handleAccountClick()"><span id="navAvatar" class="avatar">?</span><span>Login</span></button>
    <div id="accountMenu" class="account-menu">
      <button onclick="goToProfile()">My Profile</button><button onclick="goToFriends()">My Friends</button>
      <button class="logout" onclick="logout()">Logout</button>
    </div>
  </div>
</header>

<main class="container page"><div class="page-head"><h1>My Profile</h1><p>Manage your YouRemo profile.</p></div>
<div class="profile-card"><div class="profile-top"><div id="profileAvatar" class="profile-avatar">?</div><div><h2 id="profileName">Your Name</h2><p id="profileUsername">@username</p><p id="profileBio">Not available</p></div></div>
<form id="profileForm" class="profile-form"><label>Full name<input id="profileFullName" placeholder="Full name"></label>
<label>Username<input id="profileUsernameInput" placeholder="Username"></label><label>Bio<textarea id="profileBioInput" placeholder="Tell people about yourself..."></textarea></label>
<div><button class="primary-btn" type="submit">Save Changes</button></div></form>
<div style="margin-top:22px"><label class="secondary-btn" style="display:inline-block">Change Photo<input id="avatarInput" type="file" accept="image/*" hidden></label></div>
<div style="margin-top:25px;padding-top:20px;border-top:1px solid #e7eaf2"><strong>Account Email:</strong> <span id="profileEmail">Not available</span></div>
</div></main>

<div id="authModal" class="modal">
  <div class="modal-card">
    <button class="modal-close" onclick="closeAuth()">×</button>
    <form class="auth-form" onsubmit="event.preventDefault(); document.querySelector('.auth-submit').click();">
      <h2 id="authTitle">Welcome Back</h2><p id="authSubtitle">Login to your YouRemo account</p>
      <input id="authName" style="display:none" placeholder="Full name" autocomplete="name">
      <input id="authUsername" style="display:none" placeholder="Username" autocomplete="username">
      <input id="authEmail" type="email" placeholder="Email" autocomplete="email">
      <input id="authPassword" type="password" placeholder="Password" autocomplete="current-password">
      <button class="primary-btn auth-submit" type="button" onclick="login()">Login</button>
      <button id="authSwitch" class="auth-switch" type="button" onclick="showSignup()">Create an account</button>
    </form>
  </div>
</div>
<div id="toast" class="toast"></div>
<script src="script.js"></script></body></html>
